<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ことわざ錬成 ─ ことわざクラフトRPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#0c1119; --sumi2:#131c2b; --panel:#16203247; --ai:#1b3a5c; --ai2:#2a5580;
  --kin:#d9a441; --kin2:#8a6a26; --shu:#c8452f; --shu2:#8f2f20;
  --kinari:#f3ead6; --aijiro:#a9c0d4; --gray:#8fa0b5; --take:#6fa96b;
  --sky1:#16273f; --sky2:#0b111c; --ground:#25405e;
  --notch: polygon(
    8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px,
    calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px),
    calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px),
    calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%,
    8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px),
    0 calc(100% - 8px), 0 8px, 4px 8px, 4px 4px, 8px 4px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:var(--sumi); color:var(--kinari);
  font-family:"DotGothic16","MS Gothic",monospace;
  font-size:15px; line-height:1.5; letter-spacing:.02em;
  -webkit-text-size-adjust:100%; image-rendering:pixelated; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
/* 麻の葉くずしの地紋 */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(60deg,rgba(169,192,212,.06) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(-60deg,rgba(169,192,212,.06) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(0deg,rgba(169,192,212,.05) 0 1px,transparent 1px 24px);
}
body::before{
  content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);
}
#app{position:relative;z-index:1;height:100vh;height:100dvh;max-width:560px;margin:0 auto;
  padding:6px 10px 8px;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;gap:7px}
.scr-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
.scr-foot{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.pane{min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hidden{display:none !important}
.grow{flex:1;min-height:0}

/* ---- 枠（金の二重線） ---- */
.px{clip-path:var(--notch);background:var(--sumi2);border:4px solid var(--ai2);
  box-shadow:inset 0 0 0 2px rgba(217,164,65,.28)}
.panel{padding:10px 12px}
.panel.dark{background:#0f1724}

.hud{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:2px 2px 4px}
.hud .t{font-size:17px;color:var(--kin);text-shadow:2px 2px 0 #000}
.hud .t::before{content:"◆";color:var(--shu);margin-right:6px;font-size:12px}
.hud .spacer{flex:1}
/* ハブ側の「まなびの基板」ボタン（左上固定）と見出しが重ならないようにする */
body:has(#manabi-back) .hud{padding-left:118px}
.tag{border:2px solid var(--ai2);background:#0f1724;color:var(--gray);font-size:11.5px;padding:0 7px}
.label{font-size:12px;color:var(--kin)}
.muted{color:var(--gray);font-size:12.5px}
.hr{height:2px;background:var(--ai2);margin:8px 0;opacity:.7}
.row{display:flex;gap:7px}.row>*{flex:1}

.btn{appearance:none;font-family:inherit;font-size:15px;color:var(--kinari);
  background:var(--ai);border:4px solid var(--ai2);clip-path:var(--notch);
  padding:9px 10px;width:100%;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);touch-action:manipulation}
@media (hover:hover){.btn:hover{background:#24557f}}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--shu);border-color:var(--kin);color:#fff4e0;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.12)}
@media (hover:hover){.btn.primary:hover{background:#dd5641}}
.btn.ghost{background:#0f1724;border-color:var(--ai);color:var(--gray);font-size:13px;padding:6px 9px}
.btn.snd{width:auto;padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn:focus-visible,.seal:focus-visible,.card:focus-visible,.k:focus-visible,.slot:focus-visible{outline:3px solid var(--kin);outline-offset:2px}

/* ---- スプライト ---- */
.spr{position:relative;display:inline-block;vertical-align:bottom}
.spr img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.spr img:nth-child(1){animation:frA 1.1s steps(1,end) infinite}
.spr img:nth-child(2){animation:frB 1.1s steps(1,end) infinite}
@keyframes frA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes frB{0%,49%{opacity:0}50%,100%{opacity:1}}
.spr.flash img{filter:brightness(0) invert(1)}

/* ---- 戦闘ステージ ---- */
.stage{position:relative;flex:1;min-height:118px;overflow:hidden;
  border:4px solid var(--ai2);clip-path:var(--notch);
  background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.stage .moon{position:absolute;top:12px;right:16px;width:26px;height:26px;
  background:#e8dcbb;box-shadow:0 0 0 4px rgba(232,220,187,.12)}
.stage .wave{position:absolute;left:0;right:0;bottom:38px;height:46%;opacity:.3;
  background-image:repeating-radial-gradient(circle at 50% 100%,transparent 0 9px,
    rgba(169,192,212,.55) 9px 10px,transparent 10px 18px);
  background-size:36px 18px}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:38px;background:var(--ground);
  border-top:4px solid rgba(217,164,65,.35)}
.stage .ground::after{content:"";position:absolute;inset:0;
  background-image:repeating-conic-gradient(rgba(0,0,0,.22) 0 25%,transparent 0 50%);
  background-size:16px 16px}
.stage .foe{position:absolute;left:50%;bottom:30px;transform:translateX(-50%)}
.stage .foe .spr{width:100% !important;height:100% !important}
.stage .foe{width:clamp(88px,19vh,168px);height:clamp(88px,19vh,168px)}
.stage .shadow{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  width:clamp(56px,12vh,110px);height:8px;background:rgba(0,0,0,.45)}
.stage.shake{animation:shk .28s steps(2,end)}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#0f1724;border:3px solid var(--shu);clip-path:var(--notch);
  color:#f6c9bf;font-size:12px;padding:2px 10px}
.dmg{position:absolute;bottom:56%;font-size:24px;color:var(--kin);
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000;animation:pop .9s steps(9,end) forwards;pointer-events:none}
.dmg.weak{color:#ff7a63}
@keyframes pop{0%{transform:translateY(8px);opacity:1}100%{transform:translateY(-40px);opacity:0}}

/* ---- ゲージ ---- */
.bar{position:relative;height:14px;background:#070b12;border:3px solid var(--ai2);padding:2px}
.bar>i{display:block;height:100%;background:var(--take);transition:width .25s steps(6,end)}
.bar.foe>i{background:var(--shu)}
.bar::after{content:"";position:absolute;inset:2px;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.5) 6px 8px)}
.pips{display:flex;gap:4px}
.pip{width:13px;height:13px;background:#070b12;border:3px solid var(--ai2)}
.pip.on{background:var(--kin);border-color:var(--kin)}
.statline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gray)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips span{font-size:11px;border:2px solid var(--kin);color:var(--kin);padding:0 5px}
.chips span.bad{border-color:var(--shu);color:#f6b5a9}
.log{font-size:12.5px;color:var(--aijiro);min-height:3.2em}
.log b{color:var(--kin)}

/* ---- 札 ---- */
.hand{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:11px 2px 6px}
#s-battle .col-a{display:flex;flex-direction:column;gap:7px;min-height:0;flex:1}
#s-map .col-a{display:flex;flex-direction:column;gap:7px;min-height:0;flex:1}
#s-map .col-a>.px:first-child{flex:1;display:flex;flex-direction:column;justify-content:center}
#s-map .col-b{flex:0 0 auto;padding:8px 10px}
#s-map .route{margin:14px 0 4px}
#s-map .tile .box{width:38px;height:38px}
.seal{flex:0 0 auto;width:88px;height:72px;cursor:pointer;position:relative;touch-action:manipulation;
  background:#e7dcc0;border:4px solid #6b4f27;clip-path:var(--notch);
  color:#1d1a12;font-family:inherit;font-size:15px;line-height:1.2;padding:8px 5px 6px;
  word-break:break-all;text-align:center;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.seal.long{font-size:13px}
.seal .el{position:absolute;left:0;right:0;top:0;height:6px}
.seal.sel{transform:translateY(-8px);border-color:var(--kin);box-shadow:inset 0 0 0 3px rgba(217,164,65,.5)}
.seal{transition:transform .18s cubic-bezier(.22,1,.36,1)}
.seal .ord{position:absolute;top:3px;right:3px;width:18px;height:18px;background:var(--shu);
  color:#fff;font-size:12px;line-height:18px;text-align:center}
.card{flex:0 0 auto;width:128px;min-height:72px;cursor:pointer;text-align:left;touch-action:manipulation;
  background:#16233a;border:4px solid var(--ai2);clip-path:var(--notch);
  color:var(--kinari);font-family:inherit;padding:7px 8px;
  display:flex;flex-direction:column;justify-content:space-between;gap:3px}
.card.sel{transform:translateY(-8px);border-color:var(--kin)}
.card .name{font-size:16px;color:var(--kin)}
.card .fx{font-size:12px;line-height:1.3;color:var(--aijiro)}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:4px}
.cost-badge{font-size:11px;color:#1d1a12;background:var(--kin);padding:0 5px}
.el-badge{font-size:11px;padding:0 5px;color:#0c1119}
.el-剛{background:var(--shu)}.el-柔{background:#4a7fb5}.el-智{background:var(--take)}
.dot-剛{background:var(--shu)}.dot-柔{background:#4a7fb5}.dot-智{background:var(--take)}
.actionbar{display:flex;gap:7px}.actionbar .btn{flex:1}

/* ---- 道中 ---- */
.route{display:flex;align-items:flex-end;margin:8px 0 2px}
.tile{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .box{width:34px;height:34px;background:#0f1724;border:3px solid var(--ai2);
  display:flex;align-items:center;justify-content:center}
.tile.done .box{border-color:var(--kin2);opacity:.7}
.tile.now .box{background:#3a2413;border-color:var(--kin);box-shadow:0 0 0 3px rgba(217,164,65,.22)}
.tile .you{height:30px;display:flex;align-items:flex-end}
.tile .n{font-size:10.5px;color:var(--gray)}
.tile.now .n{color:var(--kin)}
.tile::after{content:"";position:absolute;bottom:22px;left:63%;right:-37%;height:4px;
  background:repeating-linear-gradient(90deg,var(--ai2) 0 4px,transparent 4px 8px)}
.tile:last-child::after{display:none}
.chaphead{display:flex;align-items:center;gap:9px}
.chaphead .num{font-size:11.5px;color:#fff4e0;background:var(--shu);padding:1px 7px}
.chaphead h2{margin:0;font-size:19px;font-weight:normal;letter-spacing:.08em}

/* ---- 錬成所 ---- */
.circle{position:relative;max-width:340px;margin:6px auto;display:grid;
  grid-template-columns:1fr 1fr;gap:7px;padding:8px;background:#0f1724;
  border:4px solid var(--ai2);clip-path:var(--notch)}
.circle.ok{border-color:var(--kin);animation:glow .8s steps(2,end) infinite}
@keyframes glow{0%,49%{box-shadow:inset 0 0 0 4px rgba(217,164,65,.4)}50%,100%{box-shadow:none}}
.slot{min-height:52px;background:#080d15;border:3px dashed #2a5580;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.25;padding:6px 8px;
  text-align:center;word-break:break-all;color:#2a5580;position:relative}
.slot .no{position:absolute;top:2px;left:5px;font-size:11px;color:#2a5580}
.slot.filled .no{color:#8a6a3a}
.slot.opt{border-style:dotted;opacity:.75}
.slot.filled{background:#e7dcc0;border:3px solid #6b4f27;color:#1d1a12}
.k .u{position:absolute;top:4px;left:3px;font-size:11px;font-weight:700;line-height:1}
.u0{color:#c8452f}.u1{color:#2f6b3a}.u2{color:#8a7f66}.u3{color:#b9b0a0}
.grouphead{font-size:12px;color:var(--kin);margin:8px 0 4px;border-bottom:1px solid var(--ai2);padding-bottom:2px}
.grouphead:first-child{margin-top:0}
.sortrow{display:flex;gap:6px;flex:0 0 auto}
.sortrow .btn{flex:1;padding:5px 6px;font-size:12px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.k{min-height:50px;position:relative;cursor:pointer;font-family:inherit;font-size:14px;line-height:1.2;touch-action:manipulation;
  background:#e7dcc0;border:3px solid #6b4f27;color:#1d1a12;padding:9px 6px 10px;word-break:break-all;text-align:center;
  display:flex;align-items:center;justify-content:center}
.k .n{position:absolute;bottom:0;right:3px;font-size:11px;color:#6b5236}
.k .el{position:absolute;left:0;right:0;top:0;height:5px}
.k.off{opacity:.3}

/* ---- 図鑑 ---- */
.foecard{display:flex;gap:9px;align-items:center;margin-top:4px}
.foeinfo{flex:1;min-width:0;line-height:1.35}
.foename{font-size:15px;color:var(--kin)}
.foecard .statline{gap:6px;font-size:12px}
.foecard .muted{font-size:11.5px}
.dexgrid{display:grid;grid-template-columns:1fr;gap:6px}
.dex-item{border:3px solid var(--ai2);background:#0f1724;padding:7px 10px}
.dex-item.got{border-color:var(--kin);background:#16233a}
.dex-word{font-size:20px;letter-spacing:.12em}
.dex-word .mask{color:#2a3d55}
.dex-yomi{font-size:11.5px;color:var(--gray)}
.near{color:var(--kin);font-size:11.5px}
.dextabs{display:flex;gap:6px;flex:0 0 auto}
.dextabs .btn{flex:1;padding:6px 6px;font-size:13px;min-height:40px}
.dextabs .btn.on{background:var(--kin);border-color:var(--kin);color:#1a1208}
.kindtag{font-size:11px;color:var(--gray);border:2px solid var(--ai2);padding:0 5px;margin-left:6px;vertical-align:middle}
.dex-word{font-size:17px;letter-spacing:.04em}
.dex-word .mask{color:#2a3d55}
.dex-item{display:flex;flex-direction:column;gap:2px}
.dex-item .dex-mean{font-size:12.5px;color:var(--gray)}

/* ---- 表紙 ---- */
#s-title .wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:10px}
.logo{display:flex;justify-content:center;gap:5px}
.logo span{width:clamp(36px,6vh,50px);height:clamp(44px,7.6vh,60px);background:var(--shu);
  border:4px solid var(--kin);color:#fff4e0;font-size:clamp(22px,3.8vh,30px);
  display:flex;align-items:center;justify-content:center;clip-path:var(--notch);
  text-shadow:2px 2px 0 rgba(0,0,0,.5);animation:drop .5s steps(4,end) backwards}
.logo span:nth-child(2){animation-delay:.12s}
.logo span:nth-child(3){animation-delay:.24s}
.logo span:nth-child(4){animation-delay:.36s}
.logo span:nth-child(5){animation-delay:.48s}
.logo span:nth-child(6){animation-delay:.6s}
.logo{gap:4px}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.blink{animation:bl 1s steps(1,end) infinite;color:var(--kin)}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.15}}
.parade{display:flex;justify-content:center;gap:12px}
.celebox{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.celeinner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.celebrate{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.celebrate i{position:absolute;top:-14px;width:8px;height:8px;animation-name:fall;
  animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translateY(-14px) rotate(0deg);opacity:1}
  100%{transform:translateY(420px) rotate(180deg);opacity:.2}}
.scrollwrap{position:relative;width:100%;max-width:400px;height:76px;overflow:hidden;
  border-top:2px solid var(--kin2);border-bottom:2px solid var(--kin2);margin:6px 0}
.scrollin{position:absolute;left:0;right:0;top:100%;color:var(--kin);font-size:15px;
  line-height:1.9;text-align:center;animation:scrollup 46s linear infinite}
@keyframes scrollup{from{transform:translateY(0)}to{transform:translateY(-1400px)}}
.shukuseal{width:52px;height:52px;background:var(--shu);border:4px solid var(--kin);
  color:#fff4e0;font-size:28px;line-height:44px;margin-bottom:10px;clip-path:var(--notch);
  animation:pulse .9s steps(2,end) infinite}
@keyframes pulse{0%,49%{box-shadow:0 0 0 4px rgba(217,164,65,.35)}50%,100%{box-shadow:none}}
.celetitle{font-size:20px;color:var(--kin);margin-top:8px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,14,.85);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{max-width:360px;width:100%}
.hardtag{border-color:var(--shu);color:#f6b5a9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:50;
  background:#16233a;border:4px solid var(--kin);clip-path:var(--notch);
  color:var(--kinari);padding:8px 14px;font-size:13px;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s steps(2,end)}
.toast.show{opacity:1}

/* ================= 画面サイズ別 ================= */
/* スマホ（縦） */
@media (max-width:599px){
  body{font-size:14px}
  .card{width:118px;min-height:66px}
  .seal{width:80px;height:66px;font-size:14px}.seal.long{font-size:12.5px}
  .log{min-height:2.6em;font-size:12px}
  .panel{padding:8px 10px}
  .dex-word{font-size:18px}
}
@media (max-height:640px){
  .stage{min-height:96px}
  .seal{height:60px}.card{min-height:60px}
  .hud{padding:0}
  .log{min-height:2.2em}
}
/* タブレット */
@media (min-width:600px) and (max-width:1023px){
  body{font-size:16px}
  #app{max-width:720px;padding:10px 16px 12px}
  body:has(#manabi-back) .hud{padding-left:clamp(0px,472px - 50vw,118px)}
  .stage .foe{width:clamp(120px,24vh,210px);height:clamp(120px,24vh,210px)}
  .seal{width:98px;height:80px;font-size:16px}.seal.long{font-size:14px}
  .card{width:150px}
  .dexgrid{grid-template-columns:1fr 1fr}
  .inv{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
}
/* PC：戦闘は二段組 */
@media (min-width:1024px){
  body{font-size:16px}
  #app{max-width:1080px;padding:12px 22px 14px}
  body:has(#manabi-back) .hud{padding-left:clamp(0px,646px - 50vw,106px)}
  .stage .foe{width:clamp(140px,26vh,240px);height:clamp(140px,26vh,240px)}
  .seal{width:100px;height:78px;font-size:16px}.seal.long{font-size:14px}
  .card{width:158px}
  .dexgrid{grid-template-columns:1fr 1fr 1fr}
  .inv{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  #s-battle .scr-body{flex-direction:row}
  #s-battle .col-a{flex:1.35;display:flex;flex-direction:column;gap:7px;min-height:0}
  #s-battle .col-b{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0}
  #s-battle .log{min-height:5em}
  #s-map .scr-body{flex-direction:row}
  #s-map .col-a{flex:1.7}

</head>

<div id="app">

<!-- ===== タイトル ===== -->
<section id="s-title" class="screen">

    <button class="btn hidden" id="contbtn" onclick="continueGame()">つづきから</button>

  </div>
</section>

   ピルは 中1＝g≤1、中2＝g≤2、中3＝全部。 */
const GRADE_KEY = "manabi-grade:kotowaza-rensei";
const GRADE_NAMES = {1:"中1", 2:"中2", 3:"中3"};
const hubGrade = () => (window.LearnHub && LearnHub.grade) ? LearnHub.grade() : 3;
function normGrade(g){ g = Number(g); return (g===1||g===2||g===3) ? g : 0; }
let GRADE = (function(){ let g = 0; try{ g = normGrade(localStorage.getItem(GRADE_KEY)); }catch(e){} return g || normGrade(hubGrade()) || 3; })();
function setGrade(g){
  g = normGrade(g); if(!g) return;
  GRADE = g; try{ localStorage.setItem(GRADE_KEY, String(g)); }catch(e){}
  paintGrade();
}
function paintGrade(){
  document.querySelectorAll("#gradeRow .btn").forEach(function(b){
    const on = Number(b.dataset.grade)===GRADE;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on?"true":"false");
  });
}
function gradeTag(){ return GRADE<3 ? '<span class="tag gradetag">'+GRADE_NAMES[GRADE]+'</span>' : ''; }
function POOL(){ return PROVERBS.filter(o => o.g <= GRADE); }
function dexTotal(){ return POOL().length; }
function craftedInPool(){ return G.crafted.filter(function(w){ const o = idiomOf(w); return o && o.g <= GRADE; }).length; }
let _gk = {};
function gradeKanjiList(){
  if(!_gk[GRADE]){ const set = {}; POOL().forEach(o => o.p.forEach(c => set[c]=1)); _gk[GRADE] = Object.keys(set); }
  return _gk[GRADE];
}
/* 並びが学年の範囲内の実在語か／範囲外の実在語か */
function findInPool(w){ return POOL().find(function(o){ return o.w===w; }) || null; }
function findAny(w){ return PROVERBS.find(function(o){ return o.w===w; }) || null; }

/* =========================================================
   音（和楽器風シンセ・外部ファイルなし）
   ========================================================= */
const AU = {ctx:null, mas:null, on:true, timer:null, cur:null, step:0, next:0, nz:null};
function actx(){
  if(!AU.ctx){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    try{
      AU.ctx = new C();
      AU.mas = AU.ctx.createGain(); AU.mas.gain.value = 0.22; AU.mas.connect(AU.ctx.destination);
      const len = AU.ctx.sampleRate*0.5, buf = AU.ctx.createBuffer(1,len,AU.ctx.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      AU.nz = buf;
    }catch(e){ return null; }
  }
  if(AU.ctx.state === "suspended") AU.ctx.resume();
  return AU.ctx;
}
function envGain(src,t,a,d,peak){
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  src.connect(g); g.connect(AU.mas); return g;
}
/* 箏・三味線風の撥弦音 */
function pluck(f,t,dur,vol){
  const c = actx(); if(!c||!AU.on||!f) return;
  const o = c.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(f,t);
  const o2 = c.createOscillator(); o2.type = "sine"; o2.frequency.setValueAtTime(f*2.02,t);
  envGain(o,t,0.004,dur,vol||0.16); envGain(o2,t,0.003,dur*0.35,(vol||0.16)*0.45);
  o.start(t); o.stop(t+dur+0.05); o2.start(t); o2.stop(t+dur*0.4+0.05);
}
function tone(f,t,dur,type,vol){
  const c = actx(); if(!c||!AU.on||!f) return;
  const o = c.createOscillator(); o.type = type||"square"; o.frequency.setValueAtTime(f,t);
  envGain(o,t,0.005,dur,vol||0.14); o.start(t); o.stop(t+dur+0.05);
}
function slide(f1,f2,t,dur,type,vol){
  const c = actx(); if(!c||!AU.on) return;
  const o = c.createOscillator(); o.type = type||"sawtooth";
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  envGain(o,t,0.005,dur,vol||0.14); o.start(t); o.stop(t+dur+0.05);
}
/* 鼓・太鼓風 */
function drum(t,dur,vol,cut,q){
  const c = actx(); if(!c||!AU.on||!AU.nz) return;
  const src = c.createBufferSource(); src.buffer = AU.nz;
  const bq = c.createBiquadFilter(); bq.type = "bandpass"; bq.frequency.value = cut||1200; bq.Q.value = q||1.2;
  src.connect(bq); envGain(bq,t,0.002,dur,vol||0.12); src.start(t); src.stop(t+dur+0.05);
}
function sfx(name){
  const c = actx(); if(!c||!AU.on) return;
  const t = c.currentTime;
  switch(name){
    case "tap":   tone(1046,t,0.05,"square",0.09); break;
    case "slash": drum(t,0.09,0.16,2600,0.8); slide(760,220,t,0.14,"square",0.12); break;
    case "idiom": [0,3,7,12].forEach(function(n,i){ pluck(392*Math.pow(2,n/12),t+i*0.055,0.32,0.16); }); break;
    case "craft": [0,2,7,9,12].forEach(function(n,i){ pluck(523*Math.pow(2,n/12),t+i*0.07,0.5,0.17); });
                  drum(t,0.4,0.1,600,0.6); break;
    case "ng":    tone(180,t,0.12,"square",0.12); tone(140,t+0.13,0.2,"square",0.12); break;
    case "hurt":  drum(t,0.16,0.2,320,0.7); slide(300,90,t,0.22,"sawtooth",0.13); break;
    case "heal":  [0,4,7].forEach(function(n,i){ pluck(523*Math.pow(2,n/12),t+i*0.08,0.45,0.14); }); break;
    case "get":   pluck(784,t,0.25,0.15); pluck(1046,t+0.09,0.35,0.15); break;
    case "gong":  drum(t,1.2,0.22,180,0.5); tone(98,t,1.1,"sine",0.16); tone(147,t+0.02,0.9,"sine",0.08); break;
    case "win":   [0,4,7,12,7,12].forEach(function(n,i){ pluck(523*Math.pow(2,n/12),t+i*0.11,0.5,0.18); });
                  drum(t,0.5,0.14,500,0.6); break;
    case "lose":  [0,-2,-5,-9].forEach(function(n,i){ tone(392*Math.pow(2,n/12),t+i*0.18,0.4,"triangle",0.13); }); break;
  }
}

function freqOf(t,d){
  if(d<0) return 0;
  const n = t.sc.length, oct = Math.floor(d/n);
  return t.root*Math.pow(2,(t.sc[((d%n)+n)%n]+12*oct)/12);
}
function stopSeq(){ if(AU.timer){ clearInterval(AU.timer); AU.timer=null; } }
function playBGM(name){
  if(AU.cur===name && AU.timer) return;
  AU.cur = name; stopSeq();
  if(!name || !AU.on || !actx()) return;
  AU.step = 0; AU.next = AU.ctx.currentTime+0.08;
  AU.timer = setInterval(seqTick,25);
}
function seqTick(){
  const t = TUNES[AU.cur]; if(!t||!AU.ctx){ stopSeq(); return; }
  const spb = 60/t.bpm/2;
  while(AU.next < AU.ctx.currentTime+0.16){
    const i = AU.step%16, at = AU.next;
    if(t.mel[i]>=0) pluck(freqOf(t,t.mel[i]),at,spb*1.7,0.15);
    if(t.bas[i]>=0) tone(freqOf(t,t.bas[i])/2,at,spb*1.3,"triangle",0.12);
    if(t.per[i]) drum(at,0.07,t.per[i]===2?0.14:0.08,t.per[i]===2?260:1500,t.per[i]===2?0.6:1.4);
    AU.next += spb; AU.step++;
  }
}
function toggleSound(){
  AU.on = !AU.on;
  try{ if(window.MJ) MJ.setMuted(!AU.on); }catch(e){}
  if(!AU.on){ stopSeq(); }
  else { const c = AU.cur; AU.cur = null; playBGM(c||"field"); }
  const b = document.getElementById("sndbtn");
  if(b) b.textContent = AU.on ? "音 ON" : "音 OFF";
}

const SPRC = {};
function sprURL(key,f){
  const k = key+"|"+f; if(SPRC[k]) return SPRC[k];
  const sp = SPR[key]; if(!sp) return "";
  const W=16,H=16, c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d"); if(!g) return "";
  const rows=sp.r, center=key.indexOf("i_")===0;
  const top=(center?Math.floor((H-rows.length)/2):H-rows.length-1)+f;
  rows.forEach(function(row,y){
    const pad=Math.floor((W-row.length)/2);
    for(let x=0;x<row.length;x++){
      const ch=row[x]; if(ch===".") continue;
      g.fillStyle=sp.p[+ch-1]||"#f0f"; g.fillRect(pad+x, top+y, 1, 1);
    }
  });
  return SPRC[k]=c.toDataURL();
}
function sprHTML(key,size,id){
  return '<span class="spr" '+(id?'id="'+id+'"':'')+' style="width:'+size+'px;height:'+size+'px">'+
    '<img src="'+sprURL(key,0)+'" alt=""><img src="'+sprURL(key,1)+'" alt=""></span>';
}

function toWord(x){ return x; }
/* 壊れた項目を落として、読み込んだ記録を安全な状態にそろえる */
function sanitizeSave(){
  G.crafted = (G.crafted||[]).map(toWord).filter(function(w){ return !!idiomOf(w); });
  G.crafted = G.crafted.filter(function(w,i){ return G.crafted.indexOf(w)===i; });
  G.deckIdiom = (G.deckIdiom||[]).map(toWord)
    .filter(function(w){ return idiomOf(w) && G.crafted.indexOf(w)>=0; })
    .slice(0, maxIdiomDeck());
  G.deckKanji = (G.deckKanji||[]).filter(function(c){ return !!PARTS[c]; }).slice(0, maxKanjiDeck());
  const inv = {};
  for(const c in G.inv){ if(PARTS[c] && G.inv[c]>0) inv[c] = G.inv[c]; }
  G.inv = inv;
  const pl = {};
  for(const k in (G.plus||{})){ const w = toWord(k); if(idiomOf(w)) pl[w] = Math.min(MAX_PLUS, G.plus[k]|0); }
  G.plus = pl;
  G.rankShown = rankLv();
}

    G.chapter=Math.min(d.ch||0, CHAPTERS.length-1); G.node=d.nd||0; G.hp=d.hp||70; G.maxhp=d.mx||70; G.retry=d.rt||0;
    G.hard=!!d.hd; G.endless=!!d.ed; G.depth=d.dp||0; G.bestN=d.bn||0; G.bestH=d.bh||0; G.cleared=false; ensureLayers();
    G.inv=d.inv||{}; G.crafted=d.cr||[]; G.deckKanji=d.dk||[]; G.deckIdiom=d.di||[];
    G.plus=d.pl||{};
    sanitizeSave();

  }catch(e){ return false; }

function refillDeck(){
  for(const c in G.inv){
    while(deckKanjiCount(c) < G.inv[c] && G.deckKanji.length < maxKanjiDeck()) G.deckKanji.push(c);
  }

function removeFromDeckKanji(c){
  const i = G.deckKanji.indexOf(c); if(i>=0) G.deckKanji.splice(i,1);
}
function deckKanjiCount(c){ return G.deckKanji.filter(x=>x===c).length; }

/* 未錬成のことわざのうち、あと少しで完成するものの不足語句を優先して配る */
function missingOf(idiom){
  const need = {}; idiom.p.forEach(c=>need[c]=(need[c]||0)+1);
  const miss = [];
  for(const c in need){ const lack = need[c]-(G.inv[c]||0); for(let i=0;i<lack;i++) miss.push(c); }
  return miss;
}
function rollKanji(){
  const pool = POOL().filter(o=>!G.crafted.includes(o.w)).map(o=>({o,m:missingOf(o)})).filter(x=>x.m.length>0);
  if(pool.length && Math.random()<0.7){
    const min = Math.min(...pool.map(x=>x.m.length));
    const near = pool.filter(x=>x.m.length<=min+1);
    const pick = near[Math.floor(Math.random()*near.length)];
    return pick.m[Math.floor(Math.random()*pick.m.length)];
  }
  const kl = gradeKanjiList();
  return kl[Math.floor(Math.random()*kl.length)];
}

function genLayer(i){
  const d = i - STORY_LEN + 1;
  const pool = [];
  CHAPTERS.slice(0,STORY_LEN).forEach(function(c){
    c.foes.forEach(function(f){ pool.push(f); });
    pool.push(c.boss);
  });
  const els = ["剛","柔","智"];
  const pick = function(){ return pool[Math.floor(Math.random()*pool.length)]; };
  const mk = function(f,boss){
    const hpS = 1 + (d-1)*0.34, atS = 1 + (d-1)*0.17;
    return {n:(boss?"深奥の":"")+f.n, g:f.g,
      hp:Math.round((boss?260:120)*hpS), atk:Math.round((boss?28:23)*atS),
      weak:els[Math.floor(Math.random()*3)], pat:f.pat};
  };
  return {name:"無限回廊 第"+d+"層", endless:true, nodes:["敵","宝","敵","泉","問","敵","主"],
    foes:[mk(pick()),mk(pick()),mk(pick())], boss:mk(pick(),true)};
}

let B = null;

function buildDeck(){
  const d = [];
  G.deckKanji.forEach(c=>d.push({t:"k", c:c, el:PARTS[c].el}));
  G.deckIdiom.forEach(function(id){ if(idiomOf(id)) d.push({t:"i", id:id}); });
  if(d.length===0) d.push({t:"k", c:"一", el:"剛"});
  return shuffle(d);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 敵の底上げ（章が進むほど強く）。hp/atk 倍率 */
function foeTune(){
  const ch = Math.min(G.chapter, STORY_LEN+6);
  return {hp: 1.25 + ch*0.06, atk: 1.1 + ch*0.035};
}
function startBattle(foe, isBoss){
  fixDeck();
  document.body.className = "ch"+G.chapter;
  playBGM(isBoss?"boss":"battle"); if(isBoss) sfx("gong");
  B = {
    en:{n:foe.n,g:foe.g,
        hp:Math.round(foe.hp*(G.hard?HARD.hp:1)*foeScale().hp*foeTune().hp),
        maxhp:Math.round(foe.hp*(G.hard?HARD.hp:1)*foeScale().hp*foeTune().hp),
        atk:Math.round(foe.atk*(G.hard?HARD.atk:1)*foeScale().atk*foeTune().atk),
        weak:foe.weak,pat:foe.pat,pi:0,buff:0,guard:0},
    boss:!!isBoss, turn:0, energy:baseEnergy(), maxEnergy:baseEnergy(), penalty:0,
    draw:buildDeck(), hand:[], discard:[], exhaust:[],
    atkBuff:G.chapter*(G.hard?HARD.power:3)+rankPower(), shield:0, grind:false, counter:null, poison:null,
    fog:0, surround:0, storyN:0, grindOn:0, sel:[], log:[], over:false, rage:false, lastDmg:0, taken:0, endure:false, atkDownNext:0,
    reshuffled:false
  };
  for(let i=0;i<5;i++) drawCard();
  B.en.intent = B.en.pat[0];
  startPlayerTurn(true);
}

function drawCard(){
  if(B.hand.length>=9) return null;
  if(B.draw.length===0){
    if(B.discard.length===0) return null;
    if(B.reshuffled){ if(!B.noDrawLogged){ B.noDrawLogged=true; log("山札が尽きた。この手番はもう引けない"); } return null; }
    B.reshuffled = true;
    B.draw = shuffle(B.discard); B.discard = [];
  }
  const c = B.draw.pop(); B.hand.push(c); return c;
}
function log(s){ B.log.unshift(s); B.log = B.log.slice(0,3); }

function startPlayerTurn(first){
  B.turn++;
  B.reshuffled = false; B.noDrawLogged = false;
  if(!first) for(let i=0;i<3;i++) drawCard();
  B.energy = Math.max(0, B.maxEnergy - B.penalty); B.penalty = 0;
  if(B.atkDownNext){ B.atkBuff = Math.max(0,B.atkBuff-B.atkDownNext); B.atkDownNext = 0; }
  if(B.grind){ B.atkBuff += B.grind; log("積み重ねの力：攻撃力が上がった（+"+B.atkBuff+"）"); }
  if(B.poison && B.poison.t>0){
    B.en.hp -= B.poison.d; B.poison.t--;
    log("身から出た錆：敵は自らの行いに <b>"+B.poison.d+"</b> ダメージ");
    if(B.poison.t<=0) B.poison=null;
    if(B.en.hp<=0) return victory();
  }
  if(B.counter){
    B.counter.t--;
    if(B.counter.t<=0){
      const d = B.counter.stored*2; B.counter=null;
      if(d>0){ hitEnemy(d,null,true); log("待てば海路：たえた痛みを <b>"+d+"</b> ダメージで返した"); }
      else log("待てば海路：構えを解いた");
      if(B.en.hp<=0) return victory();
    }
  }
  if(B.fog>0) B.fog--;
  if(B.surround>0) B.surround--;
  B.sel = [];
  renderBattle();
}

function hitEnemy(base, el, ignoreGuard, mul){
  let d = base + B.atkBuff;
  if(mul) d = Math.max(1, Math.floor(d*mul));
  if(el && el===B.en.weak) d = Math.floor(d*1.5);
  if(B.surround>0) d = Math.floor(d*1.4);
  if(!ignoreGuard && B.en.guard>0){
    const a = Math.min(B.en.guard, d); B.en.guard -= a; d -= a;
  }
  B.en.hp -= d; B.lastDmg = d;
  flashFoe(); popDamage(d, !!(el && el===B.en.weak)); sfx("slash");
  return d;
}
function hurtPlayer(raw){
  let d = raw;
  if(B.fog>0) d = Math.floor(d*0.6);
  if(B.counter){ d = Math.floor(d*0.5); B.counter.stored += d; }
  if(B.shield>0){ const a=Math.min(B.shield,d); B.shield-=a; d-=a; }
  if(B.endure && G.hp-d<=0){ d = Math.max(0,G.hp-1); B.endure=false; log("七転び八起き：ぎりぎりで持ちこたえた"); }
  G.hp -= d; B.taken += d; if(d>0) sfx("hurt"); return d;
}

/* --- カード選択 --- */
function tapCard(i){
  if(!B || B.over) return;
  if(LP.fired){ LP.fired=false; return; }
  sfx("tap");
  const p = B.sel.indexOf(i);
  if(p>=0){ B.sel.splice(p,1); }
  else{
    const c = B.hand[i];
    if(c.t==="i"){ B.sel = [i]; }
    else{ if(B.sel.some(j=>B.hand[j].t==="i")) B.sel=[]; if(B.sel.length<4) B.sel.push(i); }
  }
  renderBattle();
}

function selWord(){ return B.sel.map(i=>B.hand[i]).filter(c=>c.t==="k").map(c=>c.c).join(""); }

function useSelected(){
  if(!B || B.over || B.sel.length!==1) return;
  const idx = B.sel[0], c = B.hand[idx];
  if(c.t==="k"){
    if(B.energy<1) return toast("気力が足りない");
    B.energy--;
    const d = hitEnemy(6, c.el);
    log("「"+c.c+"」を投げつけた　<b>"+d+"</b> ダメージ");
    B.discard.push(c); B.hand.splice(idx,1); B.sel=[];
    afterAction();
  }else{
    playIdiom(idiomOf(c.id), idx);
  }
}

/* 「唱える」：手札の語句カード 2〜4 枚を押した順に並べて発動する。
   学年範囲内の実在語 → 真価（本来の効果。初回は図鑑登録＋編成に完成カード追加）
   範囲外の実在語     → まだ知らぬ言葉（通常ダメージ、登録なし）
   一致しない並び     → ニセことわざ（通常ダメージの 1/3、追加効果なし。正解は教えない） */
const NORMAL_BASE = 10;
function craftInBattle(){
  if(!B || B.over) return;
  const sel = B.sel.filter(i=>B.hand[i] && B.hand[i].t==="k");
  if(sel.length<2 || sel.length>4) return;
  const w = selWord();
  if(B.energy<1) return toast("気力が足りない");
  const found = findInPool(w), any = found || findAny(w);
  B.energy--;
  const firstEl = B.hand[sel[0]].el;
  const idxs = sel.slice().sort((a,b)=>b-a);
  idxs.forEach(i=>{ B.discard.push(B.hand[i]); B.hand.splice(i,1); });
  B.sel=[];
  if(!found){
    if(any){
      sfx("slash");
      const d = hitEnemy(P(NORMAL_BASE), firstEl);
      log("「"+w+"」……まだ知らぬ言葉だ　<b>"+d+"</b> ダメージ");
    }else{
      sfx("ng");
      const d = hitEnemy(P(NORMAL_BASE), null, false, 1/3);
      log("「"+w+"」……どこかちがう　<b>"+d+"</b> ダメージ");
      try{ if(window.MJ){ const st=document.getElementById("stage"); if(st) MJ.shake(st, 3); } }catch(e){}
    }
    return afterAction();
  }
  sfx("craft");
  log("<b>真価</b>　"+found.w+"（"+found.y+"）！");
  try{ if(window.MJ){ const fs=document.getElementById("foe-spr"); if(fs) MJ.burst(fs,{count:12,color:"#d9a441",color2:"#f3ead6"}); } }catch(e){}
  const newly = !G.crafted.includes(found.w);
  if(newly){
    G.crafted.push(found.w);
    if(G.deckIdiom.length<maxIdiomDeck()) G.deckIdiom.push(found.w);
    toast(found.w+" を図鑑に登録した");
    checkRank();
  }else if(plusOf(found) < MAX_PLUS){
    G.plus[found.w] = plusOf(found)+1;
    toast(found.w+" を練り上げた（+"+G.plus[found.w]+"）");
  }
  applyEffect(found);
}

function playIdiom(o, idx){
  if(B.energy < o.cost) return toast("気力が足りない");
  B.energy -= o.cost;
  const card = B.hand[idx];
  B.hand.splice(idx,1); B.sel=[];
  if((o.e||{}).sp==="once") B.exhaust.push(card); else B.discard.push(card);
  log("<b>"+o.w+"</b>（"+o.y+"）");
  sfx("idiom");
  applyEffect(o);
}

/* ことわざの威力は階層に応じて伸びる */
function P(n){ return Math.max(1, Math.round(n*(1 + G.chapter*0.28))); }
/* 練り上げ（同じことわざをもう一度錬成すると強くなる） */
function plusOf(o){ return (G.plus && G.plus[o.w]) ? G.plus[o.w] : 0; }
function P2(o,n){ return Math.max(1, Math.round(P(n)*(1 + 0.12*plusOf(o)))); }
function plusTotal(){ let n=0; for(const k in (G.plus||{})) n += G.plus[k]; return n; }
function cardName(o){ const pl = plusOf(o); return o.w + (pl? " +"+pl : ""); }
const SP_DESC = {
 drop:"語句を1枚ひろう", grind:"毎ターン攻撃力+2", grind3:"毎ターン攻撃力+3",
 revenge:"3ターン被害半減。ためた分の2倍を返す", recoil:"次のターンの気力-2", recoil1:"次のターンの気力-1",
 recall:"捨て札の完成カードを1枚手札へ", fog:"3ターン敵の攻撃-40%", poison:"4ターン継続ダメージ",
 once:"1回の戦闘で一度きり", surround:"3ターン敵の被ダメージ+40%",
 dispel:"敵の強化とまもりを消す", guardbreak:"敵のまもりを断ち切る", steal:"敵の強化を奪う",
 random:"錬成ずみからランダムに1つ発動", toss:"1枚すてて2枚ひく", noshield:"自分のまもりは0になる",
 stun:"敵の次の行動を空ぶらせる", redraw:"手札を5枚ひきなおす", search:"山札から完成カードを1枚手札へ",
 recycle:"捨て札の語句を3枚山札へ", endure:"一度だけHP1で耐える", makeweak:"弱点属性の語句を1枚つくる",
 slowdown:"次のターンは攻撃力-4", drain:"与えたダメージの半分を回復", soften:"敵の次の攻撃を半減", };
const SP_DMG = {turnmul:1,handcount:1,lowhp:1,enemylow:1,story:1,mirror:1,
  reflect:1,repeat:1,allelem:1,varied:1,gamble:1,crit:1};
function dmgText(o){
  const e = o.e||{}, v = e.d ? P2(o,e.d) : 0, h = e.h||1, sp = e.sp||"";
  switch(sp){
    case "turnmul":   return "経過ターン×"+v+"ダメージ";
    case "handcount": return "手札の語句1枚につき"+v+"ダメージ";
    case "lowhp":     return v+"〜"+(v+Math.floor(v*2.2))+"ダメージ（自分のHPが少ないほど大きい）";
    case "enemylow":  return v+"〜"+(v+Math.floor(v*2.2))+"ダメージ（敵のHPが減っているほど大きい）";
    case "story":     return "唱えるたび "+v+"→"+(v*2)+"→"+(v*3)+"→"+(v*4)+"ダメージと積み上がる";
    case "mirror":    return "敵の攻撃力とおなじダメージ";
    case "reflect":   return "これまで受けたダメージの4割を返す";
    case "repeat":    return "直前にあたえたダメージをもう一度";
    case "allelem":   return "剛・柔・智で"+v+"ダメージずつ";
    case "varied":    return v+"ダメージ×"+h+"回（属性はランダム）";
    case "gamble":    return "五分五分で "+Math.round(v*1.8)+" か "+Math.round(v*0.4)+"ダメージ（低いほうなら1枚ドロー）";
    case "crit":      return v+"ダメージ。敵が渾身の一撃を狙っていれば "+(v*2);
    default:          return v+"ダメージ"+(h>1?"×"+h+"回":"")+(e.pi?"（まもり無視）":"");
  }
}
function fxText(o){
  const e = o.e||{}, p = [];
  if(e.d || SP_DMG[e.sp]) p.push(dmgText(o));
  if(e.hp) p.push("HP"+P2(o,e.hp)+"回復");
  if(e.sh) p.push("まもり+"+P2(o,e.sh));
  if(e.sd) p.push("自分に"+P2(o,e.sd)+"ダメージ");
  if(e.at) p.push("攻撃力+"+e.at);
  if(e.ad) p.push("敵の攻撃力-"+e.ad);
  if(e.dr) p.push(e.dr+"枚ひく");
  if(e.en) p.push("気力+"+e.en);
  if(e.sp && SP_DESC[e.sp]) p.push(SP_DESC[e.sp]);
  return p.join("。")+"。";
}
function applyEffect(o){
  const e = o.e||{}, sp = e.sp||"";
  let dmg = e.d ? P2(o,e.d) : 0, hits = e.h||1, d = 0, note = "";

  if(sp==="random"){
    const pool = G.crafted.filter(function(x){ return x!==o.w; });
    if(pool.length){
      const pick = idiomOf(pool[Math.floor(Math.random()*pool.length)]);
      log("思わぬ巡り合わせ →「"+pick.w+"」！");
      return applyEffect(pick);
    }
    log("思わぬ巡り合わせ：何も起こらなかった"); return afterAction();
  }
  if(sp==="lowhp")    dmg = P2(o,e.d) + Math.floor((1-G.hp/G.maxhp)*P2(o,e.d)*2.2);
  if(sp==="enemylow") dmg = P2(o,e.d) + Math.floor((1-Math.max(0,B.en.hp)/B.en.maxhp)*P2(o,e.d)*2.2);
  if(sp==="turnmul")  dmg = P2(o,e.d)*B.turn;
  if(sp==="handcount"){ hits = Math.max(1, B.hand.filter(function(c){return c.t==="k";}).length); }
  if(sp==="mirror")   dmg = B.en.atk + B.en.buff;
  if(sp==="reflect")  dmg = Math.floor(B.taken*0.4);
  if(sp==="repeat")   dmg = B.lastDmg || P2(o,e.d||8);
  if(sp==="story"){ B.storyN = Math.min(4,B.storyN+1); dmg = P2(o,e.d)*B.storyN;
                    note = "（"+B.storyN+"段目）"; }
  if(sp==="gamble"){ if(Math.random()<0.5){ dmg=Math.round(dmg*1.8); note="（大あたり）"; }
                     else { dmg=Math.round(dmg*0.4); drawCard(); note="（不発・1枚ドロー）"; } }
  if(sp==="crit" && B.en.intent==="big"){ dmg = dmg*2; note="（機先を制した）"; }
  if(sp==="guardbreak") B.en.guard = 0;
  if(sp==="dispel"){ B.en.guard = 0; B.en.buff = 0; }
  if(sp==="steal"){ B.atkBuff += B.en.buff; B.en.buff = 0; }
  if(sp==="fog") B.fog = 3;
  if(sp==="surround") B.surround = 3;
  if(sp==="poison") B.poison = {d:P2(o,6), t:4};
  if(sp==="revenge") B.counter = {t:3, stored:0};
  if(sp==="grind"){ B.grind = 2; B.atkBuff += 2; }
  if(sp==="grind3"){ B.grind = 3; B.atkBuff += 3; }
  if(sp==="endure") B.endure = true;
  if(sp==="stun") B.en.intent = "none";
  if(sp==="slowdown") B.atkDownNext = 4;
  if(sp==="soften") B.soften = true;
  if(sp==="recoil") B.penalty += 2;
  if(sp==="recoil1") B.penalty += 1;
  if(sp==="recall"){
    let at = -1;
    for(let i=B.discard.length-1;i>=0;i--){ if(B.discard[i].t==="i"){ at=i; break; } }
    if(at>=0){ const c=B.discard[at]; B.discard.splice(at,1); B.hand.push(c);
      note += "／"+idiomOf(c.id).w+" をもどした"; }
  }
  if(sp==="search"){
    let at = -1;
    for(let i=B.draw.length-1;i>=0;i--){ if(B.draw[i].t==="i"){ at=i; break; } }
    if(at>=0){ const c=B.draw[at]; B.draw.splice(at,1); B.hand.push(c);
      note += "／"+idiomOf(c.id).w+" をひき当てた"; }
  }
  if(sp==="recycle"){
    let n = 0;
    for(let i=B.discard.length-1;i>=0 && n<3;i--){
      if(B.discard[i].t==="k"){ B.draw.push(B.discard[i]); B.discard.splice(i,1); n++; }
    }
    shuffle(B.draw); note += "／"+n+"枚もどした";
  }
  if(sp==="makeweak"){
    const pool = gradeKanjiList().filter(function(c){ return PARTS[c].el===B.en.weak; });
    const c = pool[Math.floor(Math.random()*pool.length)];
    B.hand.push({t:"k", c:c, el:B.en.weak}); note += "／「"+c+"」を得た";
  }
  if(sp==="toss"){
    if(B.hand.length){ const i=Math.floor(Math.random()*B.hand.length); B.discard.push(B.hand[i]); B.hand.splice(i,1); }
    drawCard(); drawCard();
  }
  if(sp==="redraw"){
    B.discard = B.discard.concat(B.hand); B.hand = [];
    for(let i=0;i<5;i++) drawCard();
  }
  if(sp==="drop"){ const c = rollKanji(); addKanji(c); note += "／「"+c+"」を拾った"; }

  if(dmg>0){
    if(sp==="varied"){
      const es = ["剛","柔","智"];
      for(let i=0;i<hits;i++) d += hitEnemy(dmg, es[Math.floor(Math.random()*3)], e.pi);
    }else if(sp==="allelem"){
      ["剛","柔","智"].forEach(function(x){ d += hitEnemy(dmg, x, e.pi); });
    }else{
      for(let i=0;i<hits;i++) d += hitEnemy(dmg, o.el, e.pi);
    }
  }
  if(sp==="drain" && d>0){ G.hp = Math.min(G.maxhp, G.hp+Math.floor(d*0.5)); sfx("heal"); }
  if(e.sd) G.hp -= P2(o,e.sd);
  if(e.hp){ G.hp = Math.min(G.maxhp, G.hp+P2(o,e.hp)); sfx("heal"); }
  if(e.sh) B.shield += P2(o,e.sh);
  if(sp==="noshield") B.shield = 0;
  if(e.at) B.atkBuff += e.at;
  if(e.ad) B.en.atk = Math.max(4, B.en.atk-e.ad);
  if(e.dr) for(let i=0;i<e.dr;i++) drawCard();
  if(e.en) B.energy += e.en;

  log("<b>"+cardName(o)+"</b>"+note+(d>0 ? "　<b>"+d+"</b> ダメージ" : ""));
  afterAction();
}

function afterAction(){
  if(B.en.hp<=0){ B.en.hp=0; return victory(); }
  if(B.boss && !B.rage && B.en.hp <= B.en.maxhp*0.3){
    B.rage = true;
    B.en.buff += Math.round(B.en.atk*0.12);
    B.en.intent = "big";
    B.energy += 1;
    log("<b>"+B.en.n+"</b> は死力をふりしぼった！　こちらも気を引きしめた（気力+1）");
    sfx("gong");
  }
  if(G.hp<=0){ G.hp=0; return defeat(); }
  renderBattle();
}

function endTurn(){
  if(B.over) return;
  B.sel=[];
  const it = B.en.intent;
  if(it==="atk" || it==="big"){
    let raw = Math.floor(B.en.atk*(it==="big"?1.7:1)) + B.en.buff;
    if(B.soften){ raw = Math.floor(raw*0.5); B.soften = false; }
    const d = hurtPlayer(raw);
    log(B.en.n+"の"+(it==="big"?"渾身の一撃":"攻撃")+"　<b>"+d+"</b> ダメージ");
  }else if(it==="buff"){ const up = 4+Math.floor(G.chapter/2); B.en.buff = Math.min(12+2*G.chapter, B.en.buff+up); log(B.en.n+"は力をためた（攻撃+"+up+"）"); }
  else if(it==="guard"){ const gd = 14+3*G.chapter; B.en.guard += gd; log(B.en.n+"は身を固めた（守り+"+gd+"）"); }
  else if(it==="drain"){ B.penalty += 1; log(B.en.n+"は言葉を吸い取った（次のターン気力-1）"); }
  else { log(B.en.n+"は ようすを見ている"); }

  if(G.hp<=0){ G.hp=0; return defeat(); }
  B.en.pi = (B.en.pi+1) % B.en.pat.length;
  B.en.intent = B.en.pat[B.en.pi];
  startPlayerTurn(false);
}

/* --- バトル描画 --- */

       '</div>'+
       '<div class="px panel dark" style="padding:7px 10px">'+

         bar(e.hp,e.maxhp,"foe")+
       '</div>'+
     '</div>'+
     '<div class="px panel col-b">'+
       '<div class="statline"><span class="label">たいりょく</span><span style="margin-left:auto">'+G.hp+' / '+G.maxhp+'</span></div>'+
       bar(G.hp,G.maxhp)+
       '<div class="statline" style="margin-top:7px"><span class="label">きりょく</span><div class="pips">'+pips+'</div></div>'+
       (chips?'<div class="chips">'+chips+'</div>':'')+

function victory(){
  B.over = true; hideYpop();
  stopSeq(); AU.cur=null; sfx("win");
  const drops = []; const n = (B.boss?7:4)+(G.hard?HARD.drop:0);
  for(let i=0;i<n;i++){ const c=rollKanji(); addKanji(c); drops.push(c); }
  if(B.boss) G.hp = G.maxhp;
  if(B.taken===0) mjAchieve("nodmg");
  /* 撃破の手ごたえ：控えめなパーティクル。主は 0.6 秒ほどスローにしてから結果へ */
  const st = document.getElementById("stage"), fs = document.getElementById("foe-spr");
  try{ if(window.MJ && fs) MJ.burst(fs, {count:B.boss?22:14, color:"#d9a441", color2:"#c8452f"}); }catch(e){}
  let wait = 280;
  if(B.boss && st){
    wait = 700; st.classList.add("slow");
    if(fs) setTimeout(function(){ fs.classList.add("flash"); setTimeout(function(){ fs.classList.remove("flash"); },480); },130);
    st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake");
  }
  if(window.MJ && !MJ.reduced()) setTimeout(function(){ showVictory(drops); }, wait);
  else showVictory(drops);
}
function showVictory(drops){
  const tiles = drops.map(function(c){
    return '<div class="k" style="min-width:84px"><span class="el dot-'+PARTS[c].el+'"></span>'+c+'</div>';
  }).join("");
  document.getElementById("s-result").innerHTML =
    topbar("しょうり") +
    '<div class="scr-body"><div class="px panel grow" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">'+
      sprHTML(B.en.g,88)+
      '<div style="font-size:18px;color:var(--kin);margin-top:8px">'+esc(B.en.n)+' をたおした</div>'+
      '<div class="hr" style="width:80%"></div><div class="label">てにいれた語句</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px">'+tiles+'</div>'+
    '</div></div>'+
    '<div class="scr-foot"><button class="btn primary" onclick="nextNode()">さきへ進む</button>'+
    '<div class="row"><button class="btn" onclick="renderCraft()">錬成所</button>'+
    '<button class="btn" onclick="renderDex()">図鑑</button></div></div>';
  go("result");
}

function defeat(){
  B.over = true;
  stopSeq(); AU.cur=null; sfx("lose");
  const rest = retryLimit() - G.retry;
  const canRetry = rest > 0;
  document.getElementById("s-result").innerHTML =
    topbar("ぜんめつ") +
    '<div class="scr-body"><div class="px panel grow" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">'+
      '<div style="font-size:19px">言葉がとどかなかった</div>'+
      '<div class="hr" style="width:80%"></div>'+
      (canRetry
        ? '<p class="muted" style="margin:0">この階層で休めるのは あと <span class="near">'+rest+'回</span>。<br>使い切ると第'+(G.chapter+1)+'章の最初からやり直しになる。</p>'
        : '<p class="muted" style="margin:0">休む力は尽きた。<br>第'+(G.chapter+1)+'章「'+CHAPTERS[G.chapter].name+'」の最初からやり直そう。</p>')+
    '</div></div>'+
    '<div class="scr-foot">'+
      (canRetry
        ? '<button class="btn primary" onclick="retryNode()">休んで再挑戦（のこり'+rest+'回）</button>'
        : '<button class="btn primary" onclick="restartChapter()">第'+(G.chapter+1)+'章の最初から</button>')+
      '<div class="row"><button class="btn" onclick="renderCraft()">錬成所</button>'+
      '<button class="btn" onclick="renderDeck()">編成</button></div>'+
    '</div>';
  go("result");
}

function nextNode(){
  G.node++;
  if(G.node >= CHAPTERS[G.chapter].nodes.length){
    G.chapter++; G.node = 0; G.retry = 0; G.maxhp += 15; G.hp = G.maxhp;
    if(G.endless){
      ensureLayers();
      G.depth = Math.max(G.depth, G.chapter - STORY_LEN);
    }else if(G.hard){
      G.bestH = Math.max(G.bestH, Math.min(STORY_LEN, G.chapter));
    }else{
      G.bestN = Math.max(G.bestN, Math.min(STORY_LEN, G.chapter));
    }
    if(!G.endless && G.chapter >= CHAPTERS.length){ G.cleared = true; return renderEnding(); }
    report(); saveGame(true);
    if(window.MJ){
      /* 章の切りかわり：地図を出してから章名のカットイン（結果画面には重ねない） */
      CUT_ON = true; renderMap();
      const ch = CHAPTERS[G.chapter];
      MJ.cutin({title:ch.name, sub:(G.endless?"無限回廊":"第"+(G.chapter+1)+"章"), color:"#8f2f20", ms:1500})
        .then(function(){ CUT_ON = false; flushBanner(); });
      return;
    }
    toast("第"+(G.chapter+1)+"章「"+CHAPTERS[G.chapter].name+"」へ");
  }
  report(); saveGame(true);
  renderMap();
}
function retryNode(){ G.retry++; G.hp = G.maxhp; saveGame(true); renderMap(); }
function restartChapter(){
  G.retry = 0; G.node = 0; G.hp = G.maxhp;

/* =========================================================
   錬成所
   ========================================================= */
let CRAFT = [];
let SORTM = 0, ONLYUSE = false;
const SORT_NAMES = ["使える順","五十音順","属性順","枚数順"];
const USE_MARK = ["◎","○","△","—"];
const USE_LABEL = ["いま錬成できる","あと1語","まだ遠い","いま使い道なし"];
/* 錬成または練り上げの対象になることわざ */
function craftTargets(){
  return POOL().filter(function(o){
    return G.crafted.indexOf(o.w) < 0 || plusOf(o) < MAX_PLUS;
  });
}
/* 語句ごとの使いみち 0:即 1:あと1語 2:まだ遠い 3:不要 */
function useMap(){
  const m = {};
  craftTargets().forEach(function(o){
    const miss = missingOf(o).length;
    const r = miss===0 ? 0 : (miss===1 ? 1 : 2);
    o.p.forEach(function(c){ if(m[c]===undefined || r<m[c]) m[c] = r; });
  });
  return m;
}
function useOf(m,c){ return m[c]===undefined ? 3 : m[c]; }
function sortKanji(keys,m){
  const eo = {"剛":0,"柔":1,"智":2};
  return keys.slice().sort(function(a,b){
    if(SORTM===0){ const d = useOf(m,a)-useOf(m,b); if(d) return d; }
    if(SORTM===2){ const d = eo[PARTS[a].el]-eo[PARTS[b].el]; if(d) return d; }
    if(SORTM===3){ const d = (G.inv[b]||0)-(G.inv[a]||0); if(d) return d; }
    return a.localeCompare(b,"ja");
  });
}
function cycleSort(){ SORTM = (SORTM+1)%SORT_NAMES.length; renderCraft(); }
function toggleOnly(){ ONLYUSE = !ONLYUSE; renderCraft(); }
function kanjiTile(c,m,onclick,extra){
  const u = useOf(m,c);
  const left = extra===undefined ? G.inv[c] : extra;
  return '<button class="k '+(left<=0?"off":"")+'" onclick="'+onclick+'">'+
    '<span class="el dot-'+PARTS[c].el+'"></span>'+esc(c)+
    '<span class="u u'+u+'">'+USE_MARK[u]+'</span>'+
    '<span class="n">'+left+'</span></button>';
}
const CRAFT_MAX = 4, CRAFT_MIN = 2;
function renderCraft(){
  playBGM("field");
  const w = CRAFT.join("");
  const hit = CRAFT.length>=CRAFT_MIN ? findInPool(w) : null;
  const unknown = (!hit && CRAFT.length>=CRAFT_MIN) ? findAny(w) : null;
  const has = hit ? G.crafted.indexOf(hit.w)>=0 : false;
  const pl = hit ? plusOf(hit) : 0;
  const maxed = has && pl>=MAX_PLUS;
  let slots = "";
  for(let i=0;i<CRAFT_MAX;i++){
    const opt = i>=CRAFT_MIN && !CRAFT[i];
    slots += '<div class="slot '+(CRAFT[i]?"filled":"")+(opt?" opt":"")+'" onclick="craftPop('+i+')">'+
      '<span class="no">'+["一","二","三","四"][i]+'</span>'+(CRAFT[i]?esc(CRAFT[i]):"")+'</div>';
  }

  const m = useMap();
  let keys = Object.keys(G.inv).filter(function(c){ return G.inv[c]>0; });
  if(ONLYUSE) keys = keys.filter(function(c){ return useOf(m,c)<=1; });
  keys = sortKanji(keys, m);

  let inv = "";
  if(!keys.length){
    inv = '<p class="muted">'+(ONLYUSE?"すぐ使える語句がない。並びを「すべて」に戻そう。":"まだ語句がない。道中で拾ってこよう。")+'</p>';
  }else if(SORTM===0){
    [0,1,2,3].forEach(function(g){
      const grp = keys.filter(function(c){ return useOf(m,c)===g; });
      if(!grp.length) return;
      inv += '<div class="grouphead"><span class="u u'+g+'">'+USE_MARK[g]+'</span> '+USE_LABEL[g]+'　<span class="muted">'+grp.length+'種</span></div>'+
        '<div class="inv">'+grp.map(function(c){
          const left = G.inv[c] - CRAFT.filter(function(x){return x===c;}).length;
          return kanjiTile(c,m,"craftPush(this.dataset.c)",left).replace('<button class="k','<button data-c="'+esc(c)+'" class="k');
        }).join("")+'</div>';
    });
  }else{
    inv = '<div class="inv">'+keys.map(function(c){
      const left = G.inv[c] - CRAFT.filter(function(x){return x===c;}).length;
      return kanjiTile(c,m,"craftPush(this.dataset.c)",left).replace('<button class="k','<button data-c="'+esc(c)+'" class="k');
    }).join("")+'</div>';
  }

  const near = craftTargets().map(function(o){ return {o:o, m:missingOf(o).length, up:G.crafted.indexOf(o.w)>=0}; })
    .filter(function(x){ return x.m<=1; })
    .sort(function(a,b){ return (a.m-b.m) || (a.up?1:0)-(b.up?1:0); }).slice(0,3);
  let hint = near.map(function(x){
    return '<div class="muted">・'+esc(x.up ? x.o.w+" を練り上げ" : x.o.mean)+
      '　<span class="near">'+(x.m===0?"いまできる":"あと1語")+'</span></div>';
  }).join("");
  if(!hint) hint = '<div class="muted">・手がかりが少ない。語句を集めよう。</div>';

  let label = "錬成する";
  if(hit && maxed) label = hit.w+" は錬成しきった";
  else if(hit && has) label = "練り上げる（+"+pl+" → +"+(pl+1)+"）";
  else if(hit) label = hit.w+" を錬成する";

  let center;
  if(hit) center = '<p class="muted" style="text-align:center;margin:0">'+
                 esc(has ? hit.w+"（"+hit.y+"）／練り上げると威力が12%ずつ上がる" : hit.mean)+'</p>';
  else if(unknown) center = '<p class="muted" style="text-align:center;margin:0">その言葉はまだ知らぬ（上の学年で習う）。学年を変えると錬成できる。</p>';
  else if(CRAFT.length>=CRAFT_MIN) center = '<p class="muted" style="text-align:center;margin:0">その並びの言葉は伝わっていない……</p>';
  else center = '<div style="margin-top:4px">'+hint+'</div>';

  document.getElementById("s-craft").innerHTML =
    topbar("錬成所", "backFromSub()") +
    '<div class="scr-body">'+
      '<div class="px panel col-a">'+
        '<div class="label">錬成陣　左上から順に 二〜四語（三・四は空でもよい）</div>'+
        '<div class="circle '+(hit&&!maxed?"ok":"")+'">'+slots+'</div>'+
        center+
      '</div>'+
      '<div class="px panel dark col-b grow" style="display:flex;flex-direction:column">'+
        '<div class="sortrow">'+
          '<button class="btn ghost" onclick="cycleSort()">並び：'+SORT_NAMES[SORTM]+'</button>'+
          '<button class="btn ghost" onclick="toggleOnly()">'+(ONLYUSE?"◎○だけ":"すべて表示")+'</button>'+
        '</div>'+
        '<div class="pane grow" style="margin-top:6px">'+inv+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="scr-foot"><button class="btn primary" onclick="doCraft()" '+
      (hit && !maxed ?"":"disabled")+'>'+esc(label)+'</button></div>';
  go("craft");
}
function craftPush(c){
  if(CRAFT.length>=CRAFT_MAX) return;
  const left = G.inv[c] - CRAFT.filter(x=>x===c).length;
  if(left<=0) return;
  sfx("tap");
  CRAFT.push(c); renderCraft();
}
function craftPop(i){ if(CRAFT[i]!==undefined){ CRAFT.splice(i,1); renderCraft(); } }
function doCraft(){
  const w = CRAFT.join("");
  const found = findInPool(w);
  if(!found){ sfx("ng"); toast("その並びの言葉は伝わっていない。並びを見直そう"); return; }
  const has = G.crafted.includes(found.w);
  const pl = plusOf(found);
  if(has && pl >= MAX_PLUS){ toast(found.w+" はこれ以上 練り上げられない"); return; }
  CRAFT.forEach(c=>{ G.inv[c]--; if(G.inv[c]<=0) delete G.inv[c]; removeFromDeckKanji(c); });
  CRAFT = [];
  if(has){
    G.plus[found.w] = pl+1;
  }else{
    G.crafted.push(found.w);
    if(G.deckIdiom.length<maxIdiomDeck()) G.deckIdiom.push(found.w);
  }
  refillDeck(); saveGame(true);
  sfx("craft");
  checkRank();
  toast(has ? found.w+" を練り上げた（+"+(pl+1)+"）　威力+"+Math.round(12*(pl+1))+"%"
            : found.w+"（"+found.y+"）を錬成した");
  report();
  renderCraft();
}
function backFromSub(){ if(B && !B.over) renderBattle(); else renderMap(); }

/* =========================================================
   編成
   ========================================================= */
function renderDeck(){
  playBGM("field");
  const keys = Object.keys(G.inv).filter(function(c){return G.inv[c]>0;}).sort();
  let inv = keys.map(function(c){
    const n = deckKanjiCount(c);
    return '<button class="k '+(n?"":"off")+'" data-c="'+esc(c)+'" onclick="toggleKanji(this.dataset.c)">'+
      '<span class="el dot-'+PARTS[c].el+'"></span>'+esc(c)+'<span class="n">'+n+'/'+G.inv[c]+'</span></button>';
  }).join("") || '<p class="muted">語句がない。</p>';
  let idm = G.crafted.map(function(id){
    const o = idiomOf(id), on = G.deckIdiom.includes(id);
    return '<button class="card" style="width:100%;margin-bottom:6px;opacity:'+(on?1:.35)+'" onclick="toggleIdiom(\''+id+'\')">'+
      '<div class="cardtop"><span class="name">'+cardName(o)+'</span><span class="cost-badge">'+o.cost+'</span></div>'+
      '<div class="fx">'+esc(fxText(o))+'</div></button>';
  }).join("") || '<p class="muted">まだ完成カードがない。錬成所へ。</p>';
  const prob = deckProblem();
  document.getElementById("s-deck").innerHTML =
    topbar("編成", "closeDeck()") +
    '<div class="scr-body"><div class="pane grow">'+
      (prob ? '<div class="px panel" style="margin-bottom:7px;border-color:var(--shu);color:var(--shu)">'+esc(prob)+'</div>' : '')+
      '<div class="px panel" style="margin-bottom:7px"><div class="label">語句カード　'+G.deckKanji.length+' / '+maxKanjiDeck()+'（'+minKanjiDeck()+'枚以上）</div>'+
        '<p class="muted" style="margin:5px 0 8px">戦闘中に二〜四枚を並べて唱える。完成カードは語句カードの枚数まで。</p>'+
        '<div class="inv">'+inv+'</div></div>'+
      '<div class="px panel dark"><div class="label">完成カード　'+G.deckIdiom.length+' / '+maxIdiomDeck()+'</div>'+
        '<div style="margin-top:7px">'+idm+'</div></div>'+
    '</div></div>'+
    '<div class="scr-foot"><button class="btn'+(prob?'':' primary')+'" onclick="closeDeck()">とじる</button></div>';
  go("deck");
}
function closeDeck(){
  const prob = deckProblem();
  if(prob){ sfx("ng"); toast(prob); return; }
  saveGame(true);
  backFromSub();
}
function toggleKanji(c){
  const inDeck = deckKanjiCount(c);
  if(inDeck < G.inv[c] && G.deckKanji.length < maxKanjiDeck()) G.deckKanji.push(c);
  else if(inDeck>0) {
    if(G.deckKanji.length - inDeck < minKanjiDeck()){ sfx("ng"); toast("語句カードは "+minKanjiDeck()+" 枚以上必要"); }
    else { while(deckKanjiCount(c)>0) removeFromDeckKanji(c); }
  }
  else toast("デッキがいっぱい");
  renderDeck();
}
function toggleIdiom(id){
  const i = G.deckIdiom.indexOf(id);
  if(i>=0) G.deckIdiom.splice(i,1);
  else if(G.deckIdiom.length>=maxIdiomDeck()) toast("完成カードは"+maxIdiomDeck()+"枚まで");
  else if(G.deckIdiom.length>=G.deckKanji.length){ sfx("ng"); toast("完成カードは語句カードの枚数（"+G.deckKanji.length+"）まで"); }
  else G.deckIdiom.push(id);
  renderDeck();
}

/* =========================================================
   図鑑
   ========================================================= */
let DEX_TAB = 0;
function dexTab(i){ DEX_TAB = i; sfx("tap"); renderDex(); }
function renderDex(){
  playBGM("field");
  const kind = KIND_LIST[DEX_TAB];
  const all = POOL().filter(function(o){ return o.kind===kind; });
  const gotN = all.filter(function(o){ return G.crafted.includes(o.w); }).length;
  const items = all.map(function(o){
    const got = G.crafted.includes(o.w);
    const miss = missingOf(o).length;
    const word = got ? esc(o.w) : o.p.map(function(c){ return G.inv[c] ? esc(c) : '<span class="mask">'+"〇".repeat(Math.min(4,c.length))+'</span>'; }).join("");
    return '<div class="dex-item '+(got?"got":"")+'">'+
      '<div class="dex-word">'+word+(got&&plusOf(o)?' <span class="near">+'+plusOf(o)+'</span>':'')+
        (o.g>1?'<span class="kindtag">'+(o.g===2?"中学":"発展")+'</span>':'')+'</div>'+
      (got?'<div class="dex-yomi">'+esc(o.y)+'</div>':'')+
      '<div class="dex-mean">'+esc(o.mean)+'</div>'+
      (got?'<div class="muted" style="color:var(--aijiro)">効果：'+esc(fxText(o))+'</div>'
          :'<div class="near">'+(miss===0?"いま錬成できる":"あと"+miss+"語")+'</div>')+
    '</div>';
  }).join("");
  const tabs = KIND_LIST.map(function(k,i){
    const n = POOL().filter(function(o){ return o.kind===k; });
    const g = n.filter(function(o){ return G.crafted.includes(o.w); }).length;
    return '<button class="btn'+(i===DEX_TAB?' on':'')+'" onclick="dexTab('+i+')">'+k+'　'+g+'/'+n.length+'</button>';
  }).join("");
  document.getElementById("s-dex").innerHTML =
    topbar("ことわざ図鑑 "+craftedInPool()+"/"+dexTotal(), "backFromSub()") +
    '<div class="scr-body"><div class="dextabs">'+tabs+'</div>'+
    '<div class="pane grow"><div class="dexgrid">'+(items||'<p class="muted">この学年の'+kind+'はない。</p>')+'</div></div></div>'+
    '<div class="scr-foot"><button class="btn" onclick="backFromSub()">とじる</button></div>';
  go("dex");
}

/* =========================================================
   フェーズ4①：手札の完成カードを長押しで意味を見る（PC はホバーでも可）
   ========================================================= */
const LP = {timer:null, el:null, fired:false, hover:false};
function hideYpop(){
  const p = document.getElementById("ypop");
  if(p) p.classList.remove("show");
  if(LP.el){ LP.el.classList.remove("lp"); LP.el = null; }
  if(LP.timer){ clearTimeout(LP.timer); LP.timer = null; }
}
function showYpop(card){
  const o = idiomOf(card.dataset.w); const p = document.getElementById("ypop");
  if(!o || !p) return;
  p.innerHTML = '<span class="w">'+o.w+'</span><span class="y">'+o.y+'</span>'+
    '<div class="m">'+esc(o.mean)+'</div><div class="f">効果：'+esc(fxText(o))+'</div>';
  const r = card.getBoundingClientRect();
  p.style.left = "0px"; p.style.top = "0px";
  const pw = p.offsetWidth, ph = p.offsetHeight, vw = window.innerWidth;
  let x = r.left + r.width/2 - pw/2; x = Math.max(6, Math.min(vw-pw-6, x));
  let y = r.top - ph - 8; if(y < 4) y = r.bottom + 8;
  p.style.left = x+"px"; p.style.top = y+"px";
  LP.el = card; card.classList.add("lp");
  p.classList.add("show");
}
document.addEventListener("pointerdown", function(ev){
  const card = ev.target.closest ? ev.target.closest("#s-battle .card[data-w]") : null;
  hideYpop(); LP.fired = false;
  if(!card) return;
  if(ev.pointerType === "mouse" && LP.hover) return;
  LP.timer = setTimeout(function(){ LP.timer = null; LP.fired = true; showYpop(card); }, 400);
}, {passive:true});
["pointerup","pointercancel"].forEach(function(n){
  document.addEventListener(n, function(){ if(LP.timer){ clearTimeout(LP.timer); LP.timer=null; } if(LP.el) hideYpop(); }, {passive:true});
});
document.addEventListener("contextmenu", function(ev){ if(ev.target.closest && ev.target.closest("#s-battle .card")) ev.preventDefault(); });
document.addEventListener("scroll", hideYpop, {passive:true, capture:true});
/* PC：マウスを 350ms のせると表示（タップの選択はそのまま使える） */
document.addEventListener("pointerover", function(ev){
  if(ev.pointerType !== "mouse") return;
  const card = ev.target.closest ? ev.target.closest("#s-battle .card[data-w]") : null;
  if(!card || card === LP.el) return;
  LP.hover = true;
  if(LP.timer) clearTimeout(LP.timer);
  LP.timer = setTimeout(function(){ LP.timer = null; showYpop(card); }, 350);
});
document.addEventListener("pointerout", function(ev){
  if(ev.pointerType !== "mouse") return;
  const card = ev.target.closest ? ev.target.closest("#s-battle .card[data-w]") : null;
  if(!card) return;
  if(ev.relatedTarget && card.contains(ev.relatedTarget)) return;
  hideYpop();
});

/* =========================================================
   フェーズ4②：問の試練（図鑑のことわざから三択を1問）
   出題は PROVERBS の w / y / mean / use から機械的に作る（型は quizBuild の上のコメント）
   ========================================================= */
/* 意味が近い組（選択肢どうしが紛らわしくならないよう、同じ組からは出さない） */
const SYN = [
 ["猿も木から落ちる","弘法にも筆の誤り","河童の川流れ"],
 ["猫に小判","豚に真珠","馬の耳に念仏"],
 ["泣きっ面に蜂","弱り目に祟り目","一難去ってまた一難"],
 ["石橋をたたいて渡る","転ばぬ先の杖","備えあれば憂いなし","羹に懲りて膾を吹く"],
 ["急がば回れ","急いては事を仕損じる"],
 ["石の上にも三年","継続は力なり","塵も積もれば山となる","愚公山を移す","千里の道も一歩から"],
 ["覆水盆に返らず","後悔先に立たず"],
 ["息を呑む","固唾を呑む"],
 ["青は藍より出でて藍より青し","鳶が鷹を生む"],
 ["蛍雪の功","玉磨かざれば光なし","腕を磨く"],
 ["竹馬の友","水魚の交わり","類は友を呼ぶ"],
 ["身を粉にする","骨が折れる"],
 ["口は災いの元","口が軽い"],
 ["良薬は口に苦し","耳が痛い"],
 ["瓢箪から駒","棚からぼたもち","犬も歩けば棒に当たる"],
 ["渡る世間に鬼はない","捨てる神あれば拾う神あり"],
 ["襟を正す","勝って兜の緒を締めよ","肝に銘じる"],
 ["七転び八起き","失敗は成功の元","艱難汝を玉にす"],
 ["時は金なり","光陰矢の如し"],
 ["人間万事塞翁が馬","風が吹けば桶屋が儲かる"],
 ["負けるが勝ち","柳に風"],
 ["待てば海路の日和あり","果報は寝て待て"],
 ["好きこそ物の上手なれ","下手の横好き"],
 ["鼻が高い","胸を張る"],
 ["馬の耳に念仏","歯が立たない","焼け石に水"]
];
function synOf(w){ const g = SYN.find(function(a){ return a.indexOf(w)>=0; }); return g || [w]; }
let QZ = null;
/* 出題の型： 0 意味 → ことわざをえらぶ　1 使い方（例文の空欄）→ ことわざをえらぶ　2 ことわざ → 読みをえらぶ */
function quizBuild(){
  const pool = POOL(); if(pool.length < 3) return null;
  const crafted = pool.filter(function(o){ return G.crafted.indexOf(o.w)>=0; });
  let missed = [];
  try{ if(window.MJ) missed = MJ.misses(HUB_KEY).map(function(m){ return idiomOf(m.id); }).filter(function(o){ return o && o.g<=GRADE; }); }catch(e){}
  const src = (missed.length && Math.random()<0.4) ? missed : (crafted.length>=3 && Math.random()<0.75 ? crafted : pool);
  const ans = src[Math.floor(Math.random()*src.length)];
  const type = Math.floor(Math.random()*3);
  const bad = synOf(ans.w);
  const others = shuffle(pool.filter(function(o){
    return o.w!==ans.w && bad.indexOf(o.w)<0 && o.mean!==ans.mean && o.y!==ans.y && (type!==1 || o.kind===ans.kind);
  })).slice(0,2);
  if(others.length<2) return null;
  const opts = shuffle([ans].concat(others));
  return {type:type, ans:ans, opts:opts, done:false};
}
function blankUse(o){ return esc(o.use).split(esc(o.w)).join('<b style="font-size:inherit;letter-spacing:0">（　　　　）</b>'); }
function quizText(type,o){ return type===2 ? o.y : o.w; }
function openQuiz(){
  QZ = quizBuild();
  if(!QZ){ toast("問いが見つからなかった"); G.node++; saveGame(true); renderMap(); return; }
  sfx("tap");
  renderQuiz();
}
function renderQuiz(){
  const host = document.getElementById("modal"); if(!host) return;
  const q = QZ, a = q.ans;
  let ask;
  if(q.type===0) ask = 'この意味の'+esc(a.kind)+'は？<br>「'+esc(a.mean)+'」';
  else if(q.type===1) ask = '空欄に合う'+esc(a.kind)+'は？<br>「'+blankUse(a)+'」';
  else ask = '<b>'+esc(a.w)+'</b> の読み方は？';
  let html = '<div class="px panel box"><div class="label" style="display:flex;align-items:center;gap:8px"><span class="qmark">問</span>問の試練　'+gradeTag()+'</div>'+
    '<div class="qq">'+ask+'</div>';
  q.opts.forEach(function(o,i){
    let cls = "btn qc"+(q.type!==2 && a.w.length<=8?" big":"");
    if(q.done){ if(o.w===a.w) cls += " right"; else if(i===q.pick) cls += " wrong"; }
    html += '<button class="'+cls+'" id="qc'+i+'" onclick="quizAnswer('+i+')" '+(q.done?'disabled':'')+'>'+
      '<span class="no">'+["一","二","三"][i]+'</span><span>'+esc(quizText(q.type,o))+'</span></button>';
  });
  if(q.done){
    const picked = q.opts[q.pick];
    html += '<div class="qexp">'+(q.ok ? '正解。' : '残念。')+'<b>'+esc(a.w)+'</b>（'+esc(a.y)+'）<br>'+esc(a.mean)+
      (q.ok ? '' : (q.type===2 ? '<br>「'+esc(picked.y)+'」は '+esc(picked.w)+' の読み' :
                    '<br>えらんだ「'+esc(picked.w)+'」は「'+esc(picked.mean)+'」'))+'</div>'+
      '<button class="btn primary" style="margin-top:10px" onclick="quizClose()">'+(q.ok?'語句をうけとって進む':'心にとめて進む')+'</button>';
  }
  host.innerHTML = html+'</div>';
  host.classList.remove("hidden");
}
function quizAnswer(i){
  const q = QZ; if(!q || q.done) return;
  q.done = true; q.pick = i; q.ok = (q.opts[i].w === q.ans.w);
  const btn = document.getElementById("qc"+i);
  if(q.ok){
    sfx("get");
    LEG.q = (LEG.q|0)+1; if(LEG.q>=10) mjAchieve("quiz10");
    try{ legSave(); }catch(e){}
    try{ if(window.MJ){ MJ.hit(HUB_KEY, q.ans.w); if(btn) MJ.burst(btn, {count:16, color:"#d9a441", color2:"#6fa96b"}); } }catch(e){}
    const c = rollKanji(); addKanji(c); q.reward = c;
  }else{
    sfx("ng");
    try{ if(window.MJ){ MJ.flash("#c8452f"); MJ.miss(HUB_KEY, q.ans.w, {w:q.ans.w, y:q.ans.y}); if(btn) MJ.shake(btn, 5); } }catch(e){}
  }
  renderQuiz();
  if(q.ok) toast("正解　語句「"+q.reward+"」を手に入れた");
}
function quizClose(){
  closeModal(); QZ = null;
  G.node++; saveGame(true); renderMap();
}

/* =========================================================
   フェーズ4④：石碑 ── 称号・記録・実績をバッジで並べる（2ページ）
   ========================================================= */
let STONE = {from:"map", page:0};
function openStone(from){ STONE.from = from||"map"; STONE.page = 0; renderStone(); }
function stonePage(p){ STONE.page = p; sfx("tap"); renderStone(); }
function closeStone(){ if(STONE.from==="title") goHome(); else backFromSub(); }
function renderStone(){
  const lv = rankLv(), rn = rankName();
  const nextI = lv < RANKS.length ? lv : -1;
  const ds = lv ? RANKS[lv-1].d : "ことわざを錬成して位を上げよう";
  const next = nextI>=0 ? "次の位「"+RANKS[nextI].t+"」まで あと "+Math.max(0, rankNeed(nextI)-dexCount())+"語" : "すべての位に至った";
  let body = "";
  if(STONE.page===0){
    const rec = [
      {v:LEG.bestN, u:"章", t:"通常の旅", d:"到達した章"},
      {v:LEG.bestH, u:"章", t:"修羅道", d:"到達した章"},
      {v:LEG.depth, u:"層", t:"無限回廊", d:"最深到達"},
      {v:Math.min(LEG.dex, PROVERBS.length), u:"語", t:"図鑑", d:"錬成したことわざ"}
    ];
    body = '<div class="stonehead">'+
        '<div class="bdg titlebdg" style="animation-delay:.05s"><div class="c"><span class="g">'+esc(lv?rn:"無位")+'</span></div></div>'+
        '<div class="ttl"><div class="label">称号（言の葉の位）</div><div class="nm">'+esc(lv?rn:"無位")+'</div>'+
        '<div class="ds">'+esc(ds)+'　'+esc(next)+'</div></div>'+
      '</div>'+
      '<div class="label" style="margin-bottom:8px">記録</div>'+
      '<div class="bgrid">'+rec.map(function(r,i){
        return '<div class="bdg'+(r.v?'':' off')+'" style="animation-delay:'+(0.15+i*0.08).toFixed(2)+'s"><div class="c"><span class="v">'+r.v+'</span><span class="u">'+r.u+'</span></div>'+
          '<div class="t">'+r.t+'</div><div class="d">'+r.d+'</div></div>';
      }).join("")+'</div>'+
      '<div class="label" style="margin:14px 0 8px">言の葉の位　図鑑 '+dexCount()+' / '+dexTotal()+'語</div>'+
      '<div class="bgrid">'+RANKS.map(function(r,i){
        const on = lv > i;
        return '<div class="bdg sq'+(on?'':' off')+'" style="animation-delay:'+(0.5+i*0.08).toFixed(2)+'s"><div class="c"><span class="g">'+esc(["見習","語り","達人","博士"][i])+'</span></div>'+
          '<div class="t">'+esc(r.t)+'</div><div class="d">'+rankNeed(i)+'語で '+esc(r.d)+'</div></div>';
      }).join("")+'</div>';
  }else{
    let got = {}; try{ if(window.MJ) got = MJ.achievements(HUB_KEY) || {}; }catch(e){}
    const n = ACH.filter(function(a){ return got[a.id]; }).length;
    body = '<div class="label" style="margin-bottom:8px">実績　'+n+' / '+ACH.length+'</div>'+
      '<div class="bgrid">'+ACH.map(function(a,i){
        const on = !!got[a.id];
        return '<div class="bdg sq'+(on?'':' off')+'" style="animation-delay:'+(0.05+i*0.07).toFixed(2)+'s"><div class="c"><span class="g">'+esc(a.t.slice(0,2))+'</span></div>'+
          '<div class="t">'+esc(a.t)+'</div><div class="d">'+esc(a.d)+'</div></div>';
      }).join("")+'</div>';
  }
  document.getElementById("s-stone").innerHTML =
    topbar("石碑", "closeStone()") +
    '<div class="scr-body"><div class="px panel col-a">'+body+'</div></div>'+
    '<div class="scr-foot">'+
      '<div class="row stonetabs">'+
        '<button class="btn'+(STONE.page===0?' on':'')+'" onclick="stonePage(0)">称号・記録</button>'+
        '<button class="btn'+(STONE.page===1?' on':'')+'" onclick="stonePage(1)">実績</button></div>'+
      '<button class="btn" onclick="closeStone()">とじる</button>'+
    '</div>';
  go("stone");
}

/* =========================================================
   まなびの基板への記録送信（あれば）
   ========================================================= */
try{ paintTitle(); paintGrade(); }catch(e){}
try{ if(window.MJ) MJ.setMuted(!AU.on); }catch(e){}
try{ probeSave().then(function(v){ SAVED = v; showContinue(); }); }catch(e){}
try{ hubStatus(); window.addEventListener("load", hubStatus); }catch(e){}
try{ legLoad().then(function(){ paintLegacy(); hubStatus(); syncTitle(); }); }catch(e){}
const HUB_KEY = "kotowaza-rensei";
const HUB_URL = "https://backtree-create.github.io/ManabiBox/";
/* 通常クリア5000（8章に等分）／修羅道クリア100000（8章に等分）／無限回廊は1層3000 */
function hubScore(){
  const dex = 2000*rankLv() + (craftedInPool()>=dexTotal() ? 20000 : 0) + 200*Math.min(100, plusTotal());
  return Math.round(5000/STORY_LEN*G.bestN + 100000/STORY_LEN*G.bestH + 3000*G.depth + dex);
}
function hubNote(){
  return "通常"+G.bestN+"章 修羅道"+G.bestH+"章"+
    (G.depth?" 無限"+G.depth+"層":"")+" 錬成"+dexCount()+"語"+(plusTotal()?"+"+plusTotal():"")+(rankLv()?"("+rankName()+")":"");
}
/* ハブ配点換算（古い hub-progress.js 向けフォールバック付き） */
function hubScale(r, o){ return (window.LearnHub && LearnHub.scale) ? LearnHub.scale(r, o) : Math.round(Math.max(0,Math.min(1,r))*10000); }
function hubEndless(r){ return (window.LearnHub && LearnHub.scaleEndless) ? LearnHub.scaleEndless(r) : Math.round(Math.max(0,Math.min(1,r))*30000); }
/* 出来ばえ 0〜1： 通常章×250 + 修羅道章×500 + 図鑑率×2400 + 位×250 を 10000 で割る（四字錬成と同じ式） */
function hubRatio(){
  /* 図鑑の項は学年内の割合で（中1の65語でも満点に届く） */
  return Math.min(1, (250*G.bestN + 500*G.bestH + 2400*Math.min(1, dexCount()/Math.max(1,dexTotal())) + 250*rankLv()) / 10000);
}
function hubDepth(){ return Math.max(G.depth|0, LEG.depth|0); }
function report(){
  try{ legSave(); }catch(e){}
  try{
    const H = window.LearnHub;
    if(!H || typeof H.report !== "function") return;
    const sc = hubScore();
    const depth = hubDepth();
    /* まなびの基板の仕様： {app, done, total, best, note, endless, raw} 。noteは40字まで */
    const payload = {
      app: HUB_KEY,
      done: Math.min(STORY_LEN*2, G.bestN + G.bestH),
      total: STORY_LEN*2,
      best: hubScale(hubRatio(), {grade: GRADE}),
      raw: sc,
      grade: GRADE,
      note: hubNote()
    };
    if(depth > 0) payload.endless = hubEndless(Math.min(1, depth/20));
    H.report(payload);
  }catch(e){}
}
function goHub(){
  report();
  try{ location.href = HUB_URL; }catch(e){}
}
