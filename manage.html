<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲームを追加 — まなびの基板</title>
<meta name="theme-color" content="#0B0F1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fields .full{grid-column:1 / -1;}
@media (max-width:640px){.fields{grid-template-columns:1fr;}}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;
  border:1px solid var(--edge);
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));}
.item .chip{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);}
.ico{width:20px;height:20px;}
.item .txt{flex:1;min-width:0;}
.item .txt b{display:block;font-size:15.5px;color:#fff;}
.item .txt span{font-family:"Outfit",sans-serif;font-size:11.5px;letter-spacing:.1em;color:var(--muted);}
.item .ops{display:flex;gap:6px;flex:none;}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--edge);background:none;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;}
.iconbtn:hover{color:var(--paper);border-color:rgba(190,205,235,.4);}

.swatches,.icons{display:flex;flex-wrap:wrap;gap:8px;}
.sw{width:32px;height:32px;border-radius:9px;border:2px solid transparent;cursor:pointer;}
.sw[aria-pressed="true"]{border-color:#fff;}
.ib{width:40px;height:40px;border-radius:11px;border:1px solid var(--edge);background:none;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;}
.ib[aria-pressed="true"]{border-color:#fff;color:#fff;background:rgba(255,255,255,.08);}

.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px;}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow"><span>Manabi Board / Manage</span><a class="linkbtn" href="index.html">ハブにもどる</a></div>

  <h1>ゲームを<span class="hl">追加する</span></h1>
  <p class="lede">ここで登録したゲームが、生徒のハブ画面にそのまま並びます。HTMLファイルを同じ場所に置いてから登録してください。</p>

  <section class="sheet" style="margin-bottom:26px;">
    <label class="fieldname" for="tk">先生用の合言葉</label>
    <input id="tk" type="password" placeholder="ADMIN_TOKEN">
    <p class="hint">スプレッドシートに保存するときだけ必要です。入力した値はこの端末にだけ残ります。</p>
  </section>

  <div class="rule"><h2>いま並んでいるゲーム</h2></div>
  <ul class="list" id="list"></ul>

  <div class="rule"><h2 id="formTitle">あたらしく追加</h2></div>
  <section class="sheet">
    <div class="fields">
      <div>
        <label class="fieldname" for="f-name">ゲーム名</label>
        <input id="f-name" type="text" placeholder="例：漢字マスター">
      </div>
      <div>
        <label class="fieldname" for="f-subject">教科</label>
        <input id="f-subject" type="text" placeholder="例：国語">
      </div>
      <div>
        <label class="fieldname" for="f-file">ファイル名 または URL</label>
        <input id="f-file" type="text" placeholder="例：kanji.html / https://…">
      </div>
      <div>
        <label class="fieldname" for="f-key">識別キー（半角英数）</label>
        <input id="f-key" type="text" placeholder="例：kanji-master">
      </div>
      <div class="full">
        <label class="fieldname" for="f-desc">せつめい</label>
        <input id="f-desc" type="text" maxlength="70" placeholder="ひと言でどんなゲームか">
      </div>
      <div>
        <label class="fieldname" for="f-unit">進み具合の単位</label>
        <input id="f-unit" type="text" placeholder="例：ステージ">
      </div>
      <div>
        <label class="fieldname" for="f-total">ぜんぶで何個</label>
        <input id="f-total" type="number" min="1" max="999" value="5">
      </div>
      <div class="full">
        <label class="fieldname">色</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="full">
        <label class="fieldname">アイコン</label>
        <div class="icons" id="icons"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="add" type="button">一覧に入れる</button>
      <button class="btn ghost small hidden" id="cancel" type="button">編集をやめる</button>
    </div>
    <p class="msg" id="formMsg"></p>
  </section>

  <div class="rule"><h2>保存</h2></div>
  <section class="sheet">
    <div class="actions" style="margin-top:0;">
      <button class="btn" id="save" type="button">スプレッドシートに保存</button>
      <button class="btn ghost small" id="download" type="button">apps.json を書き出す</button>
      <button class="btn ghost small" id="reload" type="button">読みなおす</button>
    </div>
    <p class="msg" id="saveMsg">スプレッドシートに保存すると、生徒の画面にすぐ反映されます。つないでいない場合は apps.json を書き出して差しかえてください。</p>
  </section>

  <footer>Manabi Board</footer>
</div>

<script src="config.js"></script>
<script src="icons.js"></script>
<script src="hub-progress.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const COLORS = ['#35E0D2','#8B7CFF','#FFA24C','#4ADE80','#FF6B9D','#7FB4FF','#F5D76E','#FF8A6B'];
const TK_KEY = 'manabi-manage:token';

let list = [], editIndex = null, color = COLORS[1], icon = 'star';

$('tk').value = localStorage.getItem(TK_KEY) || '';
$('tk').addEventListener('change', () => localStorage.setItem(TK_KEY, $('tk').value.trim()));

/* ---- 色とアイコンの選択 ----------------------------------- */
function paintPickers(){
  $('swatches').innerHTML = COLORS.map(c =>
    `<button class="sw" type="button" data-c="${c}" style="background:${c}"
      aria-pressed="${c === color}" aria-label="${c}"></button>`).join('');
  $('swatches').querySelectorAll('.sw').forEach(b =>
    b.addEventListener('click', () => { color = b.dataset.c; paintPickers(); }));

  $('icons').innerHTML = Object.keys(MANABI_ICONS).map(k =>
    `<button class="ib" type="button" data-i="${k}" aria-pressed="${k === icon}"
      title="${MANABI_ICON_LABELS[k] || k}">${manabiIcon(k)}</button>`).join('');
  $('icons').querySelectorAll('.ib').forEach(b =>
    b.addEventListener('click', () => { icon = b.dataset.i; paintPickers(); }));
}

/* ---- 一覧 ------------------------------------------------- */
function paintList(){
  if (!list.length){
    $('list').innerHTML = '<li class="msg">まだ1つも登録されていません。下のフォームから追加してください。</li>';
    return;
  }
  $('list').innerHTML = list.map((a, i) => `
    <li class="item" style="--accent:${esc(a.color)}">
      <span class="chip">${manabiIcon(a.icon)}</span>
      <span class="txt">
        <b>${esc(a.name)}</b>
        <span>${esc(a.subject)} / ${esc(a.file)} / ${a.total}${esc(a.unit)}</span>
      </span>
      <span class="ops">
        <button class="iconbtn" data-up="${i}" type="button" aria-label="上へ">&#8593;</button>
        <button class="iconbtn" data-down="${i}" type="button" aria-label="下へ">&#8595;</button>
        <button class="iconbtn" data-edit="${i}" type="button" aria-label="なおす">&#9998;</button>
        <button class="iconbtn" data-del="${i}" type="button" aria-label="消す">&#10005;</button>
      </span>
    </li>`).join('');

  $('list').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const d = b.dataset;
    if (d.up !== undefined && +d.up > 0) swap(+d.up, +d.up - 1);
    else if (d.down !== undefined && +d.down < list.length - 1) swap(+d.down, +d.down + 1);
    else if (d.edit !== undefined) startEdit(+d.edit);
    else if (d.del !== undefined && confirm('「' + list[+d.del].name + '」を一覧から消します。')) {
      list.splice(+d.del, 1); paintList();
    }
  }));
}
function swap(a, b){ const t = list[a]; list[a] = list[b]; list[b] = t; paintList(); }

/* ---- フォーム --------------------------------------------- */
function readForm(){
  return {
    key: $('f-key').value.trim(),
    name: $('f-name').value.trim(),
    subject: $('f-subject').value.trim(),
    file: $('f-file').value.trim(),
    desc: $('f-desc').value.trim(),
    unit: $('f-unit').value.trim() || 'ステージ',
    total: Math.max(1, Math.min(999, parseInt($('f-total').value, 10) || 1)),
    color, icon
  };
}
function clearForm(){
  ['f-key','f-name','f-subject','f-file','f-desc','f-unit'].forEach(id => $(id).value = '');
  $('f-total').value = 5;
  color = COLORS[1]; icon = 'star'; paintPickers();
  editIndex = null;
  $('formTitle').textContent = 'あたらしく追加';
  $('add').textContent = '一覧に入れる';
  $('cancel').classList.add('hidden');
  $('formMsg').textContent = '';
}
function startEdit(i){
  const a = list[i];
  $('f-key').value = a.key; $('f-name').value = a.name; $('f-subject').value = a.subject;
  $('f-file').value = a.file; $('f-desc').value = a.desc; $('f-unit').value = a.unit;
  $('f-total').value = a.total;
  color = a.color; icon = a.icon; paintPickers();
  editIndex = i;
  $('formTitle').textContent = '「' + a.name + '」をなおす';
  $('add').textContent = 'この内容にする';
  $('cancel').classList.remove('hidden');
  $('f-name').focus();
  window.scrollTo({ top: $('formTitle').offsetTop - 20, behavior: 'smooth' });
}

$('cancel').addEventListener('click', clearForm);

$('add').addEventListener('click', () => {
  const v = readForm();
  const msg = $('formMsg');
  msg.className = 'msg warn';

  if (!v.name){ msg.textContent = 'ゲーム名を入れてください。'; return; }
  if (!v.file){ msg.textContent = 'ファイル名を入れてください。例：kanji.html'; return; }
  if (!/^[a-z0-9-]{2,30}$/i.test(v.key)){
    msg.textContent = '識別キーは半角の英数字とハイフンだけ、2文字以上にしてください。'; return;
  }
  const dup = list.findIndex(a => a.key === v.key);
  if (dup !== -1 && dup !== editIndex){ msg.textContent = 'その識別キーはもう使われています。'; return; }

  if (editIndex === null) list.push(v); else list[editIndex] = v;
  paintList(); clearForm();
  msg.className = 'msg';
  msg.textContent = '一覧に入れました。まだ保存されていません。下の「スプレッドシートに保存」を押してください。';
});

/* ---- 読み書き --------------------------------------------- */
function load(){
  $('saveMsg').textContent = '読みこんでいます。';
  LearnHub.apps().then(l => {
    list = l || [];
    paintList();
    $('saveMsg').textContent = list.length + ' 件を読みこみました。';
  });
}

$('reload').addEventListener('click', () => {
  if (confirm('編集中の内容は消えます。読みなおしますか。')) load();
});

$('save').addEventListener('click', () => {
  const token = $('tk').value.trim();
  const m = $('saveMsg');
  if (!LearnHub.online()){
    m.className = 'msg warn';
    m.textContent = 'config.js に Apps Script のURLが入っていません。apps.json を書き出して差しかえてください。';
    return;
  }
  if (!token){ m.className = 'msg warn'; m.textContent = '先生用の合言葉を入れてください。'; return; }
  if (!list.length){ m.className = 'msg warn'; m.textContent = '一覧が空です。'; return; }

  localStorage.setItem(TK_KEY, token);
  m.className = 'msg'; m.textContent = '保存しています。';
  LearnHub.saveApps(list, token).then(r => {
    if (r && r.ok){
      m.className = 'msg';
      m.textContent = '保存しました。生徒の画面は、次に開いたときに新しい一覧になります。';
    } else {
      m.className = 'msg warn';
      m.textContent = r && r.error === 'bad-token'
        ? '合言葉がちがいます。' : '保存できませんでした。URLと公開設定を確かめてください。';
    }
  });
});

$('download').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(list, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'apps.json'; a.click();
  URL.revokeObjectURL(a.href);
});

paintPickers();
load();
</script>
</body>
</html>
