/* 金の装飾(層ごとの意匠) */
const RES=384;
const _pxCache={};
function lcg(s){let x=s>>>0;return()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296;};}
/* 抉れる位置は個体ごとに固定。段数が進むほど累積する */
/* 崩れ落ちた塊は足元に積もる */
function rubbleFor(def,seed,stage){
  const rnd=lcg(seed*104729+7), out=[], gx=def.gx||100, gy=def.gy||176, gr=def.gr||50;
  for(let i=0;i<stage;i++){
    const x=gx+(rnd()*2-1)*gr*0.85;
    const y=gy-2+rnd()*10;
    const r=4+rnd()*5;
    out.push([x,y,r]);
  }
  return out;
}
function creaturePixels(shape,color,stage){
  stage=stage||0;
  const key=shape+color+"#"+stage;
  if(!_pxCache[key]){
    const base=BODY[shape]||BODY.slime;
    let seed=0; for(let i=0;i<shape.length;i++) seed+=shape.charCodeAt(i)*11;
    let def=base;
    if(stage>0){
      const rub=rubbleFor(base,seed,stage);
      def=Object.assign({},base,{
        chip:{frac:Math.min(0.68,stage*0.155),cell:18,seed:seed},
        chipGlow:Math.min(1.1,0.4+stage*0.2),
        crack:(base.crack||0)+stage*0.18,
        det:(base.det||1.6)+stage*0.2,
        fur:(base.fur||0)+stage*0.5,
        s:base.s.concat(rub)
      });
    }
    const noise=makeNoise(seed);
    _pxCache[key]=renderPixels(def,color,RES,noise,makeFbm(noise));
  }
  return _pxCache[key];
}
function overlaySVG(shape,color){
  const def=BODY[shape]||BODY.slime;
  const fogc=mix(color,'#5a5470',.7);
  /* 焼き込めない「動く光」だけを重ねる:眼の明滅・舞う残り火・足元の霧 */
  const flick=(def.eyes||[]).map((e,i)=>
    `<circle cx="${e[0]}" cy="${e[1]}" r="${(e[2]*2.1).toFixed(1)}" fill="${EMBER}" opacity=".3" filter="url(#glw)">
      <animate attributeName="opacity" values=".16;.5;.16" dur="${(2.8+i*0.6).toFixed(1)}s" repeatCount="indefinite"/>
    </circle>`).join("");
  const emb=[[100,def.gy-40,2.2],[100-def.gr*0.4,def.gy-24,1.6],[100+def.gr*0.35,def.gy-32,1.8]]
    .map((e,i)=>`<circle cx="${e[0].toFixed(0)}" cy="${e[1]}" r="${e[2]}" fill="${EMBER}" opacity="0" filter="url(#glw)">
      <animate attributeName="cy" values="${e[1]};${e[1]-46}" dur="${6+i}s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur="${6+i}s" repeatCount="indefinite"/></circle>`).join("");
  return `<defs>
      <filter id="glw" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="fogf" x="-90%" y="-260%" width="280%" height="620%"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    ${(def.mist||[]).map((m,i)=>`<ellipse cx="${m[0]}" cy="${m[1]}" rx="${m[2]}" ry="${m[3]}" fill="${fogc}" opacity="${m[4]}" filter="url(#fogf)">
      <animate attributeName="rx" values="${m[2]};${(m[2]*1.18).toFixed(0)};${m[2]}" dur="${9+i*2}s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="${m[4]};${(m[4]*0.5).toFixed(2)};${m[4]}" dur="${9+i*2}s" repeatCount="indefinite"/>
    </ellipse>`).join("")}
    <ellipse cx="${def.gx||100}" cy="${def.gy}" rx="${def.gr}" ry="15" fill="${fogc}" opacity=".4" filter="url(#fogf)"/>
    <ellipse cx="${def.gx||100}" cy="${def.gy+5}" rx="${(def.gr*0.6).toFixed(0)}" ry="7" fill="#03020a" opacity=".75" filter="url(#fogf)"/>
    ${flick}${emb}`;
}

/* ============================================================
   撃破カットイン ― 破断と同じ割れ目に沿って body を砕く
   ============================================================ */
function clipHalf(poly,a,b){
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=b[0]-a[0],ny=b[1]-a[1];
  const side=p=>(p[0]-mx)*nx+(p[1]-my)*ny;
  const out=[];
  for(let i=0;i<poly.length;i++){
    const p=poly[i],q=poly[(i+1)%poly.length];
    const sp=side(p),sq=side(q);
    if(sp<=0) out.push(p);
    if((sp<0&&sq>0)||(sp>0&&sq<0)){
      const t=sp/(sp-sq);
      out.push([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t]);
    }
  }
  return out;
}
/* 種点のボロノイ領域を凸多角形として求める */
function shardPolys(n,w,h,seed){
  const rnd=lcg(seed),pts=[];
  for(let i=0;i<n;i++) pts.push([w*(0.12+rnd()*0.76), h*(0.12+rnd()*0.76)]);
  const rect=[[0,0],[w,0],[w,h],[0,h]];
  return pts.map((p,i)=>{
    let poly=rect;
    for(let j=0;j<n&&poly.length>2;j++){ if(i!==j) poly=clipHalf(poly,p,pts[j]); }
    return {poly:poly,cx:p[0],cy:p[1]};
  }).filter(s=>s.poly.length>2);
}
function playShatter(name,done){
  /* 演出が失敗しても進行は止めない。後始末は必ず走る */
  let finished=false;
  const finish=()=>{ if(finished)return; finished=true; done(); };
  const guard=setTimeout(finish,1400);
  try{ playShatterFx(name,()=>{clearTimeout(guard);finish();}); }
  catch(e){
    console.warn("撃破演出を省略しました:", (e&&e.message)||e);
    clearTimeout(guard); setTimeout(finish,260);
  }
}

function allowedMisses(){return Math.ceil(100/DIFF[diffKey].damage);}
/* 計算問題と語句・考察問題を、指定した数だけ取り出す */
function drawKind(pool,nCalc,nTerm){
  const calc=shuffle(pool.filter(q=>q.kind==="calc"));
  const term=shuffle(pool.filter(q=>q.kind!=="calc"));
  const a=calc.slice(0,Math.min(nCalc,calc.length));
  const b=term.slice(0,Math.min(nTerm,term.length));
  let out=a.concat(b);
  const lack=nCalc+nTerm-out.length;
  if(lack>0){
    const rest=calc.slice(a.length).concat(term.slice(b.length));
    out=out.concat(shuffle(rest).slice(0,lack));
  }
  return out;
}
/* 難易度ごとに計算問題の割合を変える。端数は確率で丸め、長い目で見て設定値に一致させる */
function pickQuestions(id,n){
  const c=DIFF[diffKey];
  const nH=Math.min(Math.round(n*c.hardRatio),HARD[id].length);
  const nB=n-nH;
  const wantCalc=Math.max(0,Math.min(n,Math.floor(n*c.calcRatio+Math.random())));
  const cH=Math.min(nH,Math.round(wantCalc*nH/Math.max(1,n)));
  const cB=Math.min(nB,wantCalc-cH);
  return shuffle(drawKind(HARD[id],cH,nH-cH).concat(drawKind(QUESTIONS[id],cB,nB-cB)));
}
function refillQueue(){
  const id=FLOORS[floorIdx].id;
  const add=pickQuestions(id,4).filter(q=>floorQueue.indexOf(q)<0);
  floorQueue=floorQueue.concat(add.length?add:pickQuestions(id,4));
}

  floorQueue=pickQuestions(f.id,floorReq+allowedMisses()+1);
  qIdx=0;monsterIdx=0;locked=false;runToken++;

/* ============ 数値カウントアップ ============ */
function countUp(el,to,suffix,dur){
  const d=dur||900,t0=performance.now();
  (function step(t){
    const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);
    el.innerHTML=Math.round(to*e)+(suffix||"");
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function statCell(label,valueId,suffix){
  return `<div class="stat"><span class="v" id="${valueId}">0</span><span class="cap">${label}</span></div>`;
}
function reviewHTML(list,head){
  if(!list.length)return `<div class="review-item" style="border-top:none;color:var(--good)">誤答なし。完全な 読み解きだった。</div>`;
  return `<div class="cap" style="text-align:left">${head}</div>`+list.map(w=>
    `<div class="review-item"><div class="q">Q. ${w.q}</div><div class="a">A. ${w.correctText}</div><div class="exp">${w.exp}</div></div>`).join("");
}

/* 古い hub-progress.js がキャッシュされている端末のためのフォールバック */
function hubScale(r,o){ return (window.LearnHub&&LearnHub.scale)?LearnHub.scale(r,o):Math.round(Math.max(0,Math.min(1,r))*10000); }
function sendToHub(done,note){
  if(!window.manabiReport) return;
  /* 出来ばえ = (クリア層数/5) × 正答率。難易度係数はハブ側で掛ける */
  const rate=score.total?score.correct/score.total:0;
  const ratio=Math.max(0,Math.min(1,done/FLOORS.length))*rate;
  const diff=(DIFF[diffKey]&&DIFF[diffKey].tier)||"normal";
  window.manabiReport({
    app:"science-quest",
    done:done,
    total:FLOORS.length,
    best:hubScale(ratio,{diff:diff}),
    raw:score.correct,
    note:"正解 "+score.correct+"/"+score.total+"・"+note
  });
}

/* ============ 層のクリア ============ */
function goFloorClear(fled){
  const f=FLOORS[floorIdx];
  sendToHub(floorIdx+1,f.label+" 制覇");
  mountEmblem($("floorClearMedal"),"floor",f.color);
  $("floorClearTitle").textContent=fled?`${f.label} を あとにした`:`${f.label} 制覇`;
  $("floorClearStats").innerHTML=statCell("この層の正答","fcA","")+statCell("累計正答","fcB","")+statCell("正答率","fcC","%");
  countUp($("fcA"),floorScore.correct,"");
  countUp($("fcB"),score.correct,"");
  countUp($("fcC"),score.total?Math.round(score.correct/score.total*100):0,"%");
  warmFloor(floorIdx+1);
  if(floorIdx+1>=FLOORS.length) warmEmblem(DIFF[diffKey].tier);
  showScreen("screen-floorClear");
}
$("btnNextFloor").addEventListener("click",()=>{
  floorIdx++;
  if(floorIdx<FLOORS.length)ensureFloorReady(floorIdx,goFloorIntro);else goEnd();
});

/* ============ 踏破(難易度別の演出) ============ */
function goEnd(){
  const c=DIFF[diffKey];
  sendToHub(FLOORS.length,DIFF[diffKey].label+" で全層踏破");
  const pct=score.total?Math.round(score.correct/score.total*100):0;
  let rankJp="見習い観測者",rankLa="NOVICE";
  if(pct>=95){rankJp="賢者";rankLa="SAGE";}
  else if(pct>=85){rankJp="上級研究者";rankLa="SAVANT";}
  else if(pct>=70){rankJp="観測者";rankLa="OBSERVER";}

  const scr=$("screen-end");
  scr.className="screen center tier-"+c.tier;
  setElem(FLOORS[FLOORS.length-1].color);

  $("endEyebrow").textContent=c.eyebrow;
  mountEmblem($("endMedal"),c.tier);
  $("endTitle").textContent=c.title;
  $("endRankName").textContent=`${c.latin} · ${rankLa} — ${rankJp}`;

  $("endStats").innerHTML=statCell("正答率","enA","%")+statCell("正答数","enB","")+statCell("出題数","enC","");
  countUp($("enA"),pct,"%",1200);
  countUp($("enB"),score.correct,"",1000);
  countUp($("enC"),score.total,"",800);

  const badges=[];
  if(!wrongLog.length)badges.push(`<span class="badge hot"><i></i>無傷 踏破</span>`);
  if(pct>=90)badges.push(`<span class="badge"><i></i>精度 90%超</span>`);
  if(diffKey==="expert")badges.push(`<span class="badge"><i></i>極難度 制覇</span>`);
  if(!retryCount)badges.push(`<span class="badge"><i></i>一度も 倒れず</span>`);
  $("endBadges").innerHTML=badges.map((b,i)=>b.replace('class="badge',`style="animation-delay:${.5+i*.14}s" class="badge`)).join("");

  $("endReview").innerHTML=reviewHTML(wrongLog,"取り違えた 理の 復習");

  const motes=$("endMotes");
  const n=c.tier==="expert"?30:(c.tier==="hard"?14:0);
  motes.innerHTML=Array.from({length:n},()=>{
    const dur=(Math.random()*6+7).toFixed(1),d=(Math.random()*7).toFixed(1);
    return `<span class="mote" style="left:${(Math.random()*100).toFixed(1)}%;animation-duration:${dur}s;animation-delay:${d}s"></span>`;
  }).join("");

  $("endOrbitRing").innerHTML=c.tier==="expert"
    ? FLOORS.slice(0,4).map(f=>`<span class="os">${sigilSVG(f.sigil,24,f.color)}</span>`).join("") : "";

  if(c.tier==="expert"){
    const fl=$("endFlash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
  }
  showScreen("screen-end");
}
$("btnReplay").addEventListener("click",()=>{showScreen("screen-title");replay($("screen-title"));});

})();

/* オフライン対応。file:// で開いた場合や非対応環境では何もしない */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.info("オフライン機能は無効です:",(e&&e.message)||e);
    });
  });
}
