<style>
:root{
  --void:#080611;
  --deep:#0e0a1d;
  --panel:rgba(22,16,42,.66);
  --hair:rgba(214,178,106,.26);
  --hair-soft:rgba(214,178,106,.12);
  --brass:#d6b26a;
  --brass-lt:#f4e3b6;
  --text:#ece7f5;
  --muted:#9a91bb;
  --c-physics:#5b8cff;
  --c-chemistry:#2fd3a5;
  --c-biology:#ffc857;
  --c-earth:#d08a4e;
  --c-boss:#b06ef5;
  --elem:#b06ef5;
  --good:#5fe0a0;
  --bad:#ff6f7d;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:var(--void);
  color:var(--text);
  font-family:'Zen Kaku Gothic New',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;}
/* 画面内でスクロールする領域だけ慣性を許す */
#quizBox,.review-list,.clear-card{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
#stage{
  position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 45% at 22% 8%, rgba(120,110,220,.16), transparent 62%),
    radial-gradient(ellipse 60% 55% at 82% 96%, rgba(176,110,245,.16), transparent 64%),
    linear-gradient(178deg,#0d0920 0%,#080611 62%,#05040c 100%);
  background:
    radial-gradient(ellipse 70% 50% at 22% 8%, color-mix(in srgb, var(--elem) 22%, transparent), transparent 62%),
    radial-gradient(ellipse 60% 55% at 82% 96%, rgba(176,110,245,.16), transparent 64%),
    linear-gradient(178deg,#0d0920 0%,#080611 62%,#05040c 100%);
  transition:background 1.2s var(--ease);
}
#nebula{
  position:absolute;inset:-6%;width:112%;height:112%;
  pointer-events:none;z-index:0;opacity:.32;
  mix-blend-mode:screen;filter:saturate(1.15);
  animation:nebDrift 90s ease-in-out infinite alternate;
}
@keyframes nebDrift{from{transform:translate3d(-1.5%,0,0) scale(1.02);}to{transform:translate3d(1.5%,-1.5%,0) scale(1.09);}}
#starfield{position:absolute;inset:0;pointer-events:none;z-index:1;}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}
#vignette{
  position:absolute;inset:0;pointer-events:none;z-index:40;
  background:radial-gradient(ellipse 78% 70% at 50% 46%, transparent 40%, rgba(4,3,10,.72) 100%);
}
#grain{
  position:absolute;inset:0;pointer-events:none;z-index:41;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;z-index:5;
  display:none;flex-direction:column;
  padding:clamp(14px,2.6vh,26px) clamp(14px,4vw,44px);
  padding-top:max(clamp(14px,2.6vh,26px),env(safe-area-inset-top));
  padding-bottom:max(clamp(14px,2.6vh,26px),env(safe-area-inset-bottom));
}
.screen.active{display:flex;}
.center{align-items:center;justify-content:center;text-align:center;}

/* ---------- primitives ---------- */
.cap{
  font-family:'Cinzel',serif;font-weight:500;
  letter-spacing:.26em;text-transform:uppercase;
  font-size:clamp(8.5px,1.15vh,10.5px);color:var(--muted);
}
.mono{font-family:'Roboto Mono',monospace;font-size:clamp(9.5px,1.3vh,11.5px);color:var(--muted);letter-spacing:.06em;}
.jp-display{font-family:'Shippori Mincho B1',serif;font-weight:800;}
.panel{
  position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.052),rgba(255,255,255,.012)),var(--panel);
  border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 34px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  border-radius:2px;
}
.panel.gem::before{
  content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;
  transform:translateX(-50%) rotate(45deg);
  background:var(--brass);box-shadow:0 0 10px rgba(214,178,106,.6);
}
.rule{
  display:flex;align-items:center;gap:12px;width:100%;justify-content:center;
}
.rule::before,.rule::after{
  content:"";height:1px;flex:1;max-width:120px;
  background:linear-gradient(90deg,transparent,var(--hair),transparent);
}
.btn{
  position:relative;overflow:hidden;cursor:pointer;
  font-family:'Shippori Mincho B1',serif;font-weight:600;
  letter-spacing:.14em;
  font-size:clamp(12px,1.7vh,15px);
  color:var(--brass-lt);
  background:linear-gradient(rgba(214,178,106,.06),rgba(214,178,106,.015));
  border:1px solid var(--hair);border-radius:1px;
  padding:clamp(9px,1.4vh,14px) clamp(20px,4vw,34px);
  transition:color .3s,border-color .3s,box-shadow .4s,transform .18s var(--ease);
}
.btn::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 32%,rgba(244,227,182,.26) 50%,transparent 68%);
  transform:translateX(-130%);transition:transform .7s var(--ease);
}
.btn:hover,.btn:focus-visible{
  color:#fff;border-color:var(--brass);outline:none;
  box-shadow:0 0 26px rgba(214,178,106,.2),inset 0 0 20px rgba(214,178,106,.08);
}
.btn:hover::after,.btn:focus-visible::after{transform:translateX(130%);}
.btn:active{transform:translateY(1px);}
.btn.primary{
  border-color:rgba(214,178,106,.6);
  background:linear-gradient(rgba(214,178,106,.16),rgba(214,178,106,.04));
}
.btn.ghost{color:var(--muted);border-color:var(--hair-soft);}
.btn.ghost:hover{color:var(--text);}
.sigil{display:inline-block;line-height:0;}
.sigil svg{display:block;}

/* ---------- entrance animations ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.86);}to{opacity:1;transform:scale(1);}}
@keyframes drawIn{from{stroke-dashoffset:var(--len,400);}to{stroke-dashoffset:0;}}
@keyframes spinSlow{to{transform:rotate(360deg);}}
@keyframes spinRev{to{transform:rotate(-360deg);}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes pulseGlow{0%,100%{opacity:.5;box-shadow:0 0 6px var(--elem);}50%{opacity:1;box-shadow:0 0 16px var(--elem);}}
@keyframes shimmer{0%{background-position:-180% 0;}100%{background-position:280% 0;}}
@keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(5px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
@keyframes popIn{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}
@keyframes flash{from{opacity:.85;}to{opacity:0;}}
@keyframes mote{0%{transform:translateY(0) scale(1);opacity:0;}12%{opacity:.9;}100%{transform:translateY(-46vh) scale(.4);opacity:0;}}
@keyframes auroraShift{0%,100%{transform:translate3d(-6%,0,0) scale(1.1);}50%{transform:translate3d(8%,-4%,0) scale(1.25);}}
@keyframes hueRoll{to{filter:hue-rotate(360deg);}}
.rise{animation:riseIn .7s var(--ease) both;}
.d1{animation-delay:.06s;} .d2{animation-delay:.16s;} .d3{animation-delay:.28s;}
.d4{animation-delay:.4s;} .d5{animation-delay:.54s;} .d6{animation-delay:.68s;}

/* ---------- TITLE ---------- */
#screen-title{gap:clamp(8px,1.6vh,16px);}
#titleEyebrow{letter-spacing:.42em;}
#screen-title h1{
  margin:0;font-family:'Shippori Mincho B1',serif;font-weight:800;
  font-size:clamp(30px,6.4vh,60px);letter-spacing:.1em;line-height:1.1;
  background:linear-gradient(180deg,#fff 6%,var(--brass-lt) 46%,var(--brass) 78%,#8d6f34 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(214,178,106,.28));
}
#titleLatin{
  font-family:'Cinzel',serif;font-weight:500;letter-spacing:.5em;
  font-size:clamp(9px,1.4vh,12px);color:var(--brass);opacity:.85;padding-left:.5em;
}
#titleTag{color:var(--muted);font-size:clamp(11px,1.6vh,13.5px);letter-spacing:.06em;}
#sigilRow{display:flex;gap:clamp(14px,4vw,30px);align-items:center;}
#sigilRow .sg{opacity:.5;animation:sigilBeat 5.2s ease-in-out infinite;}
#sigilRow .sg:nth-child(2){animation-delay:.5s;}
#sigilRow .sg:nth-child(3){animation-delay:1s;}
#sigilRow .sg:nth-child(4){animation-delay:1.5s;}
@keyframes sigilBeat{0%,100%{opacity:.32;transform:translateY(0);}50%{opacity:1;transform:translateY(-4px);}}

#diffRow{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  width:min(96vw,720px);
}
.diff-card{
  flex:1 1 200px;min-width:180px;max-width:236px;
  text-align:left;cursor:pointer;
  padding:clamp(10px,1.7vh,16px) clamp(12px,2vw,18px);
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.008));
  border:1px solid var(--hair-soft);border-radius:2px;
  color:var(--text);
  transition:border-color .3s,background .3s,box-shadow .4s,transform .3s var(--ease);
  position:relative;overflow:hidden;
}
.diff-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--brass);opacity:0;transition:opacity .3s;
}
.diff-card:hover{border-color:var(--hair);transform:translateY(-2px);}
.diff-card.selected{
  border-color:var(--brass);
  background:linear-gradient(160deg,rgba(214,178,106,.16),rgba(214,178,106,.03));
  box-shadow:0 0 30px rgba(214,178,106,.14);
}
.diff-card.selected::before{opacity:1;}
.diff-card .rank{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.28em;color:var(--muted);}
.diff-card .name{font-family:'Shippori Mincho B1',serif;font-weight:600;font-size:clamp(13px,1.9vh,16px);margin:3px 0 5px;letter-spacing:.08em;}
.diff-card .desc{font-size:clamp(10px,1.3vh,11.5px);color:var(--muted);line-height:1.55;}
.marks{display:flex;gap:4px;margin-top:8px;}
.marks i{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--hair);display:block;}
.marks i.on{background:var(--brass);border-color:var(--brass);box-shadow:0 0 8px rgba(214,178,106,.7);}

/* ---------- LOADING ---------- */
#screen-loading{gap:clamp(10px,2vh,20px);}
.load-dial{position:relative;width:min(56vw,290px);aspect-ratio:1;}
.load-dial svg{width:100%;height:100%;transform:rotate(-90deg);}
.ld-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:2;}
.ld-arc{fill:none;stroke:var(--brass);stroke-width:2.6;stroke-linecap:round;
  filter:drop-shadow(0 0 7px rgba(214,178,106,.65));transition:stroke-dashoffset .45s var(--ease);}
.ld-ring{fill:none;stroke:rgba(214,178,106,.2);stroke-width:1;transform-origin:100px 100px;}
.ld-ring.a{stroke-dasharray:3 11;animation:spinSlow 26s linear infinite;}
.ld-ring.b{stroke-dasharray:6 18;animation:spinRev 38s linear infinite;}
.ld-ring.c{stroke:rgba(255,255,255,.07);stroke-dasharray:1 6;animation:spinSlow 60s linear infinite;}
.ld-core{fill:none;stroke:var(--elem);stroke-width:1.4;opacity:.5;transform-origin:100px 100px;
  animation:spinRev 12s linear infinite;}
.ld-pct{position:absolute;inset:0;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:clamp(21px,4.2vh,36px);
  color:var(--brass-lt);letter-spacing:.05em;text-shadow:0 0 24px rgba(214,178,106,.35);}
.ld-pct small{font-size:.44em;margin-left:2px;opacity:.7;}
#loadName{font-family:'Shippori Mincho B1',serif;font-weight:600;
  font-size:clamp(13px,2vh,17px);letter-spacing:.14em;min-height:1.5em;color:var(--text);}
#loadLore{color:var(--muted);font-size:clamp(10.5px,1.45vh,12.5px);
  max-width:min(88vw,460px);line-height:2;}
/* ---------- FLOOR INTRO ---------- */
#screen-floorIntro{gap:clamp(6px,1.4vh,14px);}
#floorStratum{font-family:'Cinzel',serif;letter-spacing:.4em;font-size:clamp(9px,1.3vh,11px);color:var(--muted);}
#floorIntroLabel{
  font-family:'Shippori Mincho B1',serif;font-weight:800;
  font-size:clamp(19px,3.6vh,34px);letter-spacing:.14em;
  color:var(--elem);
  text-shadow:0 0 30px rgba(160,150,230,.5);
  text-shadow:0 0 30px color-mix(in srgb,var(--elem) 55%,transparent);
}
#floorSigil{margin:2px 0;}
#floorSigil svg path,#floorSigil svg circle,#floorSigil svg line{
  stroke-dasharray:var(--len,400);animation:drawIn 1.5s var(--ease) both;
}
#floorIntroDesc{color:var(--muted);font-size:clamp(11px,1.6vh,13.5px);max-width:min(90vw,540px);line-height:1.9;}
#floorIntroMonsterWrap{width:min(40vw,190px);height:min(24vh,190px);animation:floatY 5s ease-in-out infinite;}
#floorIntroMonsterWrap{position:relative;}
#floorIntroMonsterWrap svg{width:100%;height:100%;}

/* ---------- BATTLE ---------- */
#screen-battle{gap:clamp(6px,1.2vh,12px);}
/* ハブの「もどる」ボタン(左上固定)と全画面ボタンの下に HUD を置く */
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0;padding-top:28px;}
.floor-tag{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:clamp(10px,1.4vh,12px);letter-spacing:.14em;}
.floor-tag .sigil{filter:drop-shadow(0 0 6px var(--elem));}
#progressDots{display:flex;gap:6px;}
.pd{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--hair-soft);transition:all .4s var(--ease);}
.pd.done{background:var(--elem);border-color:var(--elem);box-shadow:0 0 9px var(--elem);}
.pd.now{border-color:var(--brass);animation:pulseGlow 1.8s ease-in-out infinite;}

.stage-area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1vh,10px);position:relative;}
.ring-wrap{position:relative;height:100%;aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;}
.elem-ring{
  position:absolute;inset:2%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,var(--elem) 90deg,transparent 200deg,rgba(255,255,255,.12) 300deg,transparent 360deg);
  background:conic-gradient(from 0deg,transparent 0deg,color-mix(in srgb,var(--elem) 70%,transparent) 90deg,transparent 200deg,color-mix(in srgb,var(--elem) 30%,transparent) 300deg,transparent 360deg);
  -webkit-mask:radial-gradient(closest-side,transparent 79%,#000 80%);
  mask:radial-gradient(closest-side,transparent 79%,#000 80%);
  animation:spinSlow 34s linear infinite;opacity:.55;
}
.dial{position:absolute;inset:2%;pointer-events:none;opacity:.7;}
.orbit{
  position:absolute;inset:9%;border-radius:50%;
  animation:spinRev 26s linear infinite;
}
.orbit i{
  position:absolute;top:-3px;left:50%;width:5px;height:5px;margin-left:-2.5px;
  transform:rotate(45deg);background:var(--elem);box-shadow:0 0 10px var(--elem);opacity:.9;
}
.orbit i:nth-child(2){top:auto;bottom:-3px;opacity:.5;}
.hp-ring{position:absolute;inset:2%;transform:rotate(-90deg);}
.hp-ring .track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:2.5;}
.hp-ring .arc{fill:none;stroke:var(--elem);stroke-width:2.5;stroke-linecap:round;
  filter:drop-shadow(0 0 6px var(--elem));transition:stroke-dashoffset .6s var(--ease);}
#monsterSvgWrap{
  position:relative;z-index:2;width:70%;height:70%;
  display:flex;align-items:center;justify-content:center;
  animation:floatY 5.4s ease-in-out infinite;
  will-change:transform;
}
#monsterSvgWrap svg{width:100%;height:100%;}
.mon-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.6));}
.mon-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#monsterSvgWrap.hit{animation:shake .42s;}
.name-plate{
  display:flex;align-items:baseline;gap:12px;flex-shrink:0;
  padding:5px 16px;border-top:1px solid var(--hair-soft);border-bottom:1px solid var(--hair-soft);
}
#monsterName{font-family:'Shippori Mincho B1',serif;font-weight:600;font-size:clamp(13px,2vh,17px);letter-spacing:.12em;}
#monsterHpLabel{font-family:'Roboto Mono',monospace;font-size:clamp(9.5px,1.3vh,11px);color:var(--elem);}

#battleMessage{flex-shrink:0;padding:clamp(8px,1.4vh,13px) clamp(12px,2.4vw,18px);
  font-size:clamp(11.5px,1.7vh,14px);line-height:1.6;min-height:calc(1.6em + clamp(16px,2.8vh,26px));}
#battleMessageText{animation:fadeIn .5s;}
.vitals{flex-shrink:0;display:flex;align-items:center;gap:clamp(8px,2vw,16px);padding:clamp(7px,1.2vh,11px) clamp(12px,2.4vw,18px);}
.segs{display:flex;gap:5px;flex:1 1 auto;}
.seg{
  flex:1 1 auto;max-width:46px;height:8px;
  background:linear-gradient(180deg,var(--good),#2c8f63);
  box-shadow:0 0 10px rgba(95,224,160,.4);
  transform:skewX(-22deg);transition:all .45s var(--ease);
}
.seg.lost{background:rgba(255,255,255,.07);box-shadow:none;animation:segBreak .5s var(--ease);}
@keyframes segBreak{0%{transform:skewX(-22deg) scaleY(1.9);background:var(--bad);}100%{transform:skewX(-22deg) scaleY(1);}}
.commands{flex-shrink:0;display:flex;gap:clamp(10px,2.5vw,18px);}
.commands .btn{flex:1 1 auto;justify-content:center;text-align:center;}

/* ---------- 撃破カットイン ---------- */
.shatter{position:absolute;inset:0;pointer-events:none;z-index:6;}
.shard{position:absolute;left:15%;top:15%;width:70%;height:70%;
  will-change:transform,opacity;}
.shard canvas{width:100%;height:100%;display:block;}
.burst{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,214,.95) 0%,rgba(255,164,74,.6) 34%,rgba(255,140,40,0) 70%);
  animation:burstOut .62s cubic-bezier(.14,.8,.3,1) forwards;}
@keyframes burstOut{0%{transform:translate(-50%,-50%) scale(.15);opacity:0;}
  22%{opacity:1;}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0;}}
.shockwave{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid var(--brass);opacity:.9;
  animation:shockOut .8s cubic-bezier(.1,.75,.25,1) forwards;}
@keyframes shockOut{0%{transform:translate(-50%,-50%) scale(.2);opacity:.95;border-width:3px;}
  100%{transform:translate(-50%,-50%) scale(3.2);opacity:0;border-width:.5px;}}
.spark{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
  border-radius:50%;background:#ffc06a;box-shadow:0 0 10px #ff9c3c;will-change:transform,opacity;}
#killBanner{
  position:absolute;left:0;right:0;top:42%;z-index:20;
  display:none;flex-direction:column;align-items:center;gap:4px;
  padding:clamp(8px,1.6vh,16px) 0;
  background:linear-gradient(90deg,transparent,rgba(8,6,16,.9) 12%,rgba(8,6,16,.9) 88%,transparent);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  pointer-events:none;
}
#killBanner.on{display:flex;animation:bandIn .95s cubic-bezier(.2,.9,.25,1) both;}
@keyframes bandIn{
  0%{opacity:0;-webkit-clip-path:inset(0 50% 0 50%);clip-path:inset(0 50% 0 50%);}
  22%{opacity:1;-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);}
  76%{opacity:1;-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);}
  100%{opacity:0;-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);transform:translateY(-6px);}
}
#killBanner .kb-latin{font-family:'Cinzel',serif;font-size:clamp(9px,1.3vh,11px);
  letter-spacing:.42em;color:var(--brass);}
#killBanner .kb-name{font-family:'Shippori Mincho B1',serif;font-weight:800;
  font-size:clamp(17px,3vh,28px);letter-spacing:.16em;color:#fff;
  text-shadow:0 0 26px rgba(255,164,74,.6);}
#killBanner .kb-rule{width:min(62%,340px);height:1px;
  background:linear-gradient(90deg,transparent,var(--brass),transparent);}

/* ---------- QUIZ ---------- */
#quizOverlay{
  position:absolute;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;
  padding:clamp(14px,3vh,34px) clamp(14px,4vw,44px);
  background:rgba(5,4,12,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#quizOverlay.active{display:flex;animation:fadeIn .28s;}
#quizBox{
  width:min(96vw,660px);max-height:94%;overflow-y:auto;
  padding:clamp(16px,2.8vh,28px) clamp(16px,3.2vw,32px);
  display:flex;flex-direction:column;gap:clamp(10px,1.7vh,16px);
  animation:cardRise .5s var(--ease) both;
}
@keyframes cardRise{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:none;}}
#quizBox::after{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--elem),transparent);
}
#quizHead{display:flex;align-items:center;gap:9px;}
#quizSubject{color:var(--elem);letter-spacing:.24em;}
#quizQuestion{
  font-family:'Shippori Mincho B1',serif;font-weight:600;
  font-size:clamp(13.5px,2.1vh,18px);line-height:1.85;letter-spacing:.02em;
}
#quizChoices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{
  position:relative;display:flex;align-items:flex-start;gap:11px;text-align:left;cursor:pointer;
  font-family:'Zen Kaku Gothic New',sans-serif;font-size:clamp(11.5px,1.6vh,14px);line-height:1.65;
  color:var(--text);
  background:linear-gradient(100deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid var(--hair-soft);border-left:2px solid transparent;border-radius:2px;
  padding:clamp(9px,1.4vh,13px) clamp(11px,2vw,16px);
  transition:all .26s var(--ease);
}
.choice-btn .key{
  flex-shrink:0;font-family:'Cinzel',serif;font-size:11px;color:var(--muted);
  width:19px;height:19px;display:grid;place-items:center;
  border:1px solid var(--hair-soft);transform:rotate(45deg);transition:all .26s;
}
.choice-btn .key span{transform:rotate(-45deg);}
.choice-btn:hover:not(:disabled),.choice-btn:focus-visible:not(:disabled){
  border-left-color:var(--elem);background:linear-gradient(100deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
  transform:translateX(5px);outline:none;
}
.choice-btn:hover:not(:disabled) .key{border-color:var(--elem);color:var(--elem);}
.choice-btn:disabled{cursor:default;opacity:.55;}
.choice-btn.correct{
  opacity:1;border-color:var(--good);border-left-color:var(--good);
  background:linear-gradient(100deg,rgba(95,224,160,.2),rgba(95,224,160,.04));
  box-shadow:0 0 26px rgba(95,224,160,.22);animation:popIn .4s var(--ease);
}
.choice-btn.correct .key{border-color:var(--good);color:var(--good);}
.choice-btn.wrong{
  opacity:1;border-color:var(--bad);border-left-color:var(--bad);
  background:linear-gradient(100deg,rgba(255,111,125,.18),rgba(255,111,125,.03));
  animation:shake .42s;
}
/* 特技:分光 */
.skill-chip{
  display:flex;align-items:center;gap:9px;
  padding:clamp(9px,1.4vh,14px) clamp(14px,2.6vw,22px);
  border:1px solid var(--hair-soft);border-radius:1px;
  background:linear-gradient(rgba(214,178,106,.04),transparent);
}
.pips{display:flex;gap:5px;}
.pips i{
  width:7px;height:7px;transform:rotate(45deg);display:block;
  border:1px solid var(--hair);transition:all .4s var(--ease);
}
.pips i.on{background:var(--brass);border-color:var(--brass);box-shadow:0 0 9px rgba(214,178,106,.65);}
.hint-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.hint-btn{
  position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;gap:9px;
  font-family:'Shippori Mincho B1',serif;font-weight:600;letter-spacing:.12em;
  font-size:clamp(11px,1.5vh,13px);color:var(--brass-lt);
  background:linear-gradient(rgba(214,178,106,.1),rgba(214,178,106,.02));
  border:1px solid var(--hair);border-radius:1px;padding:7px 14px;min-height:40px;
  transition:all .3s var(--ease);
}
.hint-btn:hover:not(:disabled){border-color:var(--brass);color:#fff;box-shadow:0 0 22px rgba(214,178,106,.22);}
.hint-btn:disabled{opacity:.32;cursor:default;}
.hint-note{font-size:clamp(9.5px,1.25vh,11px);color:var(--muted);letter-spacing:.06em;}
.choice-btn.eliminated{
  opacity:.22;pointer-events:none;border-color:transparent;
  text-decoration:line-through;filter:grayscale(1);
  animation:dissolve .55s var(--ease) both;
}
@keyframes dissolve{
  0%{opacity:1;transform:translateX(0);filter:none;}
  35%{opacity:.9;transform:translateX(-6px);box-shadow:0 0 24px rgba(214,178,106,.5);}
  100%{opacity:.22;transform:translateX(0);filter:grayscale(1);}
}
#quizFeedback{display:none;flex-direction:column;gap:11px;animation:riseIn .45s var(--ease);}
#quizFeedback.active{display:flex;}
#feedbackHeadline{font-family:'Shippori Mincho B1',serif;font-weight:600;font-size:clamp(13px,2vh,17px);letter-spacing:.1em;display:flex;align-items:center;gap:9px;}
#feedbackHeadline.good{color:var(--good);}
#feedbackHeadline.bad{color:var(--bad);}
#feedbackHeadline .bolt{width:9px;height:9px;transform:rotate(45deg);background:currentColor;box-shadow:0 0 12px currentColor;animation:popIn .5s var(--ease) both;}
#feedbackExp{
  font-size:clamp(11.5px,1.6vh,13.5px);line-height:1.95;color:#ded8ef;
  border-left:2px solid var(--hair);padding-left:14px;
}
#feedbackContinue{align-self:flex-end;}

/* ---------- RESULT / CLEAR ---------- */
.fx-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.rays{
  position:absolute;left:50%;top:42%;width:210vmax;height:210vmax;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,
    rgba(244,227,182,.16) 0deg 3deg, transparent 3deg 13deg);
  -webkit-mask:radial-gradient(closest-side,#000 6%,rgba(0,0,0,.55) 30%,transparent 62%);
  mask:radial-gradient(closest-side,#000 6%,rgba(0,0,0,.55) 30%,transparent 62%);
  animation:spinSlow 54s linear infinite;opacity:0;
  transition:opacity 1s ease;
}
.aurora{
  position:absolute;width:76vw;height:58vh;border-radius:50%;
  filter:blur(76px);opacity:0;mix-blend-mode:screen;
  animation:auroraShift 15s ease-in-out infinite;
}
.aurora.a1{background:#5b8cff;left:-14%;top:-8%;}
.aurora.a2{background:#2fd3a5;right:-16%;top:24%;animation-delay:-4s;}
.aurora.a3{background:#b06ef5;left:18%;bottom:-22%;animation-delay:-8s;}
.motes{position:absolute;inset:0;}
.mote{
  position:absolute;bottom:-14px;width:4px;height:4px;border-radius:50%;
  background:var(--brass-lt);box-shadow:0 0 10px var(--brass);
  animation:mote linear infinite;
}
.flash{position:absolute;inset:0;background:#fff;opacity:0;}
.flash.go{animation:flash .9s var(--ease) both;}

.clear-card{
  position:relative;z-index:2;
  width:min(94vw,600px);max-height:94%;overflow:hidden;
  padding:clamp(14px,2.8vh,32px) clamp(18px,4vw,38px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.4vh,15px);
  text-align:center;
}
/* 記章・見出し・数値・バッジ・ボタンは縮まず常に見える */
.clear-card > .cap,
.clear-card > .medal-wrap,
.clear-card > .clear-title,
.clear-card > .rule,
.clear-card > .stat-grid,
.clear-card > .badges,
.clear-card > .btn,
.clear-card > .btn-row{flex:0 0 auto;}
.clear-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;
  box-shadow:inset 0 0 60px rgba(214,178,106,.06);
}
.medal-wrap{width:clamp(70px,14vh,148px);height:clamp(70px,14vh,148px);animation:medalIn 1s var(--ease) both;}
@keyframes medalIn{0%{opacity:0;transform:scale(.35) rotate(-24deg);}62%{opacity:1;transform:scale(1.1) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
.medal-wrap svg,.medal-wrap canvas{width:100%;height:100%;display:block;}
.clear-title{
  margin:0;font-family:'Shippori Mincho B1',serif;font-weight:800;
  font-size:clamp(20px,3.6vh,34px);letter-spacing:.14em;line-height:1.25;
}
.stat-grid{display:flex;gap:clamp(10px,3vw,26px);flex-wrap:wrap;justify-content:center;margin-top:2px;}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:78px;}
.stat .v{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(19px,3.2vh,30px);letter-spacing:.04em;color:var(--brass-lt);}
.stat .v small{font-size:.5em;letter-spacing:.1em;margin-left:1px;}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.badge{
  display:flex;align-items:center;gap:6px;
  font-size:clamp(10px,1.35vh,12px);letter-spacing:.1em;
  padding:5px 12px;border:1px solid var(--hair);border-radius:999px;
  color:var(--brass-lt);background:rgba(214,178,106,.07);
  animation:popIn .5s var(--ease) both;
}
.badge i{width:6px;height:6px;transform:rotate(45deg);background:currentColor;display:block;}
.badge.hot{border-color:var(--good);color:var(--good);background:rgba(95,224,160,.09);box-shadow:0 0 20px rgba(95,224,160,.22);}
.review-list{
  text-align:left;display:flex;flex-direction:column;gap:10px;width:100%;
  font-size:clamp(10.5px,1.4vh,12.5px);
  flex:0 1 auto;min-height:0;overflow-y:auto;
  margin:2px 0;padding:6px 10px 8px 0;
  border-top:1px solid rgba(255,255,255,.07);
  border-bottom:1px solid rgba(255,255,255,.07);
  -webkit-mask:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
  mask:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
}
.review-list:empty{display:none;}
.review-item{border-top:1px solid rgba(255,255,255,.08);padding-top:8px;line-height:1.75;}
.review-item .q{color:#fff;margin-bottom:3px;}
.review-item .a{color:var(--good);}
.review-item .exp{color:var(--muted);margin-top:2px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

/* tier: ふつう(銀) */
#screen-end.tier-normal .rays{opacity:.2;}
#screen-end.tier-normal .clear-title{
  background:linear-gradient(180deg,#fff 10%,#d5dcec 52%,#8e97b0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
/* tier: むずかしい(金) */
#screen-end.tier-hard .rays{opacity:.55;animation-duration:38s;}
#screen-end.tier-hard .clear-card{border-color:rgba(214,178,106,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.55),0 0 60px rgba(214,178,106,.12);}
#screen-end.tier-hard .clear-title{
  background:linear-gradient(100deg,#f7e9c4 8%,#fff8e2 26%,var(--brass) 46%,#fff8e2 62%,#c99f4e 88%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 4.5s linear infinite;
}
/* tier: エキスパート(虹) */
#screen-end.tier-expert .rays{opacity:.8;animation-duration:26s;
  background:repeating-conic-gradient(from 0deg,
    rgba(91,140,255,.2) 0deg 3deg, transparent 3deg 9deg,
    rgba(176,110,245,.18) 9deg 12deg, transparent 12deg 20deg);}
#screen-end.tier-expert .aurora{opacity:.3;}
#screen-end.tier-expert .clear-card{
  border-color:transparent;
  background:linear-gradient(160deg,rgba(28,20,52,.9),rgba(14,10,29,.92));
}
#screen-end.tier-expert .clear-card::before{
  content:"";position:absolute;inset:-1.5px;border-radius:2px;pointer-events:none;
  background:conic-gradient(from 0deg,#5b8cff,#2fd3a5,#ffc857,#d08a4e,#b06ef5,#5b8cff);
  padding:1.5px;
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  mask-composite:exclude;
  animation:spinSlow 8s linear infinite;
}
#screen-end.tier-expert .clear-title{
  background:linear-gradient(100deg,#9fc0ff,#7ff0cd,#ffe08a,#e2a8ff,#9fc0ff);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 6s linear infinite;
  filter:drop-shadow(0 0 22px rgba(176,110,245,.5));
}
#screen-end.tier-expert .medal-wrap{filter:drop-shadow(0 0 26px rgba(176,110,245,.55));}
#screen-end.tier-expert .stat .v{color:#fff;}

/* orbiting element sigils (expert only) */
#endOrbit{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:1;pointer-events:none;}
#screen-end.tier-expert #endOrbit{display:flex;}
.orbit-ring{position:relative;width:clamp(180px,30vh,300px);height:clamp(180px,30vh,300px);animation:spinSlow 22s linear infinite;}
.orbit-ring .os{position:absolute;width:26px;height:26px;margin:-13px;display:grid;place-items:center;opacity:.85;}
.orbit-ring .os:nth-child(1){top:0;left:50%;}
.orbit-ring .os:nth-child(2){top:50%;left:100%;}
.orbit-ring .os:nth-child(3){top:100%;left:50%;}
.orbit-ring .os:nth-child(4){top:50%;left:0;}
.orbit-ring .os svg{animation:spinRev 22s linear infinite;}

/* floor clear / defeat */
#screen-floorClear .rays{opacity:.3;
  background:repeating-conic-gradient(from 0deg,rgba(214,178,106,.18) 0deg 3deg, transparent 3deg 14deg);
  background:repeating-conic-gradient(from 0deg,
    color-mix(in srgb,var(--elem) 26%,transparent) 0deg 3deg, transparent 3deg 14deg);}
#screen-floorClear .clear-title{color:var(--elem);text-shadow:0 0 34px rgba(160,150,230,.5);
  text-shadow:0 0 34px color-mix(in srgb,var(--elem) 55%,transparent);}
#screen-defeat .clear-title{color:var(--bad);}
#screen-defeat .rays{opacity:.16;background:repeating-conic-gradient(from 0deg,rgba(255,111,125,.2) 0deg 3deg,transparent 3deg 16deg);}

#fullscreenBtn{
  position:absolute;top:10px;right:12px;z-index:45;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;
  background:rgba(14,10,29,.7);color:var(--muted);
  border:1px solid var(--hair-soft);border-radius:1px;
  padding:9px 12px;min-height:36px;cursor:pointer;transition:all .3s;
}
#fullscreenBtn:hover{color:var(--brass-lt);border-color:var(--brass);}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:rgba(214,178,106,.25);border-radius:3px;}

/* タッチ端末では hover の見た目を残さない(指を離した後も白く残る問題を防ぐ) */
@media (hover:none){
  .btn:hover,.btn:focus-visible{
    color:var(--brass-lt);border-color:var(--hair);box-shadow:none;
    background:linear-gradient(rgba(214,178,106,.06),rgba(214,178,106,.015));}
  .btn.primary:hover{background:linear-gradient(rgba(214,178,106,.16),rgba(214,178,106,.04));
    border-color:rgba(214,178,106,.6);}
  .btn:hover::after,.btn:focus-visible::after{transform:translateX(-130%);}
  .choice-btn:hover:not(:disabled),.choice-btn:focus-visible:not(:disabled){
    transform:none;border-left-color:transparent;
    background:linear-gradient(100deg,rgba(255,255,255,.05),rgba(255,255,255,.012));}
  .choice-btn:hover:not(:disabled) .key{border-color:var(--hair-soft);color:var(--muted);}
  .diff-card:hover{transform:none;border-color:var(--hair-soft);}
  .diff-card.selected:hover{border-color:var(--brass);}
  .cmd-btn:hover{color:var(--text);}
  .cmd-btn:hover::before{opacity:0;}
  .hint-btn:hover:not(:disabled){border-color:var(--hair);color:var(--brass-lt);box-shadow:none;}
  #fullscreenBtn:hover{color:var(--muted);border-color:var(--hair-soft);}
}
/* 押した瞬間の手応えは全環境で返す */
.btn:active{transform:translateY(1px);filter:brightness(1.25);}
.choice-btn:active:not(:disabled){filter:brightness(1.35);}
.diff-card:active{filter:brightness(1.2);}
.cmd-btn:active{filter:brightness(1.4);}
.hint-btn:active:not(:disabled){filter:brightness(1.3);}
/* 細い画面では選択肢と操作列を詰める */
@media (max-width:420px){
  .commands{gap:8px;}
  .choice-btn{padding:8px 10px;}
  .skill-chip{padding:8px 10px;}
}
/* 横長で背の低い画面(スマホ横持ち)では記章と余白を削る */
@media (max-height:460px){
  .medal-wrap{width:clamp(56px,12vh,96px);height:clamp(56px,12vh,96px);}
  .load-dial{width:min(34vh,180px);}
  .screen{padding-top:8px;padding-bottom:8px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<div id="stage">
  <svg id="nebula" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <filter id="nebF" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.0055" numOctaves="5" seed="17" result="t"/>
        <feColorMatrix in="t" type="saturate" values="0" result="g"/>
        <feComponentTransfer in="g" result="cc">
          <feFuncR type="gamma" exponent="4.5" amplitude="1.7"/>
          <feFuncG type="gamma" exponent="4.5" amplitude="1.7"/>
          <feFuncB type="gamma" exponent="4.5" amplitude="1.7"/>
        </feComponentTransfer>
        <feGaussianBlur in="cc" stdDeviation="2.4"/>
      </filter>
      <mask id="nebM"><rect width="400" height="300" filter="url(#nebF)" fill="#fff"/></mask>
      <linearGradient id="nebG" x1="0" y1="0" x2="0.9" y2="1">
        <stop id="nebStopA" offset="0%" stop-color="#b06ef5"/>
        <stop id="nebStopB" offset="100%" stop-color="#2b2a72"/>
      </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#nebG)" mask="url(#nebM)"/>
  </svg>
  <div id="starfield"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <button id="fullscreenBtn">FULLSCREEN</button>

  <!-- TITLE -->
  <div class="screen center active" id="screen-title">
    <div class="cap rise d1" id="titleEyebrow">Observatorium</div>
    <h1 class="rise d2">サイエンスクエスト</h1>
    <div class="rule rise d2"><span id="titleLatin">SCIENCE QUEST</span></div>
    <div id="titleTag" class="rise d3">理科の理(ことわり)を武器に、観測塔の五層を踏破せよ</div>
    <div id="sigilRow" class="rise d3"></div>
    <div id="diffRow" class="rise d4"></div>
    <button class="btn primary rise d5" id="btnStart">登塔する</button>
  </div>

  <!-- LOADING -->
  <div class="screen center" id="screen-loading">
    <div class="cap" id="loadStatus">Calibrating the lens</div>
    <div class="load-dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ld-ring c" cx="100" cy="100" r="94"></circle>
        <circle class="ld-ring a" cx="100" cy="100" r="72"></circle>
        <circle class="ld-ring b" cx="100" cy="100" r="58"></circle>
        <ellipse class="ld-core" cx="100" cy="100" rx="44" ry="16"></ellipse>
        <ellipse class="ld-core" cx="100" cy="100" rx="44" ry="16" transform="rotate(60 100 100)"></ellipse>
        <ellipse class="ld-core" cx="100" cy="100" rx="44" ry="16" transform="rotate(120 100 100)"></ellipse>
        <g id="loadTicks"></g>
        <circle class="ld-track" cx="100" cy="100" r="84"></circle>
        <circle class="ld-arc" id="loadArc" cx="100" cy="100" r="84"></circle>
      </svg>
      <div class="ld-pct"><span id="loadPct">0</span><small>%</small></div>
    </div>
    <div id="loadName"></div>
    <div id="loadLore"></div>
  </div>

  <!-- FLOOR INTRO -->
  <div class="screen center" id="screen-floorIntro">
    <div id="floorStratum" class="rise d1"></div>
    <div id="floorSigil" class="rise d1"></div>
    <div id="floorIntroLabel" class="rise d2"></div>
    <div id="floorIntroMonsterWrap" class="rise d3"></div>
    <div id="floorIntroDesc" class="rise d4"></div>
    <button class="btn rise d5" id="btnFloorEnter">層へ 踏み入る</button>
  </div>

  <!-- BATTLE -->
  <div class="screen" id="screen-battle">
    <div class="hud-top">
      <div class="floor-tag"><span class="sigil" id="battleSigil"></span><span id="battleFloorLabel"></span></div>
      <div id="progressDots"></div>
    </div>

    <div class="stage-area">
      <div class="ring-wrap">
        <div class="elem-ring"></div>
        <svg class="dial" id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <div class="orbit"><i></i><i></i></div>
        <svg class="hp-ring" viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="92"></circle>
          <circle class="arc" id="hpArc" cx="100" cy="100" r="92"></circle>
        </svg>
        <div id="monsterSvgWrap"></div>
      </div>
      <div class="name-plate">
        <span id="monsterName"></span>
        <span id="monsterHpLabel"></span>
      </div>
    </div>

    <div id="killBanner">
      <div class="kb-rule"></div>
      <div class="kb-latin">Shattered</div>
      <div class="kb-name" id="killName"></div>
      <div class="kb-rule"></div>
    </div>

    <div class="panel" id="battleMessage"><span id="battleMessageText"></span></div>

    <div class="panel vitals">
      <span class="cap">Resolve · Tower</span>
      <div class="segs" id="playerSegs"></div>
      <span class="mono" id="playerHpText"></span>
    </div>

    <div class="commands">
      <button class="btn primary" id="btnAttack">こうげき</button>
      <div class="skill-chip"><span class="cap">Spectrum</span><span class="pips" id="spectrumPips"></span></div>
    </div>

    <!-- QUIZ -->
    <div id="quizOverlay">
      <div id="quizBox" class="panel">
        <div id="quizAsking">
          <div id="quizHead"><span class="sigil" id="quizSigil"></span><span class="cap" id="quizSubject"></span></div>
          <div id="quizQuestion" style="margin:12px 0 14px"></div>
          <div class="hint-bar">
            <button class="hint-btn" id="btnSpectrum">分光 <span class="pips" id="spectrumPipsQuiz"></span></button>
            <span class="hint-note">光を分け、偽りの理を 二つ 退ける</span>
          </div>
          <div id="quizChoices"></div>
        </div>
        <div id="quizFeedback">
          <div id="feedbackHeadline"></div>
          <div id="feedbackExp"></div>
          <button class="btn" id="feedbackContinue">つづける</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FLOOR CLEAR -->
  <div class="screen center" id="screen-floorClear">
    <div class="fx-layer"><div class="rays"></div></div>
    <div class="clear-card panel gem">
      <div class="cap">Stratum Cleared</div>
      <div class="medal-wrap" id="floorClearMedal"></div>
      <h2 class="clear-title" id="floorClearTitle"></h2>
      <div class="stat-grid" id="floorClearStats"></div>
      <button class="btn primary" id="btnNextFloor">さらに 上へ</button>
    </div>
  </div>

  <!-- DEFEAT -->
  <div class="screen center" id="screen-defeat">
    <div class="fx-layer"><div class="rays"></div></div>
    <div class="clear-card panel gem">
      <div class="cap">Withdrawn</div>
      <h2 class="clear-title" id="defeatTitle">気力が 尽きた</h2>
      <div class="stat-grid" id="defeatStats"></div>
      <div class="review-list" id="defeatReview"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnRetryFloor">この層に 再挑戦</button>
        <button class="btn ghost" id="btnGiveUp">塔を 降りる</button>
      </div>
    </div>
  </div>

  <!-- END -->
  <div class="screen center" id="screen-end">
    <div class="fx-layer">
      <div class="rays"></div>
      <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
      <div class="motes" id="endMotes"></div>
      <div class="flash" id="endFlash"></div>
    </div>
    <div id="endOrbit"><div class="orbit-ring" id="endOrbitRing"></div></div>
    <div class="clear-card panel gem">
      <div class="cap" id="endEyebrow">Summit Reached</div>
      <div class="medal-wrap" id="endMedal"></div>
      <h2 class="clear-title" id="endTitle"></h2>
      <div class="rule"><span class="cap" id="endRankName"></span></div>
      <div class="stat-grid" id="endStats"></div>
      <div class="badges" id="endBadges"></div>
      <div class="review-list" id="endReview"></div>
      <button class="btn primary" id="btnReplay">再び 登塔する</button>
    </div>
  </div>
</div>

<script>
(function(){

const QUESTIONS = {
physics: [
 {q:"100Vの電源に20Ωの抵抗をつなぐとき、回路に流れる電流は何Aか。",choices:["5A","2A","20A","0.2A"],a:0,exp:"オームの法則(電流=電圧÷抵抗)より 100÷20=5A。"},
 {q:"物体にはたらく2つの力がつり合っているとき、物体の運動はどうなるか。",choices:["静止または等速直線運動を続ける","必ず静止する","しだいに加速する","しだいに減速して止まる"],a:0,exp:"力がつり合うと合力は0になり、静止か等速直線運動を続ける(慣性の法則)。"},
 {q:"凸レンズで、スクリーンに実像ができるのは物体をどこに置いたときか。",choices:["焦点の外側に置いたとき","焦点の内側に置いたとき","焦点上に置いたとき","レンズに接するとき"],a:0,exp:"物体が焦点の外側にあると、光が集まりスクリーンに実像ができる。"},
 {q:"音の高さを決める要素は何か。",choices:["振動数","振幅","音源の重さ","空気の温度だけ"],a:0,exp:"振動数(Hz)が多いほど音は高くなる。"},
 {q:"1Wとは、1秒間に何Jの仕事をする仕事率のことか。",choices:["1J","10J","100J","1000J"],a:0,exp:"仕事率1W=1秒間に1Jの仕事をする割合。"},
 {q:"水中で物体にはたらく浮力の大きさを決めるものは何か。",choices:["物体が押しのけた水の重さ","物体そのものの重さ","水の温度だけ","物体の色"],a:0,exp:"アルキメデスの原理により、浮力は押しのけた液体の重さに等しい。"},
 {q:"力学的エネルギー保存の法則で、位置エネルギーが減ると増えるものは何か。",choices:["運動エネルギー","熱エネルギー","電気エネルギー","化学エネルギー"],a:0,exp:"摩擦や空気抵抗がなければ、位置エネルギーの減少分は運動エネルギーの増加になる。"},
 {q:"大気圧が生じる主な原因は何か。",choices:["空気そのものの重さ","気温の変化","地球の自転","太陽の光"],a:0,exp:"大気圧は、上空にある空気の重さによって生じる圧力である。"},
 {q:"コイルの中の磁界を変化させて電流を発生させる現象を何というか。",choices:["電磁誘導","静電誘導","熱電効果","光電効果"],a:0,exp:"電磁誘導によって生じる電流を誘導電流といい、発電機の原理である。"},
 {q:"下敷きを髪の毛でこすると、下敷きが紙を引きつけるのはなぜか。",choices:["摩擦によって異なる種類の電気が生じ、引き合うため","同じ種類の電気が引き合うため","摩擦で熱が発生するため","空気が乾燥しているため"],a:0,exp:"摩擦によって物体が帯電し、異なる種類の電気(+と-)が引き合う。"},
 {q:"凹レンズを通った光はどうなるか。",choices:["光が広がるように屈折する(実像はできない)","光が1点に集まる","光は屈折しない","光は反射する"],a:0,exp:"凹レンズは光を広げるように屈折させ、常に虚像ができる。"},
 {q:"光の三原色に含まれないものはどれか。",choices:["黄","赤","緑","青"],a:0,exp:"光の三原色は赤・緑・青(RGB)。黄は色の三原色(絵の具)に含まれる。"},
 {q:"音は真空中を伝わるか。",choices:["伝わらない(空気などの媒質が必要)","伝わる","光より速く伝わる","水中でのみ伝わらない"],a:0,exp:"音は空気や水などの媒質の振動によって伝わるため、真空中では伝わらない。"},
 {q:"音の大きさを決める要素は何か。",choices:["振幅","振動数","波長","音源からの距離だけ"],a:0,exp:"振幅が大きいほど音は大きくなる。"},
 {q:"ばねに加える力の大きさとばねの伸びの関係を表す法則を何というか。",choices:["フックの法則","オームの法則","質量保存の法則","作用反作用の法則"],a:0,exp:"ばねの伸びは加えた力に比例する(フックの法則)。"},
 {q:"質量と重さの違いについて正しいのはどれか。",choices:["質量は場所によって変わらないが、重さ(重力)は場所によって変わる","質量も重さも場所によって変わらない","質量は場所によって変わるが重さは変わらない","質量と重さは全く同じ量である"],a:0,exp:"質量は物質そのものの量、重さは重力の大きさで、月面などでは重さが変化する。"},
 {q:"圧力の単位として使われるのはどれか。",choices:["Pa(パスカル)","J(ジュール)","W(ワット)","N(ニュートン)"],a:0,exp:"圧力の単位はパスカル(Pa)で、1Pa=1N/m^2。"},
 {q:"同じ力でも、力がはたらく面積が小さいほど圧力はどうなるか。",choices:["大きくなる","小さくなる","変わらない","0になる"],a:0,exp:"圧力=力÷面積のため、面積が小さいほど圧力は大きくなる。"},
 {q:"水深が深いほど水圧はどうなるか。",choices:["大きくなる","小さくなる","変わらない","0になる"],a:0,exp:"水圧は水の重さによって生じ、深いほど上にある水の量が増えるため大きくなる。"},
 {q:"2力の合力を求める作図方法を何というか。",choices:["平行四辺形の法則(力の合成)","フックの法則","作用反作用の法則","慣性の法則"],a:0,exp:"2つの力を2辺とする平行四辺形の対角線が合力を表す。"},
 {q:"直列回路で電流の大きさについて正しいのはどれか。",choices:["回路のどの点でも電流の大きさは等しい","抵抗が大きい部分ほど電流は大きい","電源に近いほど電流は大きい","電流はどこかで消費されてなくなる"],a:0,exp:"直列回路では電流の大きさはどこでも一定である。"},
 {q:"並列回路で、各抵抗にかかる電圧について正しいのはどれか。",choices:["電源の電圧と等しい(各抵抗で同じ)","抵抗の大きさに比例して変わる","すべて合計すると電源電圧になる","並列では電圧はかからない"],a:0,exp:"並列回路では、各抵抗に電源と同じ電圧がかかる。"},
 {q:"同じ大きさの抵抗を2つ直列につなぐと、合成抵抗はもとの何倍になるか。",choices:["2倍","0.5倍","4倍","変わらない"],a:0,exp:"直列の合成抵抗は各抵抗の和になるため2倍になる。"},
 {q:"同じ大きさの抵抗を2つ並列につなぐと、合成抵抗はもとの何倍になるか。",choices:["0.5倍","2倍","4倍","変わらない"],a:0,exp:"並列につなぐと合成抵抗はもとの抵抗より小さくなり、同じ抵抗2個なら0.5倍になる。"},
 {q:"電力(消費電力)を求める式はどれか。",choices:["電力=電圧×電流","電力=電圧÷電流","電力=電流÷電圧","電力=電圧+電流"],a:0,exp:"電力(W)=電圧(V)×電流(A)。"},
 {q:"1時間に100Wの電気器具を使ったときの電力量は何Whか。",choices:["100Wh","1Wh","10000Wh","1000Wh"],a:0,exp:"電力量(Wh)=電力(W)×時間(h)より100×1=100Wh。"},
 {q:"電流によって熱が発生する現象を利用した器具はどれか。",choices:["電気ストーブ(電熱線)","モーター","発電機","スピーカー"],a:0,exp:"電熱線に電流を流すとジュール熱が発生し、電気ストーブなどに利用される。"},
 {q:"2種類の異なる物質をこすり合わせたときに生じる電気を何というか。",choices:["静電気","電磁誘導による電気","化学電池の電気","地電流"],a:0,exp:"摩擦によって物体の表面に電気がたまる現象を静電気という。"},
 {q:"電流のまわりにできる磁界の向きを調べる考え方は何か。",choices:["右ねじの法則","フレミングの左手の法則","レンツの法則","オームの法則"],a:0,exp:"電流の向きに右ねじを進めるときのねじを回す向きが磁界の向きになる。"},
 {q:"コイルに流れる電流と磁界を利用して回転する力を得る装置はどれか。",choices:["モーター","発電機","変圧器","コンデンサー"],a:0,exp:"モーターは電流が磁界から受ける力を利用して回転運動を得る装置。"},
 {q:"磁石をコイルに出し入れしてコイルに電流を流す現象を何というか。",choices:["電磁誘導","静電誘導","電気分解","熱電効果"],a:0,exp:"磁界の変化によってコイルに電流が生じる現象を電磁誘導という。"},
 {q:"電磁誘導によって流れる電流を何というか。",choices:["誘導電流","交流電流のみ","静電流","渦電流のみ"],a:0,exp:"電磁誘導で生じる電流を誘導電流という。"},
 {q:"家庭のコンセントから供給される電流の種類はどれか。",choices:["交流","直流","静電流のみ","誘導電流のみ"],a:0,exp:"家庭用電源は向きが周期的に変わる交流である。"},
 {q:"一定の速さで一直線上を進む運動を何というか。",choices:["等速直線運動","等加速度運動","円運動","振動運動"],a:0,exp:"速さも向きも変わらない運動を等速直線運動という。"},
 {q:"物体に力がはたらいていない、またはつり合っているとき、静止していた物体はどうなるか。",choices:["静止し続ける(慣性の法則)","自然に動き出す","加速する","振動する"],a:0,exp:"慣性の法則により、力がつり合っていれば静止している物体は静止し続ける。"},
 {q:"ある物体がほかの物体に力を加えると、同時に相手からも力を受ける。この関係を何の法則というか。",choices:["作用・反作用の法則","慣性の法則","フックの法則","エネルギー保存の法則"],a:0,exp:"力を及ぼすと必ず同じ大きさで逆向きの力を受け返す(作用・反作用の法則)。"},
 {q:"物体を持ち上げる仕事の大きさは何によって決まるか。",choices:["加えた力の大きさと動かした距離","かかった時間だけ","物体の色","物体の温度"],a:0,exp:"仕事(J)=力(N)×移動距離(m)。"},
 {q:"同じ仕事をより短い時間で行うほど、仕事率はどうなるか。",choices:["大きくなる","小さくなる","変わらない","0になる"],a:0,exp:"仕事率=仕事÷時間のため、時間が短いほど仕事率は大きい。"},
 {q:"高い位置にある物体がもつエネルギーを何というか。",choices:["位置エネルギー","運動エネルギー","熱エネルギー","化学エネルギー"],a:0,exp:"高さと質量に応じて物体がもつエネルギーを位置エネルギーという。"},
 {q:"動いている物体がもつエネルギーを何というか。",choices:["運動エネルギー","位置エネルギー","弾性エネルギー","核エネルギー"],a:0,exp:"速さと質量に応じて物体がもつエネルギーを運動エネルギーという。"},
 {q:"斜面を使って物体を持ち上げるとき、仕事の大きさは直接持ち上げる場合と比べてどうなるか(摩擦を考えない場合)。",choices:["変わらない(仕事の原理)","小さくなる","大きくなる","0になる"],a:0,exp:"道具を使っても、摩擦がなければ仕事の大きさは変わらない(仕事の原理)。"},
 {q:"自由落下する物体の速さは時間とともにどうなるか。",choices:["一定の割合で増加する","一定である","減少する","変化しない"],a:0,exp:"自由落下では重力によって一定の割合(重力加速度)で速さが増していく。"},
 {q:"記録タイマーを使って運動を調べるとき、打点の間隔が広いほど物体の速さはどうか。",choices:["速い","遅い","止まっている","わからない"],a:0,exp:"一定時間ごとに打点するため、間隔が広いほど短時間で長い距離を進んでおり速いことがわかる。"},
 {q:"摩擦力がはたらく運動では、力学的エネルギーはどうなるか。",choices:["熱エネルギーなどに変わり、力学的エネルギーは減少する","常に一定に保たれる","運動エネルギーだけが増加し続ける","位置エネルギーだけが増加し続ける"],a:0,exp:"摩擦があると力学的エネルギーの一部が熱エネルギーに変わり、力学的エネルギーは保存されない。"},
 {q:"凸レンズを物体と焦点の間に置いたとき(焦点距離より近い)にできる像を何というか。",choices:["虚像(実際より大きく見える)","実像","反射像のみ","像はできない"],a:0,exp:"物体が焦点の内側にあるとき、凸レンズごしに見える大きな虚像ができる。"},
 {q:"光が異なる物質の境界で折れ曲がって進む現象を何というか。",choices:["屈折","反射","回折","干渉"],a:0,exp:"光が空気中から水中などに進むとき、境界で進む向きが変わる現象を屈折という。"},
 {q:"入射角と反射角の関係について正しいのはどれか。",choices:["入射角と反射角は等しい(反射の法則)","入射角は反射角より必ず大きい","入射角は反射角より必ず小さい","関係はない"],a:0,exp:"光が反射するとき、入射角と反射角は常に等しい。"},
 {q:"全反射が起こりやすいのはどのような場合か。",choices:["光が水やガラスから空気へ、ある角度以上で進もうとするとき","光が空気からガラスへ進むとき","光が真空中を進むとき","光が反射せず直進するとき"],a:0,exp:"光が密な媒質から疎な媒質へ大きな角度で進もうとすると、境界ですべて反射する全反射が起こる。"},
 {q:"電熱線の発熱量は、電流や電圧の大きさとどのような関係にあるか。",choices:["電流や電圧が大きいほど発熱量は大きくなる","電流や電圧が大きいほど発熱量は小さくなる","電流や電圧とは無関係である","電熱線の色だけで決まる"],a:0,exp:"発熱量は電力(電圧×電流)と時間に比例して大きくなる。"},
 {q:"重力による位置エネルギーは、物体の高さのほかに何に関係するか。",choices:["物体の質量","物体の色","物体の速さ","物体の温度"],a:0,exp:"位置エネルギーは質量と高さの両方に比例して大きくなる。"}

chemistry:[
 {q:"氷が水になる状態変化を何というか。",choices:["融解","蒸発","凝固","昇華"],a:0,exp:"固体が液体になる変化を融解という。"},
 {q:"塩酸に水酸化ナトリウム水溶液を加えて中和させると、水のほかに何ができるか。",choices:["塩(えん)","酸素","二酸化炭素","水素"],a:0,exp:"中和反応では、酸とアルカリが結びついて塩と水ができる。"},
 {q:"化学変化の前後で、物質全体の質量は変化しないという法則を何というか。",choices:["質量保存の法則","エネルギー保存の法則","慣性の法則","作用・反作用の法則"],a:0,exp:"化学変化の前後で原子の組み合わせは変わるが、原子の数と種類は変わらないため質量は保存される。"},
 {q:"鉄が空気中でさびる反応は、どのような化学変化か。",choices:["酸化","還元","中和","電気分解"],a:0,exp:"物質が酸素と結びつく変化を酸化という。さびは鉄の酸化によってできる。"},
 {q:"水を電気分解すると、陰極と陽極ではそれぞれ何が発生するか。",choices:["陰極に水素、陽極に酸素","陰極に酸素、陽極に水素","両極とも酸素","両極とも水素"],a:0,exp:"水の電気分解では、陰極から水素、陽極から酸素が体積比2:1で発生する。"},
 {q:"原子が電子を失ったり受け取ったりして電気を帯びた粒子を何というか。",choices:["イオン","分子","中性子","同位体"],a:0,exp:"電子を失うと陽イオン、受け取ると陰イオンになる。"},
 {q:"二酸化炭素を石灰水に通すとどうなるか。",choices:["白くにごる","青色になる","無色透明のまま","赤色になる"],a:0,exp:"二酸化炭素は石灰水中の水酸化カルシウムと反応し、白い炭酸カルシウムの沈殿ができる。"},
 {q:"溶解度が温度によって変化する性質を利用して、溶質を結晶として取り出す操作を何というか。",choices:["再結晶","蒸留","ろ過","中和"],a:0,exp:"温度による溶解度の差を利用し、結晶として物質を取り出す操作を再結晶という。"},
 {q:"酸性・アルカリ性の強さを表す数値を何というか。",choices:["pH","密度","質量数","モル濃度"],a:0,exp:"pHは7が中性、7より小さいほど酸性、大きいほどアルカリ性が強い。"},
 {q:"化学式 H2O が表す物質は何か。",choices:["水","過酸化水素","水素","酸素"],a:0,exp:"H2Oは水素原子2個と酸素原子1個からなる水の化学式。"},
 {q:"物質が状態変化するとき、粒子の数はどうなるか。",choices:["変化しない(粒子の運動や間隔が変わる)","増える","減る","半分になる"],a:0,exp:"状態変化では粒子の数は変わらず、粒子の運動の激しさや間隔が変化する。"},
 {q:"純粋な物質が状態変化している間、温度はどうなるか。",choices:["一定に保たれる","上がり続ける","下がり続ける","急激に変化する"],a:0,exp:"融点や沸点では、状態変化が終わるまで温度は一定に保たれる。"},
 {q:"2種類以上の物質が混ざり合ったものを何というか。",choices:["混合物","純物質","単体","化合物"],a:0,exp:"食塩水や空気のように複数の物質が混ざったものを混合物という。"},
 {q:"1種類の元素だけからできている物質を何というか。",choices:["単体","化合物","混合物","溶液"],a:0,exp:"酸素や鉄のように1種類の元素からなる物質を単体という。"},
 {q:"2種類以上の元素が結びついてできた物質を何というか。",choices:["化合物","単体","混合物","元素"],a:0,exp:"水や二酸化炭素のように、2種類以上の元素が結びついた物質を化合物という。"},
 {q:"酸素を発生させる実験でよく使われる方法はどれか。",choices:["過酸化水素水に二酸化マンガンを加える","炭酸水素ナトリウムを加熱する","石灰石にうすい塩酸を加える","塩化アンモニウムと水酸化カルシウムを混ぜて加熱する"],a:0,exp:"過酸化水素水(オキシドール)に二酸化マンガンを加えると酸素が発生する。"},
 {q:"二酸化炭素を発生させる実験でよく使われる方法はどれか。",choices:["石灰石にうすい塩酸を加える","亜鉛にうすい塩酸を加える","水を電気分解する","塩化ナトリウムを加熱する"],a:0,exp:"石灰石(炭酸カルシウム)にうすい塩酸を加えると二酸化炭素が発生する。"},
 {q:"水素を発生させる実験でよく使われる方法はどれか。",choices:["亜鉛にうすい塩酸を加える","石灰石にうすい塩酸を加える","二酸化マンガンに過酸化水素水を加える","食塩水を加熱する"],a:0,exp:"亜鉛や鉄などの金属にうすい塩酸を加えると水素が発生する。"},
 {q:"水にとけにくい気体を集める方法として適しているのはどれか。",choices:["水上置換法","上方置換法のみ","下方置換法のみ","ろ過"],a:0,exp:"水にとけにくい気体(酸素・水素など)は水上置換法で集めるのが一般的。"},
 {q:"空気より軽く、水にとけやすい気体(アンモニアなど)を集める方法はどれか。",choices:["上方置換法","下方置換法","水上置換法","蒸留"],a:0,exp:"アンモニアは空気より軽く水にとてもよくとけるため、上方置換法で集める。"},
 {q:"溶質が溶媒にとけた液全体を何というか。",choices:["溶液","結晶","沈殿","気体"],a:0,exp:"溶質が溶媒にとけて均一に混ざった液体を溶液という。"},
 {q:"100gの水に20gの砂糖をとかした水溶液の質量パーセント濃度は何%か。",choices:["約16.7%","20%","80%","120%"],a:0,exp:"濃度(%)=溶質の質量÷(溶質+溶媒の質量)×100=20÷120×100≒16.7%。"},
 {q:"固体が一定量の溶媒にとける限度の量を表す語句はどれか。",choices:["溶解度","密度","質量パーセント濃度","モル濃度"],a:0,exp:"一定量の溶媒にとける物質の最大量を溶解度という。"},
 {q:"混合物から、液体とその中にとけない固体を分ける操作を何というか。",choices:["ろ過","蒸留","再結晶","中和"],a:0,exp:"ろ紙を使って固体と液体を分ける操作をろ過という。"},
 {q:"液体を加熱して気体にし、それを冷やして再び液体として取り出す操作を何というか。",choices:["蒸留","ろ過","再結晶","電気分解"],a:0,exp:"沸点の違いを利用して混合物から特定の液体を分離する操作を蒸留という。"},
 {q:"酸化銀を加熱すると銀と気体に分解する。このとき発生する気体は何か。",choices:["酸素","二酸化炭素","水素","窒素"],a:0,exp:"酸化銀を加熱すると銀と酸素に分解する(熱分解)。"},
 {q:"炭酸水素ナトリウムを加熱すると、炭酸ナトリウム・水・気体に分解する。この気体は何か。",choices:["二酸化炭素","酸素","水素","アンモニア"],a:0,exp:"炭酸水素ナトリウムの熱分解では二酸化炭素が発生する。"},
 {q:"酸化物から酸素を取りのぞく化学変化を何というか。",choices:["還元","酸化","中和","電離"],a:0,exp:"酸化物が酸素を失う変化を還元といい、酸化と還元は同時に起こることが多い。"},

 {q:"物質が酸素と結びついて熱や光を出しながら激しく反応することを何というか。",choices:["燃焼","中和","電離","蒸発"],a:0,exp:"激しい酸化反応で熱や光を出すものを燃焼という。"},
 {q:"化学変化の前後で、反応にかかわった物質全体の質量の関係はどうなるか。",choices:["変化の前後で質量の総和は変わらない","反応後のほうが必ず重くなる","反応後のほうが必ず軽くなる","気体が発生すると必ず軽くなる"],a:0,exp:"密閉容器内では、化学変化の前後で物質全体の質量は変わらない(質量保存の法則)。"},
 {q:"金属を加熱して酸化物になるとき、質量が増えるのはなぜか。",choices:["結びついた酸素の分だけ質量が増えるため","金属が別の物質に変わり質量保存則は成り立たないため","熱によって質量が生まれるため","計測誤差のため"],a:0,exp:"金属原子に酸素原子が結びつくことで、その分だけ全体の質量が増加する。"},
 {q:"酸性の水溶液に共通する性質はどれか。",choices:["青色リトマス紙を赤色に変える","赤色リトマス紙を青色に変える","フェノールフタレイン溶液を赤色にする","pHが7より大きい"],a:0,exp:"酸性の水溶液は青色リトマス紙を赤色に変える性質がある。"},
 {q:"アルカリ性の水溶液に共通する性質はどれか。",choices:["赤色リトマス紙を青色に変える","青色リトマス紙を赤色に変える","pHが7より小さい","BTB溶液を黄色にする"],a:0,exp:"アルカリ性の水溶液は赤色リトマス紙を青色に変え、BTB溶液を青色にする。"},
 {q:"酸とアルカリが反応して、互いの性質を打ち消し合う反応を何というか。",choices:["中和","電離","還元","蒸発"],a:0,exp:"酸の水素イオンとアルカリの水酸化物イオンが結びついて水ができ、性質が打ち消される反応を中和という。"},
 {q:"電解質が水にとけて陽イオンと陰イオンに分かれることを何というか。",choices:["電離","中和","還元","昇華"],a:0,exp:"塩化ナトリウムなどの電解質は水にとけると陽イオンと陰イオンに分かれる(電離)。"},
 {q:"電解質水溶液に電流を流すことができるのはなぜか。",choices:["電解質がとけていてイオンが移動できるため","水がすべて中性だから","混合物であるため","色がついているため"],a:0,exp:"電解質水溶液中ではイオンが移動できるため、電流が流れ電気分解が起こる。"},
 {q:"塩化銅水溶液を電気分解したとき、陽極付近で確認できる特徴はどれか。",choices:["刺激臭(塩素のにおい)がする","赤色の金属が付着する","気体が発生しない","青色の沈殿ができる"],a:0,exp:"陽極からは塩素が発生し、特有の刺激臭がある。"},
 {q:"2種類の金属板と電解質水溶液を使って電流を取り出す装置を何というか。",choices:["電池(化学電池)","コンデンサー","変圧器","発電機"],a:0,exp:"金属のイオンへのなりやすさの違いを利用して電流を取り出す装置を電池という。"},
 {q:"ダニエル電池で、亜鉛板と銅板のうち、電子が流れ出す(-極になる)のはどちらか。",choices:["亜鉛板","銅板","どちらも同じ","どちらも変化しない"],a:0,exp:"亜鉛は銅よりイオンになりやすいため、亜鉛板が-極となり電子を放出する。"},
 {q:"原子の中心にあり、+の電気を帯びている部分を何というか。",choices:["原子核","電子","中性子だけ","分子"],a:0,exp:"原子核は陽子と中性子からなり、全体として+の電気を帯びる。"},
 {q:"原子核のまわりを回っている、-の電気を帯びた粒子を何というか。",choices:["電子","陽子","中性子","イオン"],a:0,exp:"電子は-の電気を帯び、原子核のまわりに存在する。"},
 {q:"同じ元素でも中性子の数が異なる原子どうしを何というか。",choices:["同位体","異性体","化合物","混合物"],a:0,exp:"陽子の数(原子番号)が同じでも中性子の数が異なる原子を同位体という。"},
 {q:"化学反応式を書くとき、必ず一致させなければならないのは何か。",choices:["矢印の左右で原子の種類と数","矢印の左右で物質の色","矢印の左右で状態(固体・液体・気体)","矢印の左右で質量パーセント濃度"],a:0,exp:"化学反応式は、反応の前後で原子の種類と数が変わらないように書く。"},
 {q:"食塩(塩化ナトリウム)の化学式はどれか。",choices:["NaCl","NaOH","HCl","CaCO3"],a:0,exp:"塩化ナトリウムはナトリウムイオンと塩化物イオンが1:1で結びついたNaClである。"},
 {q:"二酸化炭素の化学式はどれか。",choices:["CO2","CO","O2","H2CO3"],a:0,exp:"二酸化炭素は炭素原子1個と酸素原子2個からなるCO2である。"},

 {q:"塩酸のように、水にとけると酸性を示す物質に共通するイオンは何か。",choices:["水素イオン(H+)","水酸化物イオン(OH-)","炭酸イオン","ナトリウムイオン"],a:0,exp:"酸は水にとけると水素イオンを生じる性質をもつ。"},
 {q:"硫酸バリウムのように水にほとんどとけない物質が、水溶液中の反応でできて出てくることを何というか。",choices:["沈殿","昇華","電離","蒸留"],a:0,exp:"反応によって水にとけない固体ができ、底に沈むことを沈殿という。"},
 {q:"密閉容器の中で炭酸水素ナトリウムとうすい塩酸を反応させ、発生した気体を外に逃がさず全体の質量をはかると、反応の前後でどうなるか。",choices:["変わらない","反応後のほうが軽くなる","反応後のほうが重くなる","気体の分だけ必ず軽くなる"],a:0,exp:"密閉容器内では気体も含めて質量保存の法則が成り立ち、質量は変わらない。"}

biology:[

 {q:"マグネシウムと酸素は質量比3:2で結びつく。マグネシウム0.6gを完全に燃焼させると、酸化マグネシウムは何gできるか。",choices:["1.0g","0.4g","1.5g","0.9g"],a:0,exp:"0.6gのマグネシウムと結びつく酸素は0.4g。合わせて1.0gの酸化マグネシウムになる。"},
 {q:"水の電気分解を表す化学反応式として正しいものはどれか。",choices:["2H2O → 2H2 + O2","H2O → H2 + O2","2H2O → H2 + 2O2","H2O2 → H2 + O2"],a:0,exp:"矢印の左右で水素原子4個・酸素原子2個がそろう 2H2O → 2H2 + O2 が正しい。"},
 {q:"炭酸水素ナトリウムを加熱したときにできる物質の組み合わせはどれか。",choices:["炭酸ナトリウム・水・二酸化炭素","塩化ナトリウム・水・酸素","炭酸カルシウム・水素・酸素","水酸化ナトリウム・水素・二酸化炭素"],a:0,exp:"炭酸水素ナトリウムの熱分解では、炭酸ナトリウム・水・二酸化炭素の3つが生じる。"},
 {q:"質量パーセント濃度20%の食塩水250gには、食塩が何g含まれているか。",choices:["50g","20g","200g","25g"],a:0,exp:"250×0.20=50g。"},
 {q:"15%の食塩水200gに水を加えて10%の食塩水にしたい。加える水は何gか。",choices:["100g","50g","300g","150g"],a:0,exp:"食塩は30g。10%にするには全体が300g必要なので、加える水は300-200=100g。"},
 {q:"硝酸カリウムの溶解度が60℃で110g、20℃で32g(いずれも水100gあたり)であるとき、60℃の飽和水溶液(水100g使用)を20℃まで冷やすと結晶は何g出てくるか。",choices:["78g","110g","32g","142g"],a:0,exp:"110-32=78gがとけきれなくなり結晶として出てくる。"},
 {q:"塩酸に水酸化ナトリウム水溶液を加えていき、BTB溶液が緑色になった。さらに塩酸を加えると液の色はどうなるか。",choices:["黄色になる","青色になる","緑色のまま変わらない","無色になる"],a:0,exp:"中性の状態から酸を加えると酸性になるため、BTB溶液は黄色を示す。"},
 {q:"亜鉛にうすい塩酸を加えたときに発生する気体の性質として正しいものはどれか。",choices:["マッチの火を近づけると音を立てて燃える","石灰水を白くにごらせる","刺激臭があり水によくとける","線香の火を激しく燃やす"],a:0,exp:"発生するのは水素で、火を近づけるとポンと音を立てて燃える。"},
 {q:"ダニエル電池で、電子と電流の流れる向きの関係として正しいものはどれか。",choices:["電子は亜鉛板から銅板へ流れ、電流の向きはその逆である","電子も電流も亜鉛板から銅板へ流れる","電子は銅板から亜鉛板へ流れ、電流も同じ向きである","電子は移動しない"],a:0,exp:"電子は-極(亜鉛)から+極(銅)へ導線を移動し、電流の向きは電子の移動と逆向きと決められている。"},
 {q:"塩化銅水溶液の電気分解で陰極に銅が付着するのはなぜか。",choices:["銅イオンが陰極で電子を受け取り、銅原子になるため","銅原子が電子を失って陰極に集まるため","塩化物イオンが陰極で銅に変化するため","水が分解して銅ができるため"],a:0,exp:"陽イオンである銅イオンが陰極へ引かれ、電子を受け取って金属の銅になる。"},
 {q:"銅の粉末を加熱し続けると質量が増えるが、やがて増えなくなる。この理由はどれか。",choices:["すべての銅が酸素と結びついてしまったため","加熱によって銅が蒸発したため","酸素が銅から離れ始めたため","質量保存の法則が成り立たなくなるため"],a:0,exp:"銅と酸素は決まった質量比で結びつくため、すべて反応し終えるとそれ以上は質量が増えない。"},
 {q:"銅イオンを表すイオン式として正しいものはどれか。",choices:["Cu(2+)","Cu(-)","Cu2","Cu(+)"],a:0,exp:"銅原子は電子を2個失って2価の陽イオンになるため、Cu(2+)と表す。"},
 {q:"質量54g、体積20cm^3の金属の密度は何g/cm^3か。",choices:["2.7g/cm^3","0.37g/cm^3","1080g/cm^3","34g/cm^3"],a:0,exp:"密度=質量÷体積=54÷20=2.7g/cm^3(アルミニウムの密度)。"},
 {q:"水を電気分解するとき、少量の水酸化ナトリウムを加えるのはなぜか。",choices:["水に電流を流れやすくするため","水の沸点を下げるため","発生する気体の量を増やすため","水を中性に保つため"],a:0,exp:"純粋な水はほとんど電流を流さないため、電解質を加えてイオンを存在させ電流を流れやすくする。"}
],
biology:[
 {q:"だ液のはたらきを調べる実験で、試験管を約40℃の湯につけるのはなぜか。",choices:["ヒトの体温に近い温度で消化酵素がよくはたらくため","デンプンを溶かすため","ヨウ素液の色を出やすくするため","だ液を殺菌するため"],a:0,exp:"消化酵素は体温付近で最もよくはたらくため、40℃前後に保って実験する。"},
 {q:"BTB溶液を入れた水に息をふきこんで黄色にし、オオカナダモを入れて光を当てた。液の色はどうなり、その理由は何か。",choices:["青色に変わる。光合成で二酸化炭素が使われたため","さらに黄色が濃くなる。呼吸で二酸化炭素が増えたため","赤色に変わる。酸素が増えたため","変化しない。植物は水中で活動しないため"],a:0,exp:"光合成によって水中の二酸化炭素が減り、酸性がうすまってアルカリ性寄りになるため青色に変わる。"},
 {q:"葉の枚数と大きさをそろえた枝で蒸散量を調べたところ、何も処理しない場合13.0mL、葉の裏にワセリンをぬった場合4.0mLの水が減った。葉の裏側からの蒸散量はおよそ何mLか。",choices:["9.0mL","4.0mL","13.0mL","17.0mL"],a:0,exp:"裏をふさぐと裏からの蒸散がなくなるため、13.0-4.0=9.0mLが葉の裏側からの蒸散量になる。"},
 {q:"ヒトの血管のうち、酸素を最も多く含む血液が流れているのはどれか。",choices:["肺静脈","肺動脈","大静脈","じん静脈"],a:0,exp:"肺でガス交換を終えた血液が心臓へ戻る肺静脈には、最も酸素の多い動脈血が流れている。"},
 {q:"根の細胞分裂を観察する際、うすい塩酸に根の先端をひたすのはなぜか。",choices:["細胞どうしを離れやすくして観察しやすくするため","細胞を大きくするため","染色体を作り出すため","細胞分裂を始めさせるため"],a:0,exp:"塩酸処理によって細胞どうしを結びつけている物質がとけ、押しつぶしたときに細胞が重ならず観察しやすくなる。"},
 {q:"丸い種子をつくる純系(AA)としわの種子をつくる純系(aa)を交配してできた子(Aa)に、しわの種子をつくる個体(aa)をかけ合わせると、できる種子の丸としわの比はどうなるか。",choices:["丸:しわ=1:1","丸:しわ=3:1","すべて丸","すべてしわ"],a:0,exp:"Aa×aaでは Aa と aa が1:1でできるため、丸としわが1:1で現れる。"},
 {q:"顕微鏡で低倍率から高倍率に変えたとき、視野の明るさと見える範囲はどうなるか。",choices:["暗くなり、見える範囲は狭くなる","明るくなり、見える範囲は広くなる","暗くなり、見える範囲は広くなる","明るさも範囲も変わらない"],a:0,exp:"倍率を上げると視野に入る光の量が減って暗くなり、観察できる範囲も狭くなる。"},
 {q:"タンパク質が消化酵素によって最終的に分解されてできる物質はどれか。",choices:["アミノ酸","ブドウ糖","脂肪酸","グリセリン"],a:0,exp:"タンパク質はペプシンなどのはたらきで最終的にアミノ酸に分解され、柔毛から吸収される。"},
 {q:"脂肪が消化されて最終的にできる物質の組み合わせはどれか。",choices:["脂肪酸とモノグリセリド","ブドウ糖とアミノ酸","アミノ酸とグリセリン","ブドウ糖のみ"],a:0,exp:"脂肪は胆汁と消化酵素のはたらきで脂肪酸とモノグリセリドに分解される。"},
 {q:"ある生態系で草食動物が一時的に急激に増えた場合、その直後に起こる変化として最も適切なものはどれか。",choices:["植物が減り、肉食動物が増える","植物も肉食動物もともに増える","植物が増え、肉食動物が減る","何も変化しない"],a:0,exp:"食べられる植物は減少し、えさが増えた肉食動物は増加する。その後つり合いはもとに戻っていく。"},
 {q:"双子葉類の茎の断面で、維管束はどのように並んでいるか。",choices:["輪の形に並んでいる","全体に散らばっている","中心に1本だけある","外側の皮の部分だけにある"],a:0,exp:"双子葉類の維管束は輪状に並び、単子葉類では散らばって分布する。"},
 {q:"相同器官の例として最も適切なものはどれか。",choices:["クジラのひれとヒトのうで","チョウのはねと鳥のつばさ","サボテンのとげとバラのとげ","魚のえらとヒトの肺"],a:0,exp:"クジラのひれとヒトのうでは、形やはたらきは違うが骨格の基本的なつくりが同じで、共通の祖先に由来すると考えられる。"},
 {q:"熱いものに手が触れて思わず引っこめる反応で、命令の信号が出される場所はどこか。",choices:["せきずい","大脳","小脳","筋肉"],a:0,exp:"反射では信号が大脳に届く前にせきずいから命令が出るため、反応が速い。"},
 {q:"有性生殖を続けても、その生物の染色体の数が世代ごとに変わらないのはなぜか。",choices:["減数分裂で染色体数が半分になった生殖細胞が受精で合わさるため","受精のたびに染色体が半分ずつ捨てられるため","体細胞分裂で染色体数が半分になるため","染色体は増減しない性質をもつため"],a:0,exp:"減数分裂で半分になった生殖細胞どうしが受精することで、もとの染色体数に戻る。"},
 {q:"丸い種子の遺伝子型がAaの個体を自家受粉させた。できた丸い種子のうち、純系(AA)である割合はどれか。",choices:["3分の1","2分の1","4分の1","4分の3"],a:0,exp:"子はAA:Aa:aa=1:2:1。丸い種子はAAとAaの3個体分なので、そのうちAAは3分の1になる。"}
],
earth:[
 {q:"P波の速さが8km/s、S波の速さが4km/sのとき、震源から80km離れた地点の初期微動継続時間は何秒か。",choices:["10秒","20秒","5秒","30秒"],a:0,exp:"P波は80÷8=10秒、S波は80÷4=20秒で到達するため、その差は10秒。"},
 {q:"P波の速さが8km/sの地震で、震源から40km離れた地点にP波が10時0分5秒に到達した。地震が発生した時刻はいつか。",choices:["10時0分0秒","10時0分5秒","10時0分10秒","9時59分55秒"],a:0,exp:"P波の到達に40÷8=5秒かかるため、発生時刻は5秒前の10時0分0秒。"},
 {q:"気温20℃(飽和水蒸気量17.3g/m^3)の空気1m^3に、水蒸気が8.65g含まれている。この空気の湿度は何%か。",choices:["50%","20%","87%","17%"],a:0,exp:"湿度=8.65÷17.3×100=50%。"},
 {q:"気温20℃(飽和水蒸気量17.3g/m^3)の空気の露点が10℃(飽和水蒸気量9.4g/m^3)であるとき、湿度はおよそ何%か。",choices:["約54%","約94%","約34%","約184%"],a:0,exp:"露点での飽和水蒸気量が実際の水蒸気量なので、9.4÷17.3×100≒54%。"},
 {q:"はなれた地点の地層を比べるとき、凝灰岩の層が目印(かぎ層)として役立つのはなぜか。",choices:["火山灰は広い範囲に短期間で降り積もるため","凝灰岩はどの時代にも同じようにできるため","凝灰岩はかたく侵食されにくいため","凝灰岩には必ず化石が含まれるため"],a:0,exp:"火山の噴火による火山灰は広範囲にほぼ同時に堆積するため、離れた地層を対比する目印になる。"},
 {q:"北緯35度の地点における夏至の日の太陽の南中高度はおよそ何度か(地軸の傾きを23.4度とする)。",choices:["約78度","約55度","約32度","約90度"],a:0,exp:"夏至の南中高度=90-緯度+23.4=90-35+23.4=78.4度。"},
 {q:"ある星が午後8時に南中した。同じ星が午後6時に南中して見えるのはおよそ何か月後か。",choices:["1か月後","2か月後","4か月後","6か月後"],a:0,exp:"年周運動により同じ星の南中時刻は1か月に約2時間ずつ早くなるため、2時間早い午後6時に南中するのは約1か月後。"},
 {q:"金星が真夜中に観察できないのはなぜか。",choices:["金星は地球より内側を公転しているため","金星が自ら光を出さないため","金星の公転周期が地球より長いため","金星が地球から遠すぎるため"],a:0,exp:"内惑星である金星は太陽の近くの方向にしか見えないため、夕方の西の空か明け方の東の空でしか観察できない。"},
 {q:"日没直後、西の空に見える細い月はどれか。",choices:["三日月","満月","下弦の月","新月"],a:0,exp:"太陽に近い位置にある月は夕方の西の空に細く見え、これを三日月という。"},
 {q:"寒冷前線が通過した直後の天気の変化として正しいものはどれか。",choices:["気温が下がり、風向が南寄りから北寄りに変わる","気温が上がり、風向が北寄りから南寄りに変わる","気温も風向も変化しない","気温が上がり、長時間おだやかな雨が降り続く"],a:0,exp:"寒冷前線の通過後は寒気に覆われるため気温が下がり、風向も北寄りに変化する。"},
 {q:"寒冷前線付近で発達し、激しいにわか雨や雷をもたらす雲はどれか。",choices:["積乱雲","乱層雲","巻雲","高積雲"],a:0,exp:"寒気が暖気を急激に押し上げるため、垂直に発達した積乱雲ができる。"},
 {q:"火山岩である玄武岩と、化学的な成分がほぼ同じ深成岩はどれか。",choices:["はんれい岩","花こう岩","流紋岩","安山岩"],a:0,exp:"玄武岩と はんれい岩は成分がほぼ同じで、冷え方の違いによってつくりが異なる。"},
 {q:"日本の冬に特徴的な気圧配置とその影響の組み合わせとして正しいものはどれか。",choices:["西高東低。北西の季節風が吹き、日本海側に雪をもたらす","南高北低。南東の季節風が吹き、太平洋側に雪をもたらす","西高東低。南東の季節風が吹き、太平洋側が乾燥する","南高北低。北西の季節風が吹き、日本海側が乾燥する"],a:0,exp:"冬はシベリア高気圧が発達して西高東低となり、北西の季節風が日本海で水蒸気を含んで日本海側に雪を降らせる。"},
 {q:"北の空の星を観察すると、星は北極星を中心にどのように動いて見えるか。",choices:["1時間に約15度、反時計回りに動く","1時間に約15度、時計回りに動く","1時間に約30度、反時計回りに動く","動いて見えない"],a:0,exp:"地球の自転により、北の空の星は北極星を中心に1時間に約15度ずつ反時計回りに回って見える。"},
 {q:"堆積岩の地層で、下から順に「れき岩→砂岩→泥岩」と重なっている場合、堆積した環境の変化として正しいものはどれか。",choices:["だんだん水深が深くなった","だんだん水深が浅くなった","水深は変化しなかった","陸地が隆起し続けた"],a:0,exp:"粒の大きいものほど岸に近い浅い場所に堆積するため、れき→砂→泥の順は水深が深くなったことを示す。"}
],
boss:[
 {q:"電熱線に6Vの電圧を加え1.5Aの電流を5分間流して水100gを加熱した。発生した熱がすべて水に伝わり、水1gを1℃上げるのに4.2J必要だとすると、水の上昇温度はおよそ何℃か。",choices:["約6.4℃","約27℃","約2.7℃","約64℃"],a:0,exp:"発熱量=6×1.5×300=2700J。水100gを1℃上げるには420J必要なので、2700÷420≒6.4℃。"},
 {q:"銅と酸素が質量比4:1で結びつくとき、酸化銅8.0gを炭素で完全に還元して得られる銅は何gか。",choices:["6.4g","2.0g","8.0g","1.6g"],a:0,exp:"酸化銅は銅:酸素=4:1なので5等分すると銅は4/5。8.0×4/5=6.4g。"},
 {q:"硝酸カリウムの溶解度が60℃で110g、20℃で32g(水100gあたり)であるとき、水50gを使った60℃の飽和水溶液を20℃まで冷やすと結晶は何g出てくるか。",choices:["39g","78g","55g","16g"],a:0,exp:"水50gなら溶解度も半分になる。(110-32)÷2=39g。"},
 {q:"初期微動継続時間が震源からの距離に比例し、1秒あたり8kmに相当するとき、初期微動継続時間が8秒だった地点の震源からの距離は何kmか。",choices:["64km","8km","1km","640km"],a:0,exp:"8km/秒 × 8秒 = 64km。"},
 {q:"気温25℃(飽和水蒸気量23.1g/m^3)、湿度60%の空気1m^3に含まれる水蒸気量はおよそ何gか。",choices:["約13.9g","約38.5g","約9.2g","約23.1g"],a:0,exp:"23.1×0.60≒13.9g。"},

/* ============================================================
   問題の自動生成
   数値問題は答えを計算で導き、誤答も「起こりがちな誤り」から作る。
   用語問題は同種の語句表から誤答を引くため、正解が常に一意に定まる。
   ============================================================ */
function qrng(seed){let x=(seed>>>0)||1;return function(){x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296;};}
function iR(r,lo,hi,step){step=step||1;return lo+Math.floor(r()*Math.floor((hi-lo)/step+1))*step;}
function pk(r,a){return a[Math.floor(r()*a.length)];}
function nf(v){const n=Math.round(v*1000)/1000;return String(n);}
/* 数値問題:正解と、誤りやすい値から誤答を3つ作る */
function numQ(q,val,unit,cands,exp){
  const f=v=>nf(v)+unit, ans=f(val), used=new Set([ans]), w=[];
  for(let i=0;i<cands.length&&w.length<3;i++){
    const c=cands[i];
    if(!isFinite(c)||c<=0) continue;
    const s=f(c); if(used.has(s)) continue;
    used.add(s); w.push(s);
  }
  let k=2;
  while(w.length<3&&k<24){const s=f(val*k);if(!used.has(s)){used.add(s);w.push(s);}k++;}
  while(w.length<3){const s=f(val+w.length*0.5+0.5);if(!used.has(s)){used.add(s);w.push(s);}else break;}
  if(w.length<3) return null;
  return {q:q,choices:[ans].concat(w),a:0,exp:exp,kind:"calc"};
}
/* 用語問題:同じ表の別項目を誤答にする */
function factQ(r,q,ans,pool,exp){
  const used=new Set([ans]), w=[], s=pool.slice();
  for(let i=s.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=s[i];s[i]=s[j];s[j]=t;}
  for(let i=0;i<s.length&&w.length<3;i++){ if(!used.has(s[i])){used.add(s[i]);w.push(s[i]);} }
  if(w.length<3) return null;
  return {q:q,choices:[ans].concat(w),a:0,exp:exp,kind:"term"};
}

/* ---- 目標数まで生成し、重複は捨てる ---- */
function buildPool(tmpls,target,seed,seenTexts){
  const r=qrng(seed), out=[], seen=new Set(seenTexts||[]);
  let guard=0;
  while(out.length<target&&guard++<target*120){
    const t=tmpls[Math.floor(r()*tmpls.length)];
    let q=null;
    try{ q=t(r); }catch(e){ q=null; }
    if(!q||!q.q||seen.has(q.q)) continue;
    if(q.choices.length!==4) continue;
    if(new Set(q.choices).size!==4) continue;
    seen.add(q.q); out.push(q);
  }
  return out;
}
(function expandPools(){
  const subj=["physics","chemistry","biology","earth","boss"];
  /* 層をまたいで同じ問題が出ないよう、全分野で共通の既出集合を持つ */
  const seen=new Set();
  subj.forEach(function(k){
    QUESTIONS[k].forEach(q=>seen.add(q.q));
    HARD[k].forEach(q=>seen.add(q.q));
  });
  subj.forEach(function(k,i){
    const add=buildPool(GB[k],200-QUESTIONS[k].length,7001+i*131,seen);
    add.forEach(q=>seen.add(q.q));
    QUESTIONS[k]=QUESTIONS[k].concat(add);
    const addH=buildPool(GH[k],100-HARD[k].length,9001+i*137,seen);
    addH.forEach(q=>seen.add(q.q));
    HARD[k]=HARD[k].concat(addH);
  });
  /* 手書きの問題にも種別を付ける。選択肢がすべて数値なら計算問題とみなす */
  const looksNumeric=q=>q.choices.every(ch=>/^-?[\d.]+\s*[^\d\s]{0,8}$/.test(String(ch).trim()));
  subj.forEach(function(k){
    [QUESTIONS[k],HARD[k]].forEach(function(pool){
      pool.forEach(function(q){ if(!q.kind) q.kind=looksNumeric(q)?"calc":"term"; });
    });
  });
})();

function mix(hex,target,amt){
  const p=s=>parseInt(s,16);
  const h=hex.replace('#',''),t=target.replace('#','');
  const f=(a,b)=>Math.round(p(a)+(p(b)-p(a))*amt).toString(16).padStart(2,'0');
  return '#'+f(h.substr(0,2),t.substr(0,2))+f(h.substr(2,2),t.substr(2,2))+f(h.substr(4,2),t.substr(4,2));
}

/* ============================================================
   描画エンジン ― 符号付き距離場からの生成描画
   手描きのパスを廃し、骨格プリミティブの距離場から
   輪郭・陰影帯・リムライトをすべて計算で導出する。
   ============================================================ */

/* --- 値ノイズ(決定的) --- */
function makeNoise(seed){
  const hash=(x,y)=>{
    let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(seed,1442695041);
    n=Math.imul(n^(n>>>13),1274126177);
    return ((n^(n>>>16))>>>0)/4294967295;
  };
  return (x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
/* --- プリミティブの距離関数 --- */
function sdCircle(px,py,cx,cy,r){return Math.hypot(px-cx,py-cy)-r;}
function sdCapsule(px,py,ax,ay,bx,by,r){
  const pax=px-ax,pay=py-ay,bax=bx-ax,bay=by-ay;
  const dd=bax*bax+bay*bay;
  let h=dd>0?(pax*bax+pay*bay)/dd:0; h=h<0?0:(h>1?1:h);
  return Math.hypot(pax-bax*h,pay-bay*h)-r;
}
/* 滑らかな和集合(kが小さいほど角が立つ) */
function smin(a,b,k){
  const h=Math.max(0,Math.min(1,0.5+0.5*(b-a)/k));
  return b*(1-h)+a*h-k*h*(1-h);
}
/* --- 骨格から距離場を組み立てる --- */
function buildField(def,noise){
  const k=def.k===undefined?9:def.k;
  const na=def.na===undefined?0:def.na, nf=def.nf===undefined?0.05:def.nf;
  return (x,y)=>{
    let d=1e9;
    for(let i=0;i<def.s.length;i++){
      const s=def.s[i];
      const dd=(s.length===3)?sdCircle(x,y,s[0],s[1],s[2])
        :(s.length===4)?Math.abs(Math.hypot(x-s[0],y-s[1])-s[2])-s[3]
        :sdCapsule(x,y,s[0],s[1],s[2],s[3],s[4]);
      d=(i===0)?dd:smin(d,dd,k);
    }
    if(na) d+=(noise(x*nf,y*nf)-0.5)*na;
    return d;
  };
}

   画素単位のレンダラ
   距離場から法線を復元し、拡散・鏡面・リム・環境遮蔽・透過光を
   画素ごとに解いて一度だけ焼き込む。

   ============================================================ */
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function nrm3(x,y,z){const m=Math.hypot(x,y,z)||1;return [x/m,y/m,z/m];}
function makeFbm(noise){
  return (x,y,oct)=>{
    let a=0,amp=0.5,f=1;
    for(let i=0;i<(oct||3);i++){a+=noise(x*f,y*f)*amp;amp*=0.5;f*=2.03;}

}

  return [Math.min(s[0],s[2])-s[4],Math.min(s[1],s[3])-s[4],

function fieldGrid(prims,k,S,sc,noise,na,nf){
  const out=new Float32Array(S*S).fill(1e9);
  const bb=prims.map(primBBox), marg=k*2.4+22, TS=24, nt=Math.ceil(S/TS);
  for(let tj=0;tj<nt;tj++)for(let ti=0;ti<nt;ti++){
    const x0=ti*TS*sc, y0=tj*TS*sc, x1=(ti+1)*TS*sc, y1=(tj+1)*TS*sc;
    const list=[];
    for(let p=0;p<prims.length;p++){
      const b=bb[p];
      if(b[2]+marg<x0||b[0]-marg>x1||b[3]+marg<y0||b[1]-marg>y1) continue;
      list.push(prims[p]);
    }
    if(!list.length) continue;
    const jmax=Math.min(S,(tj+1)*TS), imax=Math.min(S,(ti+1)*TS);
    for(let j=tj*TS;j<jmax;j++){
      for(let i=ti*TS;i<imax;i++){
        const x=(i+0.5)*sc, y=(j+0.5)*sc;
        let d=1e9;
        for(let q=0;q<list.length;q++){
          const s=list[q];
          const dd=(s.length===3)?sdCircle(x,y,s[0],s[1],s[2])
            :(s.length===4)?Math.abs(Math.hypot(x-s[0],y-s[1])-s[2])-s[3]
            :sdCapsule(x,y,s[0],s[1],s[2],s[3],s[4]);
          d=(q===0)?dd:smin(d,dd,k);
        }
        if(na) d+=(noise(x*nf,y*nf)-0.5)*na;
        out[j*S+i]=d;
      }
    }
  }
  return out;
}

/* 岩が割れるように、体をセル状の塊へ分割して欠け落とす */
function cellHash(i,j,seed){
  let n=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(seed,1442695041);
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967295;
}
function cellAt(x,y,cs,seed,out){
  const gi=Math.floor(x/cs), gj=Math.floor(y/cs);
  let b1=1e9,b2=1e9,bi=0,bj=0;
  for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
    const ci=gi+di, cj=gj+dj;
    const fx=(ci+0.15+0.7*cellHash(ci,cj,seed))*cs;
    const fy=(cj+0.15+0.7*cellHash(ci,cj,seed+77))*cs;
    const dx=x-fx, dy=y-fy, d=dx*dx+dy*dy;
    if(d<b1){b2=b1;b1=d;bi=ci;bj=cj;} else if(d<b2) b2=d;
  }
  out[0]=bi; out[1]=bj; out[2]=Math.sqrt(b2)-Math.sqrt(b1);
}

function renderPixels(def,c,S,noise,fbm){
  const sc=200/S, N2=S*S;
  const det=def.det===undefined?1.6:def.det, fur=def.fur||0;

  /* 第1段:タイル分割した距離場を求め、描画対象を絞り込む */
  const fld=fieldGrid(def.s,def.k===undefined?9:def.k,S,sc,noise,def.na||0,def.nf||0.05);
  const hasG=!!(def.gold&&def.gold.length);
  const gld=hasG?fieldGrid(def.gold,def.gk===undefined?3:def.gk,S,sc,noise,0,0):null;
  const FG=hasG;
  /* 損壊:表層のセルから順に塊が欠け落ち、残った塊の間に割れ目が走る */
  const chip=def.chip;
  const seam=chip?new Float32Array(N2):null;
  if(chip){
    const cs=chip.cell||19, cseed=chip.seed|0, frac=chip.frac||0;
    const th=def.thick||30, tmp=[0,0,0];
    for(let j=0;j<S;j++)for(let i=0;i<S;i++){
      const o=j*S+i; if(fld[o]>26) continue;
      const x=(i+0.5)*sc, y=(j+0.5)*sc;
      cellAt(x,y,cs,cseed,tmp);
      const depth=Math.max(0,Math.min(1,-fld[o]/th));
      /* 表層ほど欠けやすい:内側から穴が開くのを避ける */
      const p=frac*(0.28+0.72*(1-depth));
      if(cellHash(tmp[0],tmp[1],cseed+911)<p) fld[o]+=90;
      else seam[o]=tmp[2];
    }
  }
  const near=new Uint8Array(N2);
  for(let o=0;o<N2;o++){
    if(fld[o]<16||(hasG&&gld[o]<16)) near[o]=1;
  }
  /* 第2段:表面近傍のみ、三段階の周波数で凹凸と汚れを作る */
  const bmpA=new Float32Array(N2), bmpB=new Float32Array(N2);
  const pat=new Float32Array(N2), crk=new Float32Array(N2), met=new Float32Array(N2);
  for(let j=0;j<S;j++){
    for(let i=0;i<S;i++){
      const o=j*S+i; if(!near[o]) continue;
      const x=(i+0.5)*sc, y=(j+0.5)*sc;
      const g1=fbm(x*0.14,y*0.14,3);
      fld[o]+=(g1-0.5)*det;
      if(fur) fld[o]-=Math.max(0,fbm(x*0.42,y*0.42,2)-0.42)*fur;
      bmpA[o]=fbm(x*0.42,y*0.42,4);   /* 中周波:面の起伏 */
      bmpB[o]=fbm(x*1.7,y*1.7,2);      /* 高周波:肌理 */
      pat[o]=g1;
      crk[o]=fbm(x*0.055,y*0.055,3);
      if(FG){
        const gd=gld[o];
        met[o]=Math.max(0,Math.min(1,(fld[o]-gd)/2.2+0.5));
        fld[o]=Math.min(fld[o],gd);
      }
    }
  }

  /* 線形空間の配色 */
  const base=toLin(mix(c,'#312e3d',0.66));
  const amb =toLin(mix(c,'#201d30',0.62));
  const boneC=toLin(mix(c,'#f2e7cb',0.82));
  const goldC=toLin('#f7d78a');
  const sssC =toLin(mix(c,'#ffb45c',0.55));
  const metalC=toLin(def.metal||'#f7d78a');
  const grime=toLin(mix(c,'#161320',0.72));

  const KEY=nrm3(-0.56,-0.72,0.41);
  const FILL=nrm3(0.62,0.24,0.52);
  const RIM=nrm3(0.46,-0.36,-0.62);
  const H=nrm3(KEY[0],KEY[1],KEY[2]+1);
  const thick=def.thick||30, shin=def.shin||26;
  const specAmt=def.spec===undefined?0.5:def.spec;
  const sssAmt=(def.sss||0)*0.45, crackAmt=def.crack||0;
  const bs=def.bump===undefined?0.5:def.bump;
  const lights=(def.eyes||[]).map(e=>[e[0],e[1],e[2]*2.7,.62]).concat(def.lights||[]);
  const lcol=lights.map(L=>toLin(L[4]||'#f7d78a'));
  const allMetal=def.allMetal?1:0;
  const voids=def.voids||[];
  const chipGlow=def.chipGlow||0;
  /* 足元の霧から立ちのぼる残り火の照り返し(全個体共通の下方光) */
  const UNDER=nrm3(0.06,0.92,0.3);
  const underAmt=(def.under===undefined?0.26:def.under)*0.3;
  const emberL=toLin('#ff9c3c');
  /* 影を落とす向き(光源へ向かう方向) */
  const shx=KEY[0]/Math.hypot(KEY[0],KEY[1]), shy=KEY[1]/Math.hypot(KEY[0],KEY[1]);
  const shz=KEY[2]/Math.hypot(KEY[0],KEY[1]);

  const px=new Uint8ClampedArray(N2*4);
  const cl=(v,lo,hi)=>v<lo?lo:(v>hi?hi:v);
  const at=(i,j)=>fld[cl(j,0,S-1)*S+cl(i,0,S-1)];
  const ba=(i,j)=>bmpA[cl(j,0,S-1)*S+cl(i,0,S-1)];
  const bb=(i,j)=>bmpB[cl(j,0,S-1)*S+cl(i,0,S-1)];
  /* 格子の双一次補間(部分標本と影の追跡に使う) */
  const samp=(wx,wy)=>{
    const fx=wx/sc-0.5, fy=wy/sc-0.5;
    const i0=Math.floor(fx), j0=Math.floor(fy);
    const tx=fx-i0, ty=fy-j0;
    const a=at(i0,j0),b=at(i0+1,j0),d0=at(i0,j0+1),e=at(i0+1,j0+1);
    return (a*(1-tx)+b*tx)*(1-ty)+(d0*(1-tx)+e*tx)*ty;
  };

  for(let j=0;j<S;j++){
    for(let i=0;i<S;i++){
      const o=j*S+i, o4=o*4;
      if(!near[o]){px[o4+3]=0;continue;}
      const d=fld[o];
      let cov=cl(0.5-d/(sc*1.5),0,1);
      if(cov<=0.002){px[o4+3]=0;continue;}
      const x=(i+0.5)*sc, y=(j+0.5)*sc;

      /* 輪郭付近だけ2x2の部分標本で被覆率を精密化 */
      if(d>-sc*1.8&&d<sc*1.8){
        const q=sc/3; let acc=0;
        for(let sy=-1;sy<=1;sy++) for(let sx=-1;sx<=1;sx++)
          acc+=cl(0.5-samp(x+sx*q,y+sy*q)/(sc*0.62),0,1);
        cov=acc/9;
        if(cov<=0.002){px[o4+3]=0;continue;}
      }

      const h=cl(-d/thick,0,1), t=1-h;
      const nz=Math.cos(t*Math.PI*0.5), nxy=Math.sin(t*Math.PI*0.5);
      let gx=at(i+1,j)-at(i-1,j), gy=at(i,j+1)-at(i,j-1);
      const gm=Math.hypot(gx,gy)||1; gx/=gm; gy/=gm;
      /* 二周波の凹凸を重ねる */
      const bxA=(ba(i+1,j)-ba(i-1,j)), byA=(ba(i,j+1)-ba(i,j-1));
      const bxB=(bb(i+1,j)-bb(i-1,j)), byB=(bb(i,j+1)-bb(i,j-1));
      let nvx=gx*nxy+(bxA*5.5+bxB*2.6)*bs, nvy=gy*nxy+(byA*5.5+byB*2.6)*bs, nvz=nz;
      const nm=Math.sqrt(nvx*nvx+nvy*nvy+nvz*nvz)||1;
      nvx/=nm; nvy/=nm; nvz/=nm;

      /* 曲率:窪みには汚れが溜まり、稜には摩耗した光沢が出る */
      const lap=4*d-(at(i+1,j)+at(i-1,j)+at(i,j+1)+at(i,j-1));
      const cav=cl(lap*0.55,-1,1);
      const ao=(0.3+0.7*Math.sqrt(h))*(1-0.34*Math.max(0,cav));
      const wear=Math.max(0,-cav);

      /* 自己投影:光へ向かって高さ場を辿る(向背面では省略) */
      let sh=1;
      const dif0=Math.max(0,nvx*KEY[0]+nvy*KEY[1]+nvz*KEY[2]);
      if(dif0>0.03){
        const h0=Math.max(0,-d);
        for(let s=1;s<=10;s++){
          const tt=s*2.1, si=(x+shx*tt)/sc-0.5, sj=(y+shy*tt)/sc-0.5;
          const hh=Math.max(0,-at(si+0.5|0,sj+0.5|0));
          const ray=h0+shz*tt;
          if(hh>ray){ sh=Math.min(sh,cl((ray-hh)/6+0.72,0.3,1)); }
        }
      }
      const dif=Math.pow(dif0,1.55)*sh;
      const und=Math.max(0,nvx*UNDER[0]+nvy*UNDER[1]+nvz*UNDER[2]);
      const fil=Math.max(0,nvx*FILL[0]+nvy*FILL[1]+nvz*FILL[2]);
      const fres=Math.pow(1-cl(nvz,0,1),4.5);
      const rim=Math.pow(Math.max(0,nvx*RIM[0]+nvy*RIM[1]+nvz*RIM[2]),2.6)*(0.3+0.7*fres);
      const nh=Math.max(0,nvx*H[0]+nvy*H[1]+nvz*H[2]);
      const spe=(Math.pow(nh,shin)+Math.pow(nh,shin*4.5)*0.7)*specAmt*(0.55+0.45*fres)*sh;

      const ptn=0.72+0.56*pat[o];
      const sss=sssAmt*Math.exp(-h*3.4);
      let crack=0;
      if(crackAmt){
        const cv=Math.abs(crk[o]-0.5);
        crack=crackAmt*Math.max(0,1-cv/0.03)*Math.min(1,h*3.2);
      }
      let socket=1, lr=0,lg=0,lb=0;
      for(let q=0;q<voids.length;q++){
        const V=voids[q], vx=V[0]-x, vy=V[1]-y;
        const v2=vx*vx+vy*vy;
        if(v2>V[2]*V[2]) continue;
        socket*=1-0.92*Math.pow(1-Math.sqrt(v2)/V[2],1.4);
      }
      for(let q=0;q<lights.length;q++){
        const L=lights[q], dx=L[0]-x, dy=L[1]-y;
        const d2=dx*dx+dy*dy, rr=L[2];
        if(d2>rr*rr*9) continue;
        const dd=Math.sqrt(d2)||0.001;
        const k1=1/(dd*1.0846);
        const nd=Math.max(0,nvx*dx*k1+nvy*dy*k1+nvz*0.3872);
        const w=L[3]*(Math.exp(-dd/(rr*0.9))*nd*0.85
               +Math.pow(Math.max(0,1-dd/(rr*0.46)),2)*2.3);
        const lc=lcol[q];
        lr+=lc[0]*w; lg+=lc[1]*w; lb+=lc[2]*w;
        socket*=1-0.62*Math.max(0,1-dd/(rr*1.25));
      }
      /* 割れ目:溝は光を失い、奥から熱がにじむ */
      let fr=0;
      if(seam){ const sm=seam[o]; if(sm>0&&sm<2.8) fr=1-sm/2.8; }
      if(fr){ socket*=1-0.62*fr; }
      const m=allMetal?1:met[o];
      const spM=spe*(1+m*1.8+wear*0.9), rimM=rim*(1+m*0.8+wear*0.5);
      const dth=BAYER[(i&3)+((j&3)<<2)];
      for(let k=0;k<3;k++){
        const alb=(base[k]*ptn*(1-m)+metalC[k]*0.92*m)*(1-0.35*Math.max(0,cav))
                 +grime[k]*0.35*Math.max(0,cav);
        const v= alb*(0.012+dif*0.99)*ao*socket
               + amb[k]*(0.045+fil*0.34)*ao*socket
               + boneC[k]*rimM*0.72*(0.3+0.7*socket)
               + spM*(0.25+0.75*socket)
               + sssC[k]*sss*socket
               + emberL[k]*und*underAmt*(0.35+0.65*h)*socket
               + goldC[k]*crack + emberL[k]*fr*fr*0.5*chipGlow + (k===0?lr:k===1?lg:lb);
        px[o4+k]=L2S[cl(Math.round(v*4096),0,4096)]+dth*255;
      }
      px[o4+3]=cov*255;
    }
  }
  return px;
}
