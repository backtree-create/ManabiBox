<html lang="ja">
<head>

<style>
:root{
  --amber:#FFC53D; --amber-dim:#8A6A22;
  --board:#171008; --board-line:#3A2A12;
  --white:#F5F1E8; --red:#E5533C; --good:#5AD38A; --torch:#FF8A3D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050302;overflow:hidden;
  font-family:'Zen Kaku Gothic New',sans-serif;color:var(--white);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none}
#wrap{height:100%;height:100svh;height:100dvh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%, #1A1008 0%, #050302 60%)}
#stage{position:relative;width:min(100vw,177.7vh,177.7svh);aspect-ratio:16/9;max-height:100svh;
  background:#050302;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8);display:flex}

/* カメラは重ねて出し、全画面↔左下小窓を行き来する（1人用・2人用とも） */
#stage.camov #gamePane,#stage.nocam #gamePane{width:100%;height:100%}
#stage.nocam #camPane{display:none}
#stage.camov #camPane{position:absolute;z-index:8;background:#0b0705;
  border:3px solid var(--board-line);border-right:3px solid var(--board-line);
  transition:left .35s ease, bottom .35s ease, width .35s ease, height .35s ease, border-radius .35s ease}
#stage.camov #cam{object-fit:contain}
#stage.camov.camfull #camPane{left:0;bottom:0;width:100%;height:100%;border-radius:0;border-width:0}
#stage.camov.cammini #camPane{left:1.5%;bottom:2.5%;width:27%;height:38%;border-radius:6px;
  box-shadow:0 6px 22px rgba(0,0,0,.6)}
#stage.camfull #ovl{align-items:flex-end;pointer-events:none}
#stage.camfull .panel{pointer-events:auto}
.panel.slim{background:rgba(10,7,3,.9);border:3px solid #4a351e;border-radius:6px;
  width:auto;max-width:94%;padding:.5em 1.6em;margin-bottom:2.5%;
  display:flex;align-items:center;justify-content:center;gap:1.2em;text-align:left}
.bigPct{font-family:'DotGothic16',monospace;color:var(--amber);line-height:1;
  font-size:clamp(38px,10vmin,96px);text-shadow:3px 3px 0 #140c04}
.bigMsg{font-family:'DotGothic16',monospace;line-height:1.35;
  font-size:clamp(18px,4vmin,40px);text-shadow:2px 2px 0 #140c04}
.bigMsg b{color:var(--amber)}
#camHint{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:9;
  background:rgba(10,7,3,.9);border:3px solid var(--amber);border-radius:4px;
  padding:.5em 1.2em;display:none;text-align:center;max-width:86%}
#camHint .h1{font-family:'DotGothic16',monospace;color:var(--amber);
  font-size:clamp(20px,4.6vmin,44px);text-shadow:3px 3px 0 #140c04}
#camHint .h2{font-size:clamp(13px,2.6vmin,22px);color:#E8DFC8;margin-top:.25em;line-height:1.5;font-weight:700}
#stage.camfull #vsHud{display:none!important}
#camToggle{position:absolute;right:1.5%;bottom:2.5%;z-index:9;display:none;
  font-family:'DotGothic16',monospace;font-size:clamp(10px,1.9vmin,14px);
  background:rgba(10,7,3,.88);color:var(--amber);border:3px solid #4a351e;
  border-radius:4px;padding:.4em .9em;cursor:pointer}
#camToggle:active{transform:translateY(2px)}
#stage.camov #camToggle{display:block}
#vsHud{position:absolute;top:1.5%;left:1.5%;right:1.5%;z-index:7;display:none;
  justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.vsBoard{background:rgba(10,7,3,.9);border:3px solid #4a351e;border-radius:4px;
  padding:.25em .9em;text-align:center;min-width:26%}
.vsBoard .who{font-family:'DotGothic16',monospace;font-size:clamp(11px,2.2vmin,18px);letter-spacing:.12em}
.vsBoard .sc{font-family:'DotGothic16',monospace;font-size:clamp(20px,4.6vmin,44px);line-height:1.1;
  text-shadow:2px 2px 0 #140c04}
#vsP1box{border-color:#8a6a22}#vsP1box .who,#vsP1box .sc{color:#FFC53D}
#vsP2box{border-color:#2f7a4a}#vsP2box .who,#vsP2box .sc{color:#5AD38A}
#camPane{position:relative;width:30%;height:100%;background:#080503;border-right:2px solid var(--board-line);overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(.9) contrast(1.05)}
#camCv{position:absolute;inset:0;width:100%;height:100%}
#camStatus{position:absolute;left:0;right:0;bottom:0;padding:2% 4%;
  background:rgba(8,5,3,.8);font-weight:700;font-size:clamp(10px,1.7vmin,14px);line-height:1.5;text-align:center;z-index:3}
#camStatus.warn{color:var(--red)}
#repFlash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:'DotGothic16',monospace;font-size:clamp(26px,6.5vmin,58px);color:var(--good);
  text-shadow:3px 3px 0 #06140c;opacity:0;pointer-events:none;z-index:3}
#repFlash.show{animation:pop .5s}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
#stage.camov #depthMeter{right:6%;top:8%;bottom:16%;width:12%;min-width:10px}
#depthMeter{position:absolute;right:4%;top:12%;bottom:22%;width:5%;min-width:14px;
  background:rgba(0,0,0,.45);border:1px solid var(--board-line);border-radius:6px;overflow:hidden;display:none;z-index:3}
#depthFill{position:absolute;bottom:0;left:0;right:0;height:0%;background:var(--amber)}
#depthGoal{position:absolute;left:0;right:0;height:2px;background:var(--good);bottom:81%}

#gamePane{position:relative;flex:1;height:100%;background:#000}
#glv,#ov2{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov2{pointer-events:none}

#task{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
  background:rgba(10,7,3,.88);border:3px solid #4a351e;border-radius:4px;
  padding:1% 2.6%;text-align:center;min-width:62%;z-index:5;display:none;
  box-shadow:0 0 0 2px #0a0703, inset 0 0 24px rgba(255,138,61,.06)}
#taskLbl{font-family:'DotGothic16',monospace;font-weight:400;font-size:clamp(18px,4.4vmin,40px);
  color:var(--white);text-shadow:2px 2px 0 #140c04;line-height:1.3}
#taskLbl b{color:var(--amber);font-weight:400}
#taskLbl .dodge{color:var(--good)}

#task.alert{border-color:var(--red);animation:alertPulse .5s infinite alternate}
@keyframes alertPulse{from{box-shadow:0 0 0 2px #0a0703}to{box-shadow:0 0 0 2px #0a0703,0 0 22px rgba(229,83,60,.7)}}

#topHud{position:absolute;top:1.5%;right:1.5%;z-index:5;display:none;gap:8px;align-items:stretch}

.miniBoard .val{font-family:'DotGothic16',monospace;color:var(--amber);font-size:clamp(18px,3.8vmin,34px);line-height:1.1;text-shadow:2px 2px 0 #140c04}

#hearts .lost path{fill:#3A2A2A}

#streak{position:absolute;top:1.5%;left:4%;z-index:5;display:none;
  font-family:'DotGothic16',monospace;color:var(--torch);font-size:clamp(18px,4vmin,36px);
  text-shadow:2px 2px 0 #140c04}

#practiceBar{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);z-index:6;display:none;gap:8px;

.pBtn:active{background:rgba(255,197,61,.3);border-color:var(--amber)}

.panel{background:linear-gradient(180deg,rgba(12,8,4,.97),rgba(5,3,2,.97));
  border:3px solid #4a351e;border-radius:6px;padding:3% 4.5%;

  font-size:clamp(11px,1.8vmin,15px);margin-bottom:.6em}
h1{font-family:'DotGothic16',monospace;font-weight:400;font-size:clamp(24px,5.6vmin,50px);line-height:1.25;

h1 .en{display:block;font-family:'Anton',sans-serif;color:var(--amber);

h2{font-family:'DotGothic16',monospace;font-weight:400;font-size:clamp(19px,4.4vmin,36px);margin-bottom:.4em;text-shadow:2px 2px 0 #140c04}
p.sub{color:#C9BFA8;font-size:clamp(12px,2.2vmin,16px);line-height:1.8;margin:.6em 0}
.btn{display:inline-block;border:3px solid #A67C1B;cursor:pointer;border-radius:4px;

.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6d5212}

.btn.ghost:active{transform:translateY(2px)}

@media (min-width:700px){.safeties{grid-template-columns:1fr 1fr}.safeties .safety{margin:.6em 0}}

.moveCard .mv{font-family:'DotGothic16',monospace;color:var(--amber);font-size:clamp(12px,2.3vmin,18px)}
.moveCard .fx{font-size:clamp(10px,1.9vmin,14px);color:#C9BFA8;margin-top:.4em;line-height:1.6}
.trivia{font-size:clamp(11px,2vmin,14px);color:#8FB79E;border-top:1px solid #2a1f10;
  margin-top:.8em;padding-top:.7em;line-height:1.7;text-align:left}
.trivia b{color:var(--good)}
table.res{width:100%;border-collapse:collapse;margin:1em 0;font-size:clamp(12px,2.4vmin,18px)}
table.res td{padding:.5em .4em;border-bottom:1px solid #2a1f10;text-align:left;font-weight:700}
table.res td:last-child{text-align:right;font-family:'DotGothic16',monospace;color:var(--amber)}
.rank{font-family:'DotGothic16',monospace;font-size:clamp(52px,14vmin,130px);line-height:1;
  color:var(--amber);text-shadow:4px 4px 0 #140c04, 0 0 30px rgba(255,197,61,.5)}
.rankMsg{font-weight:900;font-size:clamp(13px,2.8vmin,20px);margin-top:.3em}
.stageGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:1.1em 0}
.stBtn{display:flex;flex-direction:column;gap:.25em;align-items:center;cursor:pointer;
  background:rgba(255,197,61,.06);border:3px solid #4a351e;border-radius:4px;

.stBtn:active{background:rgba(255,197,61,.28);border-color:var(--amber)}

.stBtn .st{color:var(--amber);font-size:clamp(10px,1.9vmin,14px);letter-spacing:.1em}
.stBtn .bs{color:#C9BFA8;font-size:clamp(9px,1.7vmin,12px)}
.stBtn .th{color:var(--amber-dim);font-size:clamp(9px,1.7vmin,12px);line-height:1.2}
#calibRing{width:clamp(90px,20vmin,150px);height:clamp(90px,20vmin,150px);margin:1em auto;position:relative}
#calibRing svg{width:100%;height:100%;transform:rotate(-90deg)}
#calibPct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'DotGothic16',monospace;font-size:clamp(22px,5vmin,40px);color:var(--amber)}
#err{color:var(--red);font-weight:700;font-size:clamp(11px,2.1vmin,15px);line-height:1.8;margin-top:.6em}

#homeBtn{position:fixed;left:10px;top:10px;z-index:60;
  font-family:'DotGothic16',monospace;font-size:clamp(11px,2.2vmin,15px);

body:has(#manabi-back) #homeBtn{display:none}

@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

<script type="module">
"use strict";
/* =========================================================
   リアル体つくりダンジョン v4 — レトロ3D（DOOM系）
   Three.js の実3D坑道 × ドット絵スプライトの敵
   動的ライティング：ランタン・たいまつ・フォグ
   ========================================================= */
const $=s=>document.querySelector(s);
let THREE=null;
try{
  THREE=await import('../../lib/three/three.0.160.module.js');
}catch(e){
  document.querySelector('#ovl').innerHTML=
    '<div class="panel"><h2>読み込みエラー</h2><p class="sub">3Dエンジンの読み込みに失敗しました。通信環境を確認して再読み込みしてください。</p></div>';
  throw e;
}

/* ---------------- Audio ---------------- */
let AC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='square',vol=.15,slide=0,when=0){
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),gn=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,when=0){
  const a=ac(),t=a.currentTime+when,n=a.sampleRate*dur|0;
  const b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;
  const gn=a.createGain();gn.gain.setValueAtTime(vol,t);
  s.connect(gn).connect(a.destination);s.start(t);
}
const SFX={
  step(){tone(440,.05,'square',.07)},
  hit(){noise(.12,.3);tone(200,.12,'sawtooth',.15,-80)},
  smash(){noise(.4,.5);tone(90,.4,'sawtooth',.2,-40)},
  jump(){tone(300,.16,'square',.1,260)},
  dodge(){tone(700,.1,'square',.12);tone(1050,.14,'square',.1,0,.08)},
  hurt(){tone(150,.35,'sawtooth',.2,-70);noise(.2,.25)},
  warn(){tone(980,.09,'square',.14);tone(980,.09,'square',.14,0,.14)},
  slash(){noise(.08,.25);tone(520,.1,'sawtooth',.12,300)},
  swing(){noise(.07,.15);tone(340,.1,'sine',.08,180)},
  down(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'square',.13,0,i*.14))},
  chest(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,'square',.12,0,i*.12))},
  go(){tone(880,.2,'sine',.15)},
  count(){tone(440,.15,'sine',.14)},
  kill(){tone(260,.3,'square',.15,-160);noise(.25,.3)},
  boss(){tone(98,.7,'sawtooth',.2);tone(103,.7,'sawtooth',.15);tone(196,.5,'square',.12,0,.25)},
};

/* ---------------- まなびの基板 連携 ---------------- */
const HUB={key:'fitness-dungeon', total:8, store:'manabi-fitness-dungeon'};
function hubLoad(){ try{ return JSON.parse(localStorage.getItem(HUB.store)||'{}'); }catch(e){ return {}; } }
function hubSaveLocal(o){ try{ localStorage.setItem(HUB.store, JSON.stringify(o)); }catch(e){} }
/* ハブ配点換算（古い hub-progress.js 向けフォールバック付き） */
function hubScale(r, o){ return (window.LearnHub && LearnHub.scale) ? LearnHub.scale(r, o) : Math.round(Math.max(0,Math.min(1,r))*10000); }
const RANK_PT={S:1.0,A:0.8,B:0.6,C:0.4};
function rankPt(r){ return RANK_PT[r]||0; }
function hubReport(stage, rank, score){
  const rec=hubLoad();
  const stages=rec.stages||{};
  /* 面ごとに最高ランクを保持する */
  if(rankPt(rank)>=rankPt(stages[stage])) stages[stage]=rank;
  const done=Object.keys(stages).length;
  /* 出来ばえ = Σ(面ごとのランク点 S:1.0 A:0.8 B:0.6 C:0.4) / 8面 */
  let sum=0; for(const k in stages) sum+=rankPt(stages[k]);
  const best=hubScale(Math.min(1, sum/HUB.total));
  hubSaveLocal({done,best,stages,topScore:Math.max(rec.topScore||0,score)});
  if(window.LearnHub && typeof LearnHub.report==='function'){
    try{ LearnHub.report({app:HUB.key, done, total:HUB.total, best, raw:score,
      note:`${stage}面 ランク${rank} 素点 ${score}`}); }catch(e){}
  }
}

function buildStage(n){
  const def=STAGES[n-1];
  const K=(S.np>1?1.7:1);          // 2人なら手数が倍になるぶん、目標値を引き上げる
  const sc=v=>Math.max(1,Math.round(v*K));
  let pos=2;const out=[];
  for(const it of def.items){
    pos+=def.walk;
    if(it.k==='rock')out.push({pos,kind:'rock',hp:sc(it.hp),hpMax:sc(it.hp),
      limit:it.limit*(S.np>1?1.25:1),timer:it.limit*(S.np>1?1.25:1),done:false,dmg:[0,0],
      label:'落石が来る前に<b>スクワット</b>で岩を砕け！'});
    else if(it.k==='gap')out.push({pos,kind:'gap',width:1.7,window:it.win,timer:it.win,armed:false,done:false});
    else if(it.k==='seal')out.push({pos,kind:'seal',need:sc(it.need),cnt:0,done:false,dmg:[0,0]});
    else if(it.k==='bridge')out.push({pos,kind:'bridge',width:2.4,needS:it.sec,held:0,done:false});
    else if(it.k==='spring')out.push({pos,kind:'spring',need:it.need,sec:it.sec,timer:it.sec,
      cnt:[0,0],ok:[false,false],done:false});
    else if(it.k==='dash')out.push({pos,kind:'dash',need:it.need,limit:it.sec,timer:it.sec,cnt:0,done:false});
    else out.push({pos,kind:'battle',type:it.t,name:ENEMY_NAMES[it.t],
      hp:sc(it.hp),hpMax:sc(it.hp),dmg:[0,0],
      atkMin:it.atk[0],atkMax:it.atk[1],tele:it.tele,
      atkT:it.atkT||['jump'],atkKind:'jump',atkDir:1,
      combo:it.combo||1,chainLeft:0,boss:!!it.boss,last:!!it.last,
      state:'idle',st:2,flinch:0,deadT:0,done:false});
  }
  pos+=6;
  out.push({pos,kind:'goal',done:false});
  S.course=out;S.goal=pos;
}

async function initPose(){
  const stat=$('#camStatus');
  /* 先にカメラの許可を取る（iPad Safari はタップ直後に許可ダイアログが出る。拒否なら重いモデル読み込みの前に分かる） */

    : {facingMode:'user',width:{ideal:960},height:{ideal:720},aspectRatio:{ideal:4/3}};
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:want,audio:false}); }
  catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); }
  stat.textContent='AIモデルを読み込み中…（初回は少し時間がかかります）';
  const url=new URL('../../lib/mediapipe',location.href).href;
  const vision=await import(url+'/vision_bundle.mjs');
  const files=await vision.FilesetResolver.forVisionTasks(url+'/wasm');
  /* 姿勢推定モデル：lib/mediapipe/pose_landmarker_lite.task が置いてあればそれを使い、
     無ければ Google のサーバーから取る（校内でCDNが止められている場合はファイルを置く） */
  const REMOTE_MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  let modelPath=REMOTE_MODEL;
  try{
    const r=await fetch(url+'/pose_landmarker_lite.task',{method:'HEAD'});
    if(r.ok) modelPath=url+'/pose_landmarker_lite.task';
  }catch(e){}
  const opts=d=>({baseOptions:{
      modelAssetPath:modelPath,
      delegate:d},runningMode:'VIDEO',numPoses:2});
  try{POSE.landmarker=await vision.PoseLandmarker.createFromOptions(files,opts('GPU'));}
  catch(e){POSE.landmarker=await vision.PoseLandmarker.createFromOptions(files,opts('CPU'));}
  POSE.video.srcObject=stream;
  await new Promise(r=>POSE.video.onloadedmetadata=r);
  await POSE.video.play();
  POSE.running=true;
  stat.textContent='全身（頭〜足首）が映るように下がろう';
  poseLoop();
}
let lastVideoT=-1;
function poseLoop(){
  if(!POSE.running)return;
  requestAnimationFrame(poseLoop);
  const v=POSE.video;
  if(v.currentTime===lastVideoT)return;
  lastVideoT=v.currentTime;
  let res;
  try{res=POSE.landmarker.detectForVideo(v,performance.now());}catch(e){return;}
  const list=(res.landmarks||[]).slice(0,2);
  const np=S.np||1;
  const assigned=assignPoses(list,np);
  drawCamSkeleton(assigned,np);
  for(let pi=0;pi<np;pi++) processPose(assigned[pi],pi);
  if(POSE.calibOn) calibTick(np);
}
function hipXof(lm){ return (lm[LMK.LH].x+lm[LMK.RH].x)/2; }
/* 検出された骨格を、記憶した立ち位置に照合してP1/P2へ割り当てる。
   確信が持てないものは捨てる（取り違えるより「見えていない」ほうが安全） */
function assignPoses(list,np){
  const out=[null,null];
  const cand=list.filter(Boolean).map(lm=>({lm,x:hipXof(lm)}));
  if(np===1){ out[0]=cand.length?cand[0].lm:null; return out; }
  const anchor=pi=>{
    const sl=POSE.slots[pi];
    if(sl.lastX!=null)return sl.lastX;
    if(sl.homeX!=null)return sl.homeX;
    return null;
  };
  const a0=anchor(0), a1=anchor(1);
  // まだ立ち位置を覚えていない（キャリブ前）→ 画面左＝P1として初期化
  if(a0==null||a1==null){
    cand.sort((p,q)=>q.x-p.x);          // 生座標が大きいほうが画面左（映像は左右反転）
    for(let i=0;i<Math.min(2,cand.length);i++){
      out[i]=cand[i].lm;
      POSE.slots[i].lastX=cand[i].x;
    }
    POSE.slots[0].amb=POSE.slots[1].amb=false;
    return out;
  }
  if(cand.length>=2){
    // 2通りの組み合わせのうち、ずれの合計が小さいほうを採用
    const costA=Math.abs(cand[0].x-a0)+Math.abs(cand[1].x-a1);
    const costB=Math.abs(cand[1].x-a0)+Math.abs(cand[0].x-a1);
    const pair = costA<=costB ? [cand[0],cand[1]] : [cand[1],cand[0]];
    for(let i=0;i<2;i++){
      const d=Math.abs(pair[i].x-anchor(i));
      if(d<=TRK.MAXD*1.6){ out[i]=pair[i].lm; POSE.slots[i].amb=false; }
      else { POSE.slots[i].amb=true; }
    }
  }
  else if(cand.length===1){
    // 1人しか映っていない：どちらの立ち位置に近いかで判定。
    // 差がわずかなら「どちらか判別できない」として採点を止める
    const c=cand[0];
    const d0=Math.abs(c.x-a0), d1=Math.abs(c.x-a1);
    const near=d0<=d1?0:1, far=1-near;
    const sure=(Math.abs(d0-d1)>=TRK.MARGIN)&&(Math.min(d0,d1)<=TRK.MAXD);
    if(sure){ out[near]=c.lm; POSE.slots[near].amb=false; }
    else { POSE.slots[0].amb=true; POSE.slots[1].amb=true; }
    POSE.slots[far].amb=POSE.slots[far].amb||false;
  }
  // 立ち位置の記憶を更新（ゆっくり追従。見失った枠は動かさない）
  for(let i=0;i<2;i++){
    const sl=POSE.slots[i];
    if(out[i]){
      const x=hipXof(out[i]);
      sl.lastX = sl.lastX==null ? x : sl.lastX+(x-sl.lastX)*TRK.EMA;
      sl.lost=0;
    } else {
      sl.lost++;
      // 長く見失ったら記憶をキャリブ位置へ戻す（別人が入り込んだときの復帰用）
      if(sl.lost>90&&sl.homeX!=null)sl.lastX=sl.homeX;
    }
  }
  POSE.gapWarn = Math.abs((POSE.slots[0].lastX??0)-(POSE.slots[1].lastX??1))<TRK.MINGAP;
  return out;
}
function processPose(lm,pi){
  const PS=POSE.P[pi];
  if(!lm){PS.visible=false;PS.liveDepth*=0.9;PS.liveRise*=0.9;return;}
  let vis=true;
  for(const i of NEED){if(!lm[i]||(lm[i].visibility!=null&&lm[i].visibility<0.4))vis=false;}
  PS.visible=vis;
  if(!vis){PS.liveDepth*=0.9;PS.liveRise*=0.9;return;}
  const a=0.45;
  for(const i of [...NEED,...SOFT]){
    if(!lm[i]||((lm[i].visibility??1)<0.3))continue;
    if(!PS.sm[i])PS.sm[i]={x:lm[i].x,y:lm[i].y};
    PS.sm[i].x+=a*(lm[i].x-PS.sm[i].x);
    PS.sm[i].y+=a*(lm[i].y-PS.sm[i].y);
  }
  const p=PS.sm;
  const hipY=(p[LMK.LH].y+p[LMK.RH].y)/2;
  const shY=(p[LMK.LS].y+p[LMK.RS].y)/2;
  const ankY=(p[LMK.LA].y+p[LMK.RA].y)/2;
  if(PS.calib.on){
    PS.calib.frames.push({hipY,hipX:(p[LMK.LH].x+p[LMK.RH].x)/2,
      kneeL:p[LMK.LK].y,kneeR:p[LMK.RK].y,bodyH:ankY-shY,
      spread:Math.abs(p[LMK.LA].x-p[LMK.RA].x)});
    if(PS.calib.frames.length>=POSE.calibNeed){
      const f=PS.calib.frames,n=f.length,avg=k=>f.reduce((s2,o)=>s2+o[k],0)/n;
      PS.base={hipY:avg('hipY'),hipX:avg('hipX'),kneeL:avg('kneeL'),kneeR:avg('kneeR'),
        bodyH:Math.max(.2,avg('bodyH')),spread:avg('spread')};
      POSE.slots[pi].homeX=PS.base.hipX;
      POSE.slots[pi].lastX=PS.base.hipX;
      PS.calib.on=false;
    }
    return;
  }
  if(!PS.base)return;
  const b=PS.base,bh=b.bodyH,now=performance.now()/1000;
  const depth=(hipY-b.hipY)/bh;
  const rise=(b.hipY-hipY)/bh;
  PS.liveDepth=Math.max(0,depth);
  PS.liveRise=Math.max(0,rise);
  if(S.scene!=='play')return;
  if(pi===0){
    const squatActive=S.enc&&(S.enc.kind==='rock'||S.enc.kind==='battle');
    $('#depthMeter').style.display=(squatActive&&S.np===1)?'block':'none';
    if(squatActive&&S.np===1)$('#depthFill').style.height=Math.min(100,Math.max(0,depth/0.22*100))+'%';
  }
  if(!PS.squatDown&&depth>0.18){PS.squatDown=true;}
  if(PS.squatDown&&depth<0.07){PS.squatDown=false;onRep('squat',pi);}
  if(!PS.jumpUp&&rise>0.09&&now-PS.lastJumpT>0.5){PS.jumpUp=true;}
  if(PS.jumpUp&&rise<0.03){PS.jumpUp=false;PS.lastJumpT=now;onRep('jump',pi);}
  const liftL=(b.kneeL-p[LMK.LK].y)/bh,liftR=(b.kneeR-p[LMK.RK].y)/bh;
  stepKnee(PS,'L',liftL,now,pi);stepKnee(PS,'R',liftR,now,pi);
  PS.liveLift=Math.max(liftL,liftR);
  const hipX2=(p[LMK.LH].x+p[LMK.RH].x)/2;
  PS.liveSide=(b.hipX-hipX2)/bh*1.7;
}
function stepKnee(PS,side,lift,now,pi){
  if(!PS.kneeUp[side]&&lift>0.16&&now-PS.lastStepT>0.16){
    PS.kneeUp[side]=true;PS.lastStepT=now;onRep('step',pi);
  }
  if(PS.kneeUp[side]&&lift<0.07)PS.kneeUp[side]=false;
}
function calibTick(np){
  let allDone=true, minPct=100, allVisible=true;
  for(let i=0;i<np;i++){
    const PS=POSE.P[i];
    if(!PS.visible)allVisible=false;
    if(!PS.visible&&PS.calib.on)PS.calib.frames.length=0;
    const pct=Math.min(100,Math.round(PS.calib.frames.length/POSE.calibNeed*100));
    minPct=Math.min(minPct,PS.base?100:pct);
    if(!PS.base)allDone=false;
  }
  // 2人が近すぎると取り違えの原因になるので、離れ直してもらう
  POSE.tooClose=false;
  if(np>1){
    const x0=POSE.slots[0].lastX, x1=POSE.slots[1].lastX;
    if(x0!=null&&x1!=null&&Math.abs(x0-x1)<TRK.MINGAP*1.4){
      POSE.tooClose=true;
      for(let i=0;i<np;i++){POSE.P[i].calib.frames.length=0;}
      allDone=false;minPct=0;
    }
  }
  updCalib((allVisible&&!POSE.tooClose)?minPct:0);
  if(allDone){POSE.calibOn=false;calibDone();}
}
const BONES=[[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[11,13],[13,15],[12,14],[14,16]];
const PCOL=['#FFC53D','#5AD38A'];
function drawCamSkeleton(list,np){
  const r=$('#camPane').getBoundingClientRect();
  cg.clearRect(0,0,r.width,r.height);
  if(!list||!list.length)return;
  const v=POSE.video;
  const sc=(camMode&&document.getElementById('stage').classList.contains('camov'))
    ? Math.min(r.width/v.videoWidth,r.height/v.videoHeight)   // 重ねて出すときは全体表示
    : Math.max(r.width/v.videoWidth,r.height/v.videoHeight);
  const dw=v.videoWidth*sc,dh=v.videoHeight*sc;
  const ox=(r.width-dw)/2,oy=(r.height-dh)/2;
  const X=p=>r.width-(ox+p.x*dw),Y=p=>oy+p.y*dh;
  if(np>1){
    cg.fillStyle='rgba(0,0,0,.55)';
    if(ox>0){cg.fillRect(0,0,ox,r.height);cg.fillRect(ox+dw,0,r.width-ox-dw,r.height);}
    if(oy>0){cg.fillRect(0,0,r.width,oy);cg.fillRect(0,oy+dh,r.width,r.height-oy-dh);}
    for(let i=0;i<2;i++){
      const hx=POSE.slots[i].homeX;
      if(hx==null)continue;
      const lx=r.width-(ox+hx*dw);
      cg.strokeStyle=PCOL[i];cg.globalAlpha=(camMode==='full'?.55:.3);cg.lineWidth=2;
      cg.setLineDash([6,6]);
      cg.beginPath();cg.moveTo(lx,oy);cg.lineTo(lx,oy+dh);cg.stroke();
      cg.setLineDash([]);cg.globalAlpha=1;
    }
  }
  for(let pi=0;pi<Math.min(list.length,np);pi++){
    const lm=list[pi];if(!lm)continue;
    cg.strokeStyle=(np>1?PCOL[pi]:'rgba(90,211,138,.9)');
    cg.lineWidth=(np>1&&camMode==='mini')?4:3;cg.lineCap='round';
    for(const[a2,b2]of BONES){
      if(!lm[a2]||!lm[b2])continue;
      cg.beginPath();cg.moveTo(X(lm[a2]),Y(lm[a2]));cg.lineTo(X(lm[b2]),Y(lm[b2]));cg.stroke();
    }
    cg.fillStyle=(np>1?PCOL[pi]:'#FFC53D');
    for(const i of NEED){if(lm[i]){cg.beginPath();cg.arc(X(lm[i]),Y(lm[i]),4,0,7);cg.fill();}}
    if(np>1&&lm[LMK.NOSE]){
      const lx=X(lm[LMK.NOSE]),ly=Y(lm[LMK.NOSE])-26;
      cg.fillStyle=POSE.slots[pi].amb?'#E5533C':PCOL[pi];
      const small=(camMode==='mini');
      cg.fillRect(lx-(small?13:16),ly-(small?12:14),small?26:32,small?15:18);
      cg.fillStyle='#140c04';cg.font=(small?'700 11px':'700 13px')+' DotGothic16';cg.textAlign='center';
      cg.fillText('P'+(pi+1),lx,ly);cg.textAlign='left';
    }
  }
}

/* ---------------- レップ処理 ---------------- */
function onRep(mv,pi){
  pi=pi||0;
  if(S.scene!=='play'||S.countdown>0)return;
  if(pi>=S.np)return;
  const P=S.p[pi];
  const now=S.t;
  if(mv==='jump'){P.lastJump=now;P.char.hop=0.5;if(pi===0)lastJumpAny=now;}
  const e=S.enc;
  if(!e){
    if(mv==='step'){
      P.reps.step++;SFX.step();
      P.char.walkPh+=Math.PI;
      if(now-P.lastStepT<0.9){P.streak++;}else{P.streak=1;}
      P.maxStreak=Math.max(P.maxStreak,P.streak);
      P.lastStepT=now;
      const boost=P.streak>=8?1.15:1.0;
      S.v=Math.min(3.4,S.v+(S.np>1?0.5:0.85)*boost);
      addScore(P.streak>=8?8:5,null,pi);
    }
    if(mv==='jump'){P.reps.jump++;SFX.jump();}
    if(mv==='jack'){P.reps.jack++;addScore(6,null,pi);}
    return;
  }
  if(e.kind==='rock'){
    if(e.hp<=0)return;
    if(mv==='squat'){
      P.reps.squat++;e.hp--;SFX.hit();
      if(e.dmg)e.dmg[pi]++;
      P.char.attack=0.32;S.shake=0.25;addScore(30,'+30',pi);
      G3.rockDamage(e);
      if(e.hp<=0)rockCleared(e,pi);
    }
  }
  else if(e.kind==='battle'){
    if(e.state==='dead')return;
    if(mv==='squat'){
      P.reps.squat++;SFX.swing();
      if(e.dmg)e.dmg[pi]++;
      P.char.attack=0.32;e.flinch=0.3;e.hp--;
      addScore(40,'+40',pi);
      if(e.hp<=0){e.state='dead';e.deadT=0;SFX.kill();
        shareBonus(e,e.boss?250:150,'撃破');}
    }
    if(mv==='jump'){P.reps.jump++;}
  }
  else if(e.kind==='seal'){
    if(mv==='jack'&&!e.done){
      P.reps.jack++;e.cnt++;SFX.hit();
      if(e.dmg)e.dmg[pi]++;
      addScore(12,'+12',pi);G3.sealDamage(e);
      if(e.cnt>=e.need){
        e.doneAnim=true;SFX.smash();S.shake=0.5;
        G3.sealBreak(e);shareBonus(e,120,'封印解除');
        setTimeout(()=>endEncounter(e,null),450);
      }
    }
  }
  else if(e.kind==='spring'){
    if(mv==='squat'&&!e.done&&!e.ok[pi]){
      P.reps.squat++;SFX.hit();P.char.attack=0.32;
      e.cnt[pi]++;
      G3.springFill(e,Math.min(1,e.cnt[pi]/e.need));
      addScore(15,'+15',pi);
      if(e.cnt[pi]>=e.need){
        e.ok[pi]=true;SFX.chest();
        if(S.np>1){
          const first=!e.ok[1-pi];
          addScore(first?250:150,first?'先取！ +250':'+150',pi);
        } else {
          if(P.hearts<3){P.hearts++;drawHearts();
            S.popups.push({txt:'ハート回復！',rx:0.5,ry:0.36,life:1.4,pi});}
          else addScore(200,'満タン！ +200',pi);
        }
        G3.springBurst(e);
        const all=(S.np===1)||(e.ok[0]&&e.ok[1]);
        if(all){e.done=true;setTimeout(()=>endEncounter(e,null),600);}
      }
    }
  }
  else if(e.kind==='dash'){
    if(mv==='step'&&!e.done){
      P.reps.step++;e.cnt++;SFX.step();
      P.char.walkPh+=Math.PI;
      addScore(6,null,pi);
    }
  }
  else if(e.kind==='gap'){
    if(mv==='jump'&&e.armed&&!e.done){
      P.reps.jump++;
      if(!e.jumped)e.jumped={};
      if(!e.jumped[pi]){
        e.jumped[pi]=true;
        P.char.vault=1.0;SFX.dodge();addScore(100,'+100',pi);
      }
      const all=(S.np===1)||(e.jumped[0]&&e.jumped[1]);
      if(all&&!e.done){
        e.done=true;
        setTimeout(()=>{endEncounter(e,e.pos+e.width+0.3);},550);
      }
    }
  }
  else if(e.kind==='bridge'){
    if(mv==='jump'){P.reps.jump++;}
  }
  flash(mv==='step'?'GO!':'OK!');
}
/* 与ダメージの比率でボーナスを配る。1人用はそのまま全額 */
function shareBonus(e,total,label){
  if(S.np<2){addScore(total,label?('+'+total+' '+label):null,0);return;}
  const d=e.dmg||[0,0];
  const sum=d[0]+d[1];
  for(let pi=0;pi<2;pi++){
    const part=sum>0?Math.round(total*d[pi]/sum):Math.round(total/2);
    if(part>0)addScore(part,'+'+part+(label?' '+label:''),pi);
  }
}
function addScore(n,popup,pi){
  pi=pi||0;
  S.p[pi].score+=n;
  if(popup)S.popups.push({txt:(S.np>1?'P'+(pi+1)+' ':'')+popup,
    rx:S.np>1?(pi===0?0.3:0.7):0.5, ry:0.42, life:0.9, pi});
}
function loseHeart(reason,pi){
  pi=pi||0;
  const P=S.p[pi];
  P.miss++;S.redFlash=0.55;SFX.hurt();S.shake=0.5;
  S.popups.push({txt:(S.np>1?'P'+(pi+1)+' ':'')+reason,
    rx:S.np>1?(pi===0?0.3:0.7):0.5, ry:0.36, life:1.2, red:true, pi});
  if(S.np>1){                       // 対戦は脱落なし。ミスは減点で決着をつける
    P.score=Math.max(0,P.score-50);
    return;
  }
  P.hearts--;drawHearts();
  if(P.hearts<=0){gameOver();}
}

/* ---------------- エンカウント進行 ---------------- */
function enterEncounter(ev){
  S.enc=ev;S.v=0;
  if(ev.kind==='battle'){
    ev.state='idle';ev.st=1.6+Math.random();
    if(ev.boss){
      SFX.boss();S.shake=0.5;
      S.popups.push({txt:ev.last?'ラスボス出現！！':'中ボス出現！',rx:0.5,ry:0.3,life:1.6,red:true});
    }
  }
  if(ev.kind==='gap'){ev.armed=true;ev.timer=ev.window;SFX.warn();}
  if(ev.kind==='rock'){SFX.warn();}
  if(ev.kind==='dash'){ev.timer=ev.limit;SFX.warn();}
  if(ev.kind==='bridge'){for(let pi=0;pi<S.np;pi++)S.p[pi].held=0;ev.limit=null;SFX.warn();}
  if(ev.kind==='seal'){SFX.warn();}
  if(ev.kind==='spring'){ev.timer=ev.sec;SFX.chest();}
  updTask();
}
function endEncounter(ev,newDist){
  ev.done=true;S.enc=null;
  if(newDist!=null)S.dist=newDist;
  updTask();
}
function rockCleared(e,pi){
  SFX.smash();S.shake=0.6;G3.rockExplode(e);
  shareBonus(e,Math.round(e.timer*10),'タイムボーナス');
  setTimeout(()=>endEncounter(e,null),400);
}
function updateEncounter(dt){
  const e=S.enc;if(!e)return;
  if(e.kind==='rock'){
    e.timer-=dt;
    if(e.timer<=0&&!e.done&&e.hp>0){
      for(let pi=0;pi<S.np;pi++)loseHeart('落石をくらった！',pi);
      G3.rockFall(e);S.shake=0.6;SFX.smash();
      e.hp=0;setTimeout(()=>endEncounter(e,null),500);
    }
  }
  else if(e.kind==='battle'){
    if(e.flinch>0)e.flinch-=dt;
    if(e.state==='idle'){
      e.st-=dt;
      if(e.st<=0){
        e.state='tele';e.st=e.tele;e.chainLeft=(e.combo||1)-1;
        const ts=e.atkT||['jump'];
        e.atkKind=ts[Math.random()*ts.length|0];
        e.atkDir=Math.random()<0.5?-1:1;
        SFX.warn();
      }
    }
    else if(e.state==='tele'){
      e.st-=dt;
      if(e.st<=0){
        e.state='strike';e.st=0.35;SFX.slash();
        let anyDodge=false;
        for(let pi=0;pi<S.np;pi++){
          const P=S.p[pi];
          let dodged=false;
          if(e.atkKind==='side')dodged=curSide(pi)*e.atkDir>0.12;
          else if(e.atkKind==='duck')dodged=curDuck(pi)>0.13;
          else dodged=(S.t-P.lastJump<1.4||POSE.P[pi].jumpUp||P.char.hop>0.15);
          if(dodged){P.dodges++;anyDodge=true;addScore(80,'回避！ +80',pi);}
          else{loseHeart(e.name+'の攻撃！',pi);}
        }
        if(anyDodge)SFX.dodge();
        S.slash={t:0.35,dodged:anyDodge};
      }
    }
    else if(e.state==='strike'){
      e.st-=dt;
      if(e.st<=0){
        if(e.chainLeft>0){
          e.chainLeft--;e.state='tele';e.st=e.tele*0.7;
          const ts=e.atkT||['jump'];
          e.atkKind=ts[Math.random()*ts.length|0];
          e.atkDir=Math.random()<0.5?-1:1;
          SFX.warn();
        }
        else{e.state='idle';e.st=e.atkMin+Math.random()*(e.atkMax-e.atkMin);}
      }
    }
    else if(e.state==='dead'){
      e.deadT+=dt;
      if(e.deadT>0.9){endEncounter(e,null);}
    }
  }
  else if(e.kind==='seal'){
    // 時間制限なし：JJで解除するのみ（onRep側で進行）
  }
  else if(e.kind==='spring'){
    if(!e.done){
      e.timer-=dt;
      if(e.timer<=0){
        e.done=true;
        for(let pi=0;pi<S.np;pi++) if(!e.ok[pi])
          S.popups.push({txt:(S.np>1?'P'+(pi+1)+' ':'')+'泉は枯れた…',rx:S.np>1?(pi===0?0.3:0.7):0.5,ry:0.4,life:1.2,red:true});
        setTimeout(()=>endEncounter(e,null),500);
      }
    }
  }
  else if(e.kind==='bridge'){
    if(!e.done){
      e.limit=(e.limit==null? e.needS+8 : e.limit-dt);
      let allDone=true;
      for(let pi=0;pi<S.np;pi++){
        const P=S.p[pi];
        if(P.held>=e.needS)continue;
        if(curLift(pi)>0.11)P.held+=dt;
        if(P.held>=e.needS){SFX.dodge();addScore(150,'バランス成功 +150',pi);}
        else allDone=false;
      }
      e.held=S.p[0].held;
      if(allDone||e.limit<=0){
        e.done=true;
        for(let pi=0;pi<S.np;pi++){
          if(S.p[pi].held<e.needS)loseHeart('橋でぐらついた…！',pi);
        }
      }
    } else {
      const target=e.pos+e.width+0.4;
      S.dist=Math.min(target,S.dist+2.6*dt);
      if(S.dist>=target)endEncounter(e,target);
    }
  }
  else if(e.kind==='dash'){
    if(!e.done){
      e.timer-=dt;
      const need=e.need*(S.np>1?1.7:1);
      if(e.cnt>=need){
        e.done=true;SFX.go();
        const b=120+Math.round(Math.max(0,e.timer)*10);
        for(let pi=0;pi<S.np;pi++)addScore(b,'駆け抜けた！',pi);
      } else if(e.timer<=0){
        e.done=true;S.shake=0.6;G3.dashCrumble(e);
        for(let pi=0;pi<S.np;pi++)loseHeart('床が崩れた…！',pi);
      }
    } else {
      const target=e.pos+3.4;
      S.dist=Math.min(target,S.dist+5.2*dt);
      S.char.walkPh+=5.2*dt*3.2;
      if(S.dist>=target)endEncounter(e,target);
    }
  }
  else if(e.kind==='gap'){
    if(e.done){
      const target=e.pos+e.width+0.3;
      S.dist=Math.min(target,S.dist+(e.width+1.6)/0.5*dt);
    }
    if(!e.done){
      e.timer-=dt;
      if(e.timer<=0){
        for(let pi=0;pi<S.np;pi++){
          if(!(e.jumped&&e.jumped[pi]))loseHeart('谷に落ちかけた…！',pi);
        }
        e.done=true;
        setTimeout(()=>endEncounter(e,e.pos+e.width+0.3),400);
      }
    }
  }
  updTask();
}

/* 失敗の種類ごとに、次に何をすればよいかを示す */
function camErrorText(e){
  const n=(e&&e.name)||'';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return 'このブラウザではカメラが使えません。Safari（iPad）または Chrome で開くか、練習モードをどうぞ。';
  if(n==='NotAllowedError'||n==='PermissionDeniedError'||n==='SecurityError')
    return 'カメラの使用が許可されませんでした。iPadのSafariなら、アドレスバー左の「ぁあ」→「Webサイトの設定」→「カメラ」を「許可」にして、ページを再読み込みしてください。カメラなしで遊ぶなら練習モードをどうぞ。';
  if(n==='NotFoundError'||n==='OverconstrainedError'||n==='DevicesNotFoundError')
    return 'カメラが見つかりませんでした。カメラ付きの端末で開くか、練習モードをどうぞ。';
  if(n==='NotReadableError'||n==='TrackStartError'||n==='AbortError')
    return 'カメラを起動できませんでした。ほかのアプリやタブがカメラを使っていないか確認して、もう一度おしてください。';
  return 'AIモデル（姿勢推定）を読み込めませんでした（'+(n||'error')+'）。通信環境を確認して、もう一度おすか、練習モードをどうぞ。';
}

function updTask(){
  const taskEl=$('#task'),lbl=$('#taskLbl'),cnt=$('#taskCnt');
  const e=S.enc;
  taskEl.classList.remove('alert');
  if(!e){
    lbl.innerHTML='<b>足踏み</b>で走れ！';
    cnt.textContent=`${S.dist.toFixed(0)} / ${S.goal} m`;
    return;
  }
  if(e.kind==='rock'){
    taskEl.classList.add('alert');
    lbl.innerHTML='<b>スクワット</b>で岩を砕け！';
    cnt.textContent=`岩 ${Math.max(0,e.hp)}　あと ${Math.max(0,e.timer).toFixed(1)}秒`;
  }
  else if(e.kind==='battle'){
    if(e.state==='tele'){
      taskEl.classList.add('alert');
      const msg=e.atkKind==='side'
        ? `<b>${e.atkDir>0?'右':'左'}へよけろ！</b>`
        : e.atkKind==='duck'
        ? '<b>しゃがめ！</b>'
        : '<b>ジャンプ！</b>';
      lbl.innerHTML=`<span class="dodge">${msg}</span>`;
    } else {
      const tag=e.boss?(e.last?'【ラスボス】':'【中ボス】'):'';
      lbl.innerHTML=`${tag}${e.name}　<b>スクワットで攻撃！</b>`;
    }
    cnt.textContent=`敵HP ${Math.max(0,e.hp)} / ${e.hpMax}`;
  }
  else if(e.kind==='gap'){
    taskEl.classList.add('alert');
    lbl.innerHTML='<b>ジャンプ！</b>';
    cnt.textContent=`あと ${Math.max(0,e.timer).toFixed(1)}秒`;
  }
  else if(e.kind==='seal'){
    lbl.innerHTML='<b>ジャンピングジャック！</b>';
    cnt.textContent=`${e.cnt} / ${e.need} 回`;
  }
  else if(e.kind==='spring'){
    lbl.innerHTML='<b>スクワットで泉を満たせ！</b>';
    cnt.textContent=(S.np>1
      ? `P1 ${Math.min(e.need,e.cnt[0])}／P2 ${Math.min(e.need,e.cnt[1])}／${e.need}回`
      : `${Math.min(e.need,e.cnt[0])} / ${e.need} 回`)+`　あと ${Math.max(0,e.timer).toFixed(1)}秒`;
  }
  else if(e.kind==='bridge'){
    lbl.innerHTML=e.done?'<b>渡りきれ！</b>':'<b>片足立ちでキープ！</b>';
    cnt.textContent=e.done?''
      :(S.np>1
        ? `P1 ${Math.min(e.needS,S.p[0].held).toFixed(1)} ／ P2 ${Math.min(e.needS,S.p[1].held).toFixed(1)} ／ 目標 ${e.needS.toFixed(1)}秒`
        : `${Math.min(e.needS,S.p[0].held).toFixed(1)} / ${e.needS.toFixed(1)} 秒`);
  }
  else if(e.kind==='dash'){
    taskEl.classList.add('alert');
    lbl.innerHTML=e.done?'<b>走り抜けろ！</b>':'<b>全力で足踏み！</b>';
    cnt.textContent=e.done?'':`${e.cnt} / ${Math.round(e.need*(S.np>1?1.7:1))} 歩　あと ${Math.max(0,e.timer).toFixed(1)}秒`;
  }
  else if(e.kind==='goal'){lbl.innerHTML='<b>宝箱だ！</b>';cnt.textContent='';}
}

  if(sc>=1750*f)return['A','見事な探索！ 回避のキレが光る。'];
  if(sc>=1300*f)return['B','ナイスファイト！ 足踏みのテンポを保つとスコアが伸びる。'];
  return['C','完走が何より立派。次は「！」を見たら迷わずジャンプ！'];
}

function update(dt){
  if(S.scene!=='play')return;
  if(S.countdown>0){
    const before=Math.ceil(S.countdown);
    S.countdown-=dt;
    const after=Math.ceil(S.countdown);
    if(after<before&&after>0)SFX.count();
    if(S.countdown<=0){SFX.go();}
    return;
  }
  // 見失ったらカメラを開いて仕切り直す（1人用・2人用とも）
  if(S.mode==='camera'){
    let ok=true;
    for(let i=0;i<S.np;i++) if(!POSE.P[i].visible) ok=false;
    if(S.np>1&&(POSE.slots[0].amb||POSE.slots[1].amb)) ok=false;
    if(ok){S.okT=(S.okT||0)+dt;S.lostT=0;}else{S.lostT=(S.lostT||0)+dt;S.okT=0;}
    if(!S.paused&&S.lostT>1.2){
      S.paused=true;
      const miss=[];
      for(let i=0;i<S.np;i++) if(!POSE.P[i].visible) miss.push('P'+(i+1));
      setCamMode('full','一時停止：位置を直してください',
        S.np>1
          ? (miss.length?miss.join('・')+'が映っていません。':'どちらがどちらか判別できません。')
            +'<br>点線の立ち位置に戻り、2人とも全身が入ると再開します'
          : '頭から足首まで映る位置に戻ってください。<br>全身が入ると自動で再開します');
    }
    if(S.paused&&S.okT>0.8){
      S.paused=false;setCamMode('mini');SFX.go();
    }
    if(S.paused)return;
  }
  S.t+=dt;
  if(!S.enc){
    S.v-=S.v*1.5*dt;if(S.v<0.01)S.v=0;
    for(let pi=0;pi<S.np;pi++){
      if(S.t-S.p[pi].lastStepT>1.1)S.p[pi].streak=0;
      S.p[pi].char.walkPh+=S.v*dt*3.2;
    }
    S.dist+=S.v*dt;
    const nx=S.course.find(c=>!c.done&&S.dist>=c.pos-1.5);
    if(nx){
      if(nx.kind==='goal'){nx.done=true;finishRun();}
      else{S.dist=nx.pos-1.5;enterEncounter(nx);}
    }
    updTask();
  } else {
    updateEncounter(dt);
  }
  if(PR.sideT>0){PR.sideT-=dt;if(PR.sideT<=0)PR.side=0;}
  for(const p of S.popups){p.life-=dt;p.ry-=0.07*dt;}
  S.popups=S.popups.filter(p=>p.life>0);
  if(S.redFlash>0)S.redFlash-=dt;
  if(S.slash){S.slash.t-=dt;if(S.slash.t<=0)S.slash=null;}
  const st=$('#streak');
  if(S.np>1){
    st.textContent='';
    $('#vsP1').textContent=String(S.p[0].score);
    $('#vsP2').textContent=String(S.p[1].score);
  } else {
    st.textContent=S.streak>=8?`テンポ×${S.streak}!`:'';
    $('#hScore').textContent=String(S.score);
  }
  $('#hTime').textContent=S.t.toFixed(1);
  const t2=$('#hTime2');if(t2)t2.textContent=S.t.toFixed(1);
}

  /* ---- ステージテーマ適用（模様＋造形物） ---- */
  function texKind(kind,base,dark,acc){
    const c=document.createElement('canvas');c.width=128;c.height=128;
    const x=c.getContext('2d');
    x.fillStyle=base;x.fillRect(0,0,128,128);
    const noise=(n,a)=>{for(let i=0;i<n;i++){x.fillStyle=`rgba(0,0,0,${a})`;
      x.fillRect(Math.random()*128|0,Math.random()*128|0,2,2);}};
    if(kind==='brick'){
      for(let row=0;row<4;row++){const off=(row%2)*32;
        for(let col=-1;col<5;col++){const bx=col*48+off,by=row*32;
          x.fillStyle=shadeCol(base,0.85+Math.random()*0.3);x.fillRect(bx+2,by+2,44,28);
          if(acc&&Math.random()<0.3){x.fillStyle=acc+'55';x.fillRect(bx+4+Math.random()*30|0,by+20,10,6);}
        }}
      x.fillStyle=dark;
      for(let r=0;r<=4;r++)x.fillRect(0,r*32,128,2);
      for(let r=0;r<4;r++){const off=(r%2)*32;for(let col=-1;col<5;col++)x.fillRect(col*48+off,r*32,2,32);}
      noise(50,0.1);
    }
    else if(kind==='tile'){
      for(let ry=0;ry<8;ry++)for(let cx2=0;cx2<8;cx2++){
        x.fillStyle=shadeCol(base,0.82+Math.random()*0.36);
        x.fillRect(cx2*16+1,ry*16+1,14,14);
      }
      x.fillStyle=dark;
      for(let i=0;i<=8;i++){x.fillRect(0,i*16,128,1.5);x.fillRect(i*16,0,1.5,128);}
      if(acc){ // 藻のしたたり
        for(let i=0;i<7;i++){const gx=Math.random()*120|0,gy=Math.random()*60|0;
          x.fillStyle=acc+'66';x.fillRect(gx,gy,5,20+Math.random()*40|0);
          x.fillStyle=acc+'99';x.fillRect(gx+1,gy,2,12+Math.random()*20|0);}
      }
      noise(40,0.08);
    }
    else if(kind==='rough'){
      for(let i=0;i<26;i++){
        x.fillStyle=shadeCol(base,0.7+Math.random()*0.55);
        const r=8+Math.random()*22;
        x.beginPath();x.arc(Math.random()*128,Math.random()*128,r,0,7);x.fill();
      }
      if(acc){ // 発光する亀裂（マグマ）
        for(let i=0;i<3;i++){
          let gx=Math.random()*128,gy=0;
          x.strokeStyle=acc;x.lineWidth=2.5;x.beginPath();x.moveTo(gx,gy);
          while(gy<128){gy+=10+Math.random()*14;gx+=(Math.random()-0.5)*26;x.lineTo(gx,gy);}
          x.stroke();
          x.strokeStyle='#ffe9b0';x.lineWidth=1;x.stroke();
        }
      }
      noise(70,0.1);
    }
    else if(kind==='sand'){
      for(let row=0;row<2;row++)for(let col=0;col<2;col++){
        x.fillStyle=shadeCol(base,0.88+Math.random()*0.24);
        x.fillRect(col*64+2,row*64+2,60,60);
      }
      x.fillStyle=dark;
      x.fillRect(0,0,128,3);x.fillRect(0,63,128,3);x.fillRect(0,125,128,3);
      x.fillRect(0,0,3,128);x.fillRect(63,0,3,128);x.fillRect(125,0,3,128);
      // 象形文字風の彫り
      x.fillStyle=shadeCol(dark,1.3);
      const glyph=(gx,gy)=>{const g2=Math.random()*4|0;
        if(g2===0){x.fillRect(gx,gy,4,14);x.fillRect(gx-3,gy+3,10,3);}
        else if(g2===1){x.beginPath();x.arc(gx+3,gy+6,5,0,7);x.fill();x.fillStyle=base;x.fillRect(gx+1,gy+4,4,4);x.fillStyle=shadeCol(dark,1.3);}
        else if(g2===2){x.beginPath();x.moveTo(gx,gy+12);x.lineTo(gx+5,gy);x.lineTo(gx+10,gy+12);x.closePath();x.fill();}
        else {x.fillRect(gx,gy,12,3);x.fillRect(gx,gy+6,12,3);x.fillRect(gx,gy+12,12,3);}};
      for(let i=0;i<8;i++)glyph(10+Math.random()*100|0,10+Math.random()*100|0);
      noise(40,0.06);
    }
    else if(kind==='ice'){
      // 斜めの氷筋ときらめき
      for(let i=0;i<12;i++){
        x.strokeStyle=shadeCol(base,1.06+Math.random()*0.16)+'';
        x.lineWidth=3+Math.random()*7;
        const gx=Math.random()*128;
        x.beginPath();x.moveTo(gx,0);x.lineTo(gx+40,128);x.stroke();
      }
      for(let i=0;i<9;i++){
        x.strokeStyle=dark;x.lineWidth=1.2;
        const gx=Math.random()*128,gy=Math.random()*128;
        x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+16,gy+22);x.lineTo(gx+10,gy+40);x.stroke();
      }
      x.fillStyle='#ffffff';
      for(let i=0;i<14;i++){const gx=Math.random()*126|0,gy=Math.random()*126|0;
        x.fillRect(gx,gy,2,2);x.fillRect(gx-2,gy,2,1);x.fillRect(gx+2,gy,2,1);}
      noise(20,0.04);
    }
    else if(kind==='bone'){
      for(let row=0;row<4;row++){const off=(row%2)*32;
        for(let col=-1;col<5;col++){const bx=col*48+off,by=row*32;
          x.fillStyle=shadeCol(base,0.85+Math.random()*0.3);x.fillRect(bx+2,by+2,44,28);}}
      x.fillStyle=dark;
      for(let r=0;r<=4;r++)x.fillRect(0,r*32,128,2);
      // 壁に埋まった骨と頭蓋骨
      const bone=acc||'#c8c0aa';
      for(let i=0;i<5;i++){
        const gx=8+Math.random()*104|0,gy=8+Math.random()*104|0;
        if(Math.random()<0.45){ // 頭蓋骨
          x.fillStyle=bone;x.beginPath();x.arc(gx,gy,7,0,7);x.fill();x.fillRect(gx-4,gy+5,8,4);
          x.fillStyle=dark;x.fillRect(gx-4,gy-2,3,3);x.fillRect(gx+1,gy-2,3,3);
        } else { // 骨
          x.strokeStyle=bone;x.lineWidth=3;
          x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+14,gy+5);x.stroke();
          x.fillStyle=bone;
          x.beginPath();x.arc(gx,gy,3,0,7);x.fill();x.beginPath();x.arc(gx+14,gy+5,3,0,7);x.fill();
        }
      }
      noise(50,0.1);
    }
    else if(kind==='gothic'){
      for(let row=0;row<6;row++){const off=(row%2)*21;
        for(let col=-1;col<4;col++){const bx=col*42+off,by=row*22;
          x.fillStyle=shadeCol(base,0.8+Math.random()*0.4);x.fillRect(bx+2,by+2,38,18);
          if(Math.random()<0.12){x.fillStyle=shadeCol(base,1.5);x.fillRect(bx+2,by+2,38,18);}
        }}
      x.fillStyle='#000000';
      for(let r=0;r<=6;r++)x.fillRect(0,r*22,128,2);
      for(let r=0;r<6;r++){const off=(r%2)*21;for(let col=-1;col<4;col++)x.fillRect(col*42+off,r*22,2,22);}
      noise(60,0.12);
    }
    const t=texOf(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
    return t;
  }

  let curTheme=-1;
  function applyTheme(n){
    if(n===curTheme)return;curTheme=n;
    const th=THEMES[n-1];
    const nw=texKind(th.kW,th.wall[0],th.wall[1],th.accW);
    const nf=texKind(th.kF,th.floor[0],th.floor[1],th.accF);
    const nc=texKind(th.kC,th.ceil[0],th.ceil[1],th.accC);
    for(const[m,t2]of[[wallM,nw],[floorM,nf],[ceilM,nc]]){
      if(m.map)m.map.dispose();
      m.map=t2;m.needsUpdate=true;
    }
    beamM.color.setHex(th.beam);
    scene.fog.color.setHex(th.fog);scene.fog.density=th.fogD;

  function updateEnemyView(v,t,dt){
    const e=v.e,d=v.d;
    if(e.done&&e.state!=='dead'){v.g.visible=false;return;}
    v.g.visible=true;
    if(v.frames.length>1){
      const rate=e.state==='tele'?14:9;
      const fr=Math.floor(t*rate)%v.frames.length;
      v.frames.forEach((f,i)=>f.visible=i===fr);
    }
    let y=d.y*v.scale;
    if(d.fly)y+=Math.sin(t*3+v.phase)*0.12;
    else if(d.hover)y+=Math.sin(t*2+v.phase)*0.08;
    else y+=Math.sin(t*1.6+v.phase)*0.02;
    let z=-e.pos, pulse=1, sy=1;
    if(d.squish&&e.state!=='dead')sy=1+Math.sin(t*4+v.phase)*0.06;
    v.g.position.x=e.flinch>0?Math.sin(t*60)*0.06:0;
    if(v.sword){
      const target=e.state==='tele'?-2.1:e.state==='strike'?1.0:0.5;
      v.sword.rotation.z+=(target-v.sword.rotation.z)*Math.min(1,dt*14);
    }
    if(e.state==='strike'){const k=1-e.st/0.35;z=-e.pos+Math.sin(k*Math.PI)*1.1;pulse=1+Math.sin(k*Math.PI)*0.13;}
    if(e.state==='dead'){
      const k=e.deadT;
      const fade=Math.max(0,1-k*1.1);
      v.frames.forEach(f=>f.material.opacity=fade);
      if(v.sword)v.sword.material.opacity=fade;
      if(d.fly||d.hover){y-=k*k*3.0;v.g.rotation.z=k*2.0;}
      else if(d.squish){sy=Math.max(0.12,1-k*1.2);y-=(1-sy)*d.h*0.4*v.scale;}
      else{v.g.rotation.x=k*1.4;y-=k*0.6;}
    } else {v.g.rotation.z=0;v.g.rotation.x=0;}
    v.g.position.y=y;v.g.position.z=z;
    v.g.scale.set(v.scale*pulse,v.scale*pulse*sy,1);
    v.glow.visible=e.state==='tele';
  }
  function render(t,dt){
    // ---- カメラ（実しゃがみ・実ジャンプ連動） ----
    let cy=1.6;
    if(S.np>1){
      cy+=Math.abs(Math.sin(S.p[0].char.walkPh))*0.03;
    }else if(S.mode==='camera'&&POSE.P[0].base){
      cy+=Math.min(0.28,POSE.P[0].liveRise)*2.6;
      cy-=Math.min(0.32,POSE.P[0].liveDepth)*1.35;
    }else{
      if(S.char.hop>0)cy+=Math.sin((0.5-S.char.hop)/0.5*Math.PI)*0.5;
      if(S.char.attack>0)cy-=Math.sin(S.char.attack/0.32*Math.PI)*0.28;
    }
    if(S.char.vault>0)cy+=Math.sin((1-S.char.vault)*Math.PI)*0.7;
    cy+=Math.abs(Math.sin(S.char.walkPh))*0.05*Math.min(1,S.v);
    let cx=(S.np>1?0:Math.max(-0.85,Math.min(0.85,curSide(0)*0.95))),roll=0;
    if(S.shake>0){S.shake-=dt;cx+=Math.sin(t*70)*0.04*S.shake;roll=Math.sin(t*55)*0.02*S.shake;}
    camera.position.set(cx,cy,-S.dist);
    camera.rotation.set(0,0,roll);
    lantern.position.set(cx+0.3,cy-0.15,-S.dist-0.4);
    lantern.intensity=2.5+Math.sin(t*11)*0.25+Math.random()*0.1;
    const near=torchZ.map((z,i)=>({z,i,d:Math.abs(z-S.dist)})).sort((a,b)=>a.d-b.d).slice(0,torchLights.length);
    torchLights.forEach((l,k)=>{
      const n=near[k];
      if(n&&n.d<10){
        l.visible=true;
        const side=n.i%2===0?-1:1;
        l.position.set(side*(CW/2-0.32),2.2,-n.z);
        l.intensity=1.4+Math.sin(t*9+n.i*2)*0.35;
      } else l.visible=false;
    });
    for(let i=0;i<flames.length;i++){
      const f=flames[i];
      f.scale.set(0.32+Math.sin(t*10+i)*0.04,0.48+Math.sin(t*13+i*2)*0.07,1);
    }
    for(const v of views.gaps)v.ember.intensity=1.0+Math.sin(t*7+v.e.pos)*0.4;
    for(const v of views.rocks){
      const e=v.e;
      if(S.enc===e&&v.hangFall<0){
        const u=1-Math.max(0,e.timer)/e.limit;
        v.stal.position.x=Math.sin(t*40)*0.04*u;
        v.stal.position.y=CH-0.44+Math.sin(t*53)*0.03*u;
      }
      if(v.hangFall>=0){
        v.hangFall+=dt;
        v.stal.position.y=CH-0.44-v.hangFall*v.hangFall*11;
        if(v.hangFall>0.75)v.stal.visible=false;
      }
    }
    for(const v of views.seals){
      if(v.e.done)continue;
      v.door.material.opacity=0.9+Math.sin(t*3)*0.08;
      v.light.intensity=(1.4+v.e.cnt*0.25)+Math.sin(t*5)*0.3;
    }
    for(const v of views.bridges)v.ember.intensity=0.9+Math.sin(t*7+v.e.pos)*0.35;
    for(const v of views.springs){
      v.plane.position.y=0.85+Math.sin(t*2.2)*0.03;
      if(!v.e.done)v.light.intensity=Math.max(v.light.intensity,1.4+Math.sin(t*4)*0.5);
    }
    for(const v of views.dashes){
      const e=v.e;
      if(S.enc===e&&!e.done){
        v.warn.intensity=1.2+Math.sin(t*14)*1.0;
        v.crack.position.x=Math.sin(t*45)*0.02;
      } else v.warn.intensity=0;
      if(v.fell){v.crack.material.opacity=Math.max(0.25,v.crack.material.opacity-dt*1.2);}
    }
    for(const v of views.enemies)updateEnemyView(v,t,dt);
    chestLight.intensity=1.6+Math.sin(t*3)*0.5;
    chestMesh.position.y=0.5+Math.sin(t*3)*0.03;
    for(const d of debris){
      if(!d.m.visible)continue;
      d.life-=dt;
      if(d.life<=0){d.m.visible=false;continue;}
      d.v.y-=9.8*dt;
      d.m.position.addScaledVector(d.v,dt);
      if(d.m.position.y<0.06){d.m.position.y=0.06;d.v.y*=-0.3;d.v.x*=0.7;d.v.z*=0.7;}
      d.m.rotation.x+=dt*4;d.m.rotation.y+=dt*3;
    }
    for(const fn of propsAnim)fn(t);
    renderer.render(scene,camera);
    drawOverlay(t,dt);
  }

  /* ---- 2Dオーバーレイ（！マーク・斬撃・両手・演出） ---- */
  function drawOverlay(t,dt){
    og.clearRect(0,0,OW,OH);
    // 「！」テレグラフ（敵頭上に投影）
    for(const v of views.enemies){
      const e=v.e;
      if(e.state!=='tele')continue;
      const p=projectToScreen(v.g,v.d.h*0.55*v.scale);
      if(p.z>1)continue;
      const kk=e.st/e.tele;
      const F=Math.max(46,Math.round(OH*0.13));
      const R=Math.max(26,OH*0.045)+OH*0.13*kk;
      const mx=F*1.9, my=F*1.1;
      const cx=Math.min(OW-mx,Math.max(mx,p.x));
      const cy=Math.min(OH*0.72,Math.max(my,p.y));
      og.strokeStyle='rgba(229,83,60,.95)';og.lineWidth=Math.max(5,OH*0.011);
      og.beginPath();og.arc(cx,cy,R,0,7);og.stroke();
      og.fillStyle='#E5533C';og.textAlign='center';og.textBaseline='middle';
      og.font=`700 ${F}px DotGothic16`;
      if(e.atkKind==='side'){
        const dir=e.atkDir>0?1:-1;
        const ax=Math.min(OW-F*0.9,Math.max(F*0.9,cx+dir*(R+F*0.75)));
        og.fillText(dir>0?'→':'←',ax,cy);
        og.fillText('！',cx,cy);
      } else if(e.atkKind==='duck'){
        og.fillText('！',cx,cy);
        og.fillText('▼',cx,Math.min(OH-F*0.7,cy+R+F*0.6));
      } else {
        og.fillText('！',cx,cy);
      }
      og.textAlign='left';og.textBaseline='alphabetic';
    }
    // 斬撃
    if(S.slash){
      const k=1-S.slash.t/0.35;
      const yBase=S.slash.dodged?OH*0.8:OH*0.45;
      og.strokeStyle=`rgba(245,241,232,${(1-k)*0.95})`;
      og.lineWidth=9*(1-k*0.5);og.lineCap='round';
      og.beginPath();og.moveTo(OW*0.12+k*40,yBase-OH*0.16);og.lineTo(OW*0.88-k*40,yBase+OH*0.13);og.stroke();
      og.lineWidth=4*(1-k*0.5);
      og.beginPath();og.moveTo(OW*0.22+k*40,yBase-OH*0.2);og.lineTo(OW*0.92-k*40,yBase+OH*0.06);og.stroke();
      if(S.slash.dodged&&k<0.5){
        og.fillStyle='rgba(90,211,138,.95)';og.font=`700 ${Math.max(28,Math.round(OH*0.07))}px DotGothic16`;
        og.textAlign='center';og.fillText('スカした！',OW/2,OH*0.64);og.textAlign='left';
      }
    }
    drawHands(t);
    // ビネット
    const vig=og.createRadialGradient(OW/2,OH/2,OH*0.38,OW/2,OH/2,OH*0.85);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.5)');
    og.fillStyle=vig;og.fillRect(0,0,OW,OH);
    // ポップアップ
    og.textAlign='center';
    for(const p of S.popups){
      og.font=`700 ${Math.max(22,Math.round(OH*0.055))}px DotGothic16`;
      og.fillStyle=p.red?`rgba(229,83,60,${Math.min(1,p.life)})`:`rgba(255,197,61,${Math.min(1,p.life)})`;
      og.fillText(p.txt,p.rx*OW,p.ry*OH);
    }
    og.textAlign='left';
    if(S.redFlash>0){
      const rg=og.createRadialGradient(OW/2,OH/2,OH*0.2,OW/2,OH/2,OH*0.8);
      rg.addColorStop(0,'rgba(229,83,60,0)');rg.addColorStop(1,`rgba(229,83,60,${S.redFlash*0.9})`);
      og.fillStyle=rg;og.fillRect(0,0,OW,OH);
    }
    if(S.paused){
      og.fillStyle='rgba(8,4,2,.55)';og.fillRect(0,0,OW,OH);
    }
    if(S.scene==='play'&&S.countdown>0){
      og.fillStyle='rgba(3,2,1,.6)';og.fillRect(0,0,OW,OH);
      og.textAlign='center';
      og.font=`700 ${Math.max(80,Math.round(OH*0.2))}px DotGothic16`;og.fillStyle='#FFC53D';
      const n=Math.ceil(S.countdown-0.6);
      og.fillText(n>0?String(n):'GO!',OW/2,OH/2+40);
      og.textAlign='left';
    }
  }
  /* ---- FPSの両手（ドット絵・チャンキー描画） ---- */
  const pickC=(()=>{  // ピッケル（両手持ち）48x44 → 拡大
    const c=document.createElement('canvas');c.width=52;c.height=46;
    const x=c.getContext('2d');
    const P=(col,...rects)=>{x.fillStyle=col;for(const[a,b,w,h]of rects)x.fillRect(a,b,w,h);};
    // 柄（斜め）
    for(let i=0;i<26;i++)P('#7a5a2e',[12+i,40-i,4,3]);
    for(let i=0;i<26;i++)P('#5c421e',[12+i,42-i,2,1]);
    // ヘッド
    P('#12100c',[28,6,20,4],[24,8,8,4],[44,8,6,4],[30,4,14,2]);
    P('#c8c2b4',[29,7,18,2],[25,9,6,2],[45,9,4,2],[31,5,12,1]);
    P('#8a8270',[29,9,18,1],[36,11,6,2]);
    // グローブの手
    P('#12100c',[16,30,12,10],[26,22,11,9]);
    P('#6b4a26',[17,31,10,8],[27,23,9,7]);
    P('#f0cda8',[19,33,6,4],[29,25,5,3]);
    return c;
  })();
  const lantC=(()=>{  // ランタンを持つ手 30x36
    const c=document.createElement('canvas');c.width=30;c.height=38;
    const x=c.getContext('2d');
    const P=(col,...rects)=>{x.fillStyle=col;for(const[a,b,w,h]of rects)x.fillRect(a,b,w,h);};
    P('#12100c',[8,0,14,2],[6,2,4,6],[20,2,4,6]);       // 吊り手
    P('#12100c',[6,8,18,3]);                            // 上蓋
    P('#4a351e',[7,9,16,1]);
    P('#12100c',[7,11,3,14],[20,11,3,14]);              // 枠
    P('#ffe9b0',[10,11,10,14]);                         // ガラス
    P('#ffc53d',[11,14,8,9]);
    P('#ff8a3d',[12,17,6,6]);
    P('#12100c',[6,25,18,3]);                           // 底
    P('#6b4a26',[10,28,12,8]);                          // 手首
    P('#f0cda8',[12,26,8,4]);
    return c;
  })();
  function drawHands(t){
    const bob=Math.sin(S.char.walkPh)*7*Math.min(1,S.v)+Math.sin(t*1.3)*2;
    const sc=Math.max(3.4,OH/150);
    // 左：ランタン
    og.save();
    og.translate(OW*0.09,OH-lantC.height*sc*0.72+bob);
    og.rotate(Math.sin(t*2+S.char.walkPh*0.5)*0.06);
    og.imageSmoothingEnabled=false;
    og.drawImage(lantC,0,0,lantC.width*sc*0.8,lantC.height*sc*0.8);
    og.restore();
    // ランタンの光だまり
    const lgx=OW*0.09+lantC.width*sc*0.4,lgy=OH-lantC.height*sc*0.4+bob;
    const lg=og.createRadialGradient(lgx,lgy,4,lgx,lgy,OH*0.22);
    lg.addColorStop(0,'rgba(255,220,140,.22)');lg.addColorStop(1,'rgba(255,220,140,0)');
    og.fillStyle=lg;og.beginPath();og.arc(lgx,lgy,OH*0.22,0,7);og.fill();
    // 右：ピッケル（スクワットでフルスイング）
    const k=S.char.attack>0?1-S.char.attack/0.32:0;
    og.save();
    const px0=OW*0.72,py0=OH+30;
    og.translate(px0,py0+bob*0.7);
    const swing=S.char.attack>0? (0.5-2.2*Math.sin(k*Math.PI)) : (0.28+Math.sin(t*1.6)*0.03);
    og.rotate(swing);
    og.imageSmoothingEnabled=false;
    og.drawImage(pickC,-pickC.width*sc*0.5,-pickC.height*sc,pickC.width*sc,pickC.height*sc);
    // スイング残像
    if(S.char.attack>0&&k>0.15&&k<0.85){
      og.strokeStyle=`rgba(245,241,232,${0.5*(1-Math.abs(k-0.5)*2)})`;
      og.lineWidth=8;og.lineCap='round';
      og.beginPath();og.arc(0,0,pickC.height*sc*0.9,-2.4,-1.1);og.stroke();
    }
    og.restore();
  }

  fit();
  applyTheme(1);
  return {render,resetWorld,rockDamage,rockExplode,rockFall,sealDamage,sealBreak,dashCrumble,
    springFill,springBurst,fit};
})();

/* ---------------- メインループ ---------------- */
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const t=now/1000;
  update(dt);
  G3.render(t,dt);
  const st=$('#camStatus');
  if(S.mode==='camera'&&S.scene==='play'){
    const miss=[];
    for(let i=0;i<S.np;i++) if(!POSE.P[i].visible) miss.push('P'+(i+1));
    const amb=S.np>1&&(POSE.slots[0].amb||POSE.slots[1].amb);
    if(S.np>1&&POSE.gapWarn){
      st.textContent='2人が近すぎます — 離れて立ち直してください';
      st.classList.add('warn');
    } else if(amb){
      st.textContent='どちらか判別できません — もとの立ち位置へ戻ってください';
      st.classList.add('warn');
    } else if(miss.length){
      st.textContent=(S.np>1?miss.join('・')+'が':'')+'見えません — 全身が映る位置へ';
      st.classList.add('warn');
    } else {
      st.textContent=(camMode==='mini')
        ? (S.np>1?'P1（黄）／P2（緑） 検出中':'検出中')
        : (S.np>1?'P1（黄・左）とP2（緑・右）を検出中':'検出中：足踏み／スクワット／ジャンプ');
      st.classList.remove('warn');
    }
  }
  requestAnimationFrame(loop);
}
screenMenu();
requestAnimationFrame(loop);
</script>
