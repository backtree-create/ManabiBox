<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>STONE QUEST ―科学で文明を取りもどせ―</title>
<link rel="icon" href="../../icon-192.png" type="image/png">
<style>
  :root{
    --bg:#0b0f14; --panel:#151d26; --panel2:#1d2833; --panel3:#243240;
    --lineSolid:#31435588; --edge:#3a4e62;
    --text:#e8eef4; --dim:#8fa6ba; --accent:#4fd1c5; --gold:#f0c34e;
    --hp:#e05555; --hpbg:#3a1c1c; --good:#7fd08f; --bad:#e08080;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #16222e 0%, transparent 60%),
      radial-gradient(900px 400px at 90% 110%, #10202033 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"DotGothic16","MS Gothic","ＭＳ ゴシック","Meiryo",monospace;
    display:flex; justify-content:center; padding:10px;
    min-height:100vh;
    /* iOS Safari: アドレスバー分のずれを防ぎ、ページ全体はスクロールさせない(サイドバー・オーバーレイ内で縦スクロール) */
    height:100vh; height:100dvh; overflow:hidden;
    overscroll-behavior:none;
    padding-left:calc(10px + env(safe-area-inset-left)); padding-right:calc(10px + env(safe-area-inset-right));
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  html{ height:100%; }
  #app{ width:1280px; max-width:100%; display:flex; flex-direction:column; height:100%; }
  /* タッチ端末: ダブルタップ拡大・長押しの文字選択を抑止 */
  button, a{ touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body.touch #cvWrap, body.touch #keyHint, body.touch header{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  /* まなびの基板の「もどる」ボタン(左上固定)とタイトルが重ならないようにする */
  body:has(#manabi-back) header{ padding-left:128px; }

  /* ---- ヘッダー ---- */
  header{
    display:flex; align-items:center; gap:14px; padding:8px 14px;
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border:2px solid var(--edge); border-radius:4px;
    box-shadow:0 4px 0 rgba(0,0,0,.4);
    margin-bottom:8px;
  }
  header h1{
    font-size:21px; letter-spacing:3px; color:var(--gold);
    text-shadow:0 0 12px rgba(240,195,78,.45), 2px 2px 0 #4a3608;
  }
  header .sub{ font-size:11px; color:var(--dim); letter-spacing:1px; }
  #civ{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  #eraName{
    color:var(--accent); font-size:13px; letter-spacing:1px;
    background:#12303080; border:1px solid #2a5a56; border-radius:3px; padding:3px 10px;
    white-space:nowrap;
  }
  #civBar{
    width:220px; height:14px; background:#101820;
    border:1px solid var(--edge); border-radius:3px; overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }
  #civFill{
    height:100%; width:0%;
    background:repeating-linear-gradient(45deg, #4fd1c5 0 10px, #3ab4a8 10px 20px);
    background-size:28px 28px;
    animation:stripes 1.2s linear infinite;
    transition:width .5s ease;
    box-shadow:0 0 8px rgba(79,209,197,.5);
  }
  @keyframes stripes{ to{ background-position:28px 0; } }
  #civPct{ font-size:12px; color:var(--dim); width:42px; }
  #muteBtn, #hubBtn{
    font-size:15px; padding:4px 9px; line-height:1;
    background:var(--panel3); border:2px solid var(--edge); border-radius:4px;
    color:var(--text); cursor:pointer;
  }
  @media (hover:hover){
    #muteBtn:hover, #hubBtn:hover{ border-color:var(--accent); color:var(--accent); }
  }
  #hubBtn{
    font-size:12px; text-decoration:none;
    display:none; align-items:center; gap:5px; padding:6px 10px;
    white-space:nowrap;
  }
  #hubBtn.show{ display:flex; }

  /* ---- メイン ---- */
  #main{ display:flex; gap:8px; flex:1; min-height:0; }
  #cvWrap{
    position:relative; flex:0 0 auto; border-radius:4px; overflow:hidden;
    border:2px solid var(--edge); box-shadow:0 6px 0 rgba(0,0,0,.4);
  }
  canvas{ background:#000; display:block; image-rendering:pixelated; }
  #cvWrap::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, transparent 2px 4px);
  }
  #keyHint{
    font-size:11px; color:var(--dim); margin-top:6px; line-height:1.8;
  }
  #keyHint b{ color:var(--text); background:var(--panel3); border:1px solid var(--edge);
    border-radius:3px; padding:1px 6px; font-weight:normal; }

  /* ---- サイドバー ---- */
  aside{ flex:1; min-width:280px; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; font-size:13px; -webkit-overflow-scrolling:touch; }
  aside .panel{ flex-shrink:0; }
  .panel{
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border:2px solid var(--edge); border-radius:4px; padding:10px;
    box-shadow:0 4px 0 rgba(0,0,0,.35);
  }
  .panel h3{
    font-size:11px; color:var(--accent); letter-spacing:2px;
    margin-bottom:7px; border-bottom:1px solid var(--lineSolid); padding-bottom:4px;
  }
  #hpBar{
    height:16px; background:var(--hpbg); border:1px solid var(--edge); border-radius:3px;
    overflow:hidden; margin-bottom:5px; box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
  }
  #hpFill{
    height:100%; width:100%;
    background:linear-gradient(180deg, #f07060, #d04040);
    transition:width .25s ease;
  }
  #hpFill.low{ animation:hpblink .5s steps(2) infinite; }
  @keyframes hpblink{ 50%{ filter:brightness(1.8); } }
  #hpText,#statText,#equipText{ font-size:12px; line-height:1.7; }
  #equipText{ color:var(--dim); }

  .btns{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  button{
    font-family:inherit; font-size:12px; color:var(--text);
    background:linear-gradient(180deg, var(--panel3), var(--panel2));
    border:2px solid var(--edge); border-radius:4px;
    padding:7px 12px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.45);
    transition:border-color .12s, color .12s, transform .05s;
  }
  @media (hover:hover){
    button:hover{ border-color:var(--accent); color:var(--accent); }
    button:disabled:hover{ border-color:var(--edge); color:var(--text); }
  }
  button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.45); }
  button:disabled{ opacity:.4; cursor:default; transform:none; }
  button.primary{
    border-color:var(--gold); color:var(--gold);
    box-shadow:0 3px 0 rgba(0,0,0,.45), 0 0 10px rgba(240,195,78,.15);
  }
  @media (hover:hover){
    button.primary:hover{ background:linear-gradient(180deg,#2e3a2a,#243020); color:#ffe08a; }
  }
  /* タッチ端末ではボタンのタップ領域を確保し、小さな説明文を少し大きくする */
  body.touch button:not(#padWrap button){ min-height:44px; }
  body.touch #keyHint, body.touch .areaCard .adesc, body.touch .techCard .tname .topic,
  body.touch #obox h2 .tag, body.touch header .sub{ font-size:12px; }

  #matList{ display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; font-size:12px; }
  .matRow{ display:flex; justify-content:space-between; border-bottom:1px dashed #2a3a4a55; padding-bottom:2px; }
  .matRow .n{ color:var(--dim); }
  #log{ font-size:12px; line-height:1.8; color:var(--dim); min-height:120px; }
  #log div{ transition:opacity .3s; }
  #log div:nth-child(1){ color:var(--text); }
  #log div:nth-child(n+5){ opacity:.55; }
  #log div:nth-child(n+7){ opacity:.35; }

  /* ---- オーバーレイ ---- */
  #overlay{
    position:fixed; inset:0; background:rgba(5,9,13,.82);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:10;
  }
  #overlay.hidden{ display:none; }
  #obox{
    width:740px; max-width:94vw; max-height:92vh; max-height:92dvh; overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    background:linear-gradient(180deg, #1a2530, #141c25);
    border:2px solid var(--edge); border-radius:6px; padding:22px;
    box-shadow:0 10px 0 rgba(0,0,0,.4), 0 0 40px rgba(0,0,0,.6);
    animation:pop .16s ease-out;
  }
  @keyframes pop{ from{ transform:scale(.96) translateY(6px); opacity:0; } }
  #obox::-webkit-scrollbar{ width:10px; }
  #obox::-webkit-scrollbar-thumb{ background:var(--panel3); border-radius:5px; }
  #obox h2{
    color:var(--gold); font-size:17px; margin-bottom:12px; letter-spacing:1px;
    text-shadow:1px 1px 0 #3a2c08;
  }
  #obox h2 .tag{ font-size:11px; color:var(--dim); margin-left:8px; letter-spacing:0; text-shadow:none; }
  #obox p{ font-size:13px; line-height:1.95; margin-bottom:10px; }
  #obox .dim{ color:var(--dim); font-size:12px; }
  .titleLogo{ text-align:center; padding:34px 0 14px; }
  .titleLogo .big{
    font-size:44px; color:var(--gold); letter-spacing:8px;
    text-shadow:0 0 24px rgba(240,195,78,.4), 3px 3px 0 #503a10, 6px 6px 0 rgba(0,0,0,.4);
    animation:floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{ 50%{ transform:translateY(-4px); } }
  .titleLogo .small{ font-size:14px; color:var(--accent); margin-top:12px; letter-spacing:3px; }
  .center{ text-align:center; }
  /* ---- 学年ピル(タイトル画面) ---- */
  .gradeSel{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .gradeSel .dim{ margin-right:4px; }
  button.gradePill{ min-width:64px; min-height:44px; font-size:14px; padding:8px 14px; }
  button.gradePill.on{ background:linear-gradient(180deg,#2e3a2a,#243020); color:#ffe08a; }
  #obox h2 .gradeTag{ color:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:1px 6px; }

  /* ---- カード ---- */
  .techCard{
    border:2px solid var(--edge); border-left-width:5px;
    background:linear-gradient(180deg, var(--panel3), var(--panel2));
    border-radius:4px; padding:11px 12px; margin-bottom:9px;
    transition:border-color .15s, transform .1s;
  }
  @media (hover:hover){ .techCard:hover{ border-color:#4a6a86; } }
  .techCard.done{ border-left-color:#3f8f4f; }
  .techCard.locked{ opacity:.6; border-left-color:#2a3644; }
  .techCard.mystery{ opacity:.75; border-left-color:#3a3050; background:linear-gradient(180deg,#20283a,#1a2130); }
  .techCard .tname{ font-size:14px; }
  .techCard .tname .topic{ font-size:11px; color:var(--accent); margin-left:8px; }
  .techCard .tdesc{ font-size:12px; color:var(--dim); margin:5px 0; line-height:1.7; }
  .techCard .tcost{ font-size:12px; margin:5px 0 7px; }
  .techCard .ok{ color:var(--good); }
  .techCard .ng{ color:var(--bad); }
  .eraHead{
    color:var(--gold); font-size:13px; letter-spacing:1px;
    margin:16px 0 8px; border-bottom:1px dashed #4a5a6a66; padding-bottom:4px;
  }

  /* ---- クイズ ---- */
  .qChoice{
    display:block; width:100%; text-align:left; margin-bottom:9px; padding:11px 14px; font-size:13px;
  }
  @media (hover:hover){ .qChoice:hover{ background:linear-gradient(180deg,#254050,#1d3240); } }
  .qResult{ font-size:16px; margin:12px 0; letter-spacing:1px; }
  .qResult.good{ color:var(--good); text-shadow:0 0 10px rgba(127,208,143,.4); }
  .qResult.bad{ color:var(--bad); }
  .qExpl{
    background:#12303055; border:1px solid #2a5a5644; border-left:4px solid var(--accent);
    border-radius:0 4px 4px 0; padding:12px; font-size:13px; line-height:1.9; margin-bottom:12px;
  }
  .qProg{ font-size:12px; color:var(--dim); margin-bottom:10px; }

  table.rec{ width:100%; border-collapse:collapse; font-size:12px; }
  table.rec th, table.rec td{ border:1px solid var(--edge); padding:6px 9px; text-align:left; }
  table.rec th{ background:var(--panel3); color:var(--accent); letter-spacing:1px; }
  table.rec tr:nth-child(even) td{ background:#1a242e; }

  .areaCard{
    border:2px solid var(--edge); border-radius:4px;
    background:linear-gradient(180deg, var(--panel3), var(--panel2));
    padding:12px; margin-bottom:9px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    transition:border-color .15s;
  }
  @media (hover:hover){ .areaCard:hover{ border-color:#4a6a86; } }
  .areaCard.locked{ opacity:.5; }
  .areaCard .aname{ font-size:14px; }
  .areaCard .adesc{ font-size:11px; color:var(--dim); margin-top:4px; line-height:1.6; }

  /* ---- タッチ操作(バーチャルパッド) ---- */
  #padWrap{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    display:none; justify-content:space-between; align-items:flex-end;
    padding:12px; pointer-events:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  body.touch #padWrap.on{ display:flex; }
  #padWrap button{
    pointer-events:auto; touch-action:none;
    background:rgba(21,29,38,.72); border:2px solid rgba(110,140,170,.65);
    border-radius:14px; color:var(--text); font-size:20px; line-height:1; padding:0;
    box-shadow:0 3px 0 rgba(0,0,0,.4);
  }
  #padWrap button:active{ background:rgba(79,209,197,.28); border-color:var(--accent); }
  #dpad{
    display:grid; gap:5px;
    grid-template-columns:54px 54px 54px; grid-template-rows:54px 54px 54px;
  }
  #dpad .u{ grid-column:2; grid-row:1; }
  #dpad .l{ grid-column:1; grid-row:2; }
  #dpad .r{ grid-column:3; grid-row:2; }
  #dpad .d{ grid-column:2; grid-row:3; }
  #sideBtns{ display:flex; flex-direction:column; gap:10px; align-items:center; }
  #sideBtns .mini{ width:48px; height:48px; border-radius:50%; font-size:18px; }
  #atkBtn{ width:74px; height:74px; border-radius:50%; font-size:28px; border-color:var(--gold); }

  /* 横幅がキャンバス+サイドバーに足りない場合(タブレット横向き等)はキャンバスを縮める */
  @media (max-width:1300px){
    #cvWrap{ flex:1 1 auto; min-width:0; }
    canvas{ width:100%; height:auto; }
    aside{ flex:0 0 280px; }
  }
  @media (max-width:1000px){
    #main{ flex-direction:column; }
    #main > div:first-child{ flex-shrink:0; }
    aside{ flex:1 1 auto; }
    canvas{ width:100%; height:auto; }
    header{ flex-wrap:wrap; row-gap:8px; padding:8px 10px; }
    header h1{ font-size:18px; }
    #civ{ width:100%; margin-left:0; }
    #civBar{ flex:1; width:auto; }
    #obox{ padding:16px; }
    .qChoice{ padding:13px 14px; }
    button{ padding:9px 13px; }
    .titleLogo .big{ font-size:32px; letter-spacing:5px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>STONE QUEST</h1>
    <div class="sub">―科学で文明を取りもどせ―</div>
    <div id="civ">
      <span id="eraName">原始時代</span>
      <div id="civBar"><div id="civFill"></div></div>
      <span id="civPct">0%</span>
      <button id="muteBtn" onclick="G.toggleMute()" title="音のON/OFF">🔊</button>
      <a id="hubBtn" title="まなびの基板にもどる">🏫 基板にもどる</a>
    </div>
  </header>
  <div id="main">
    <div>
      <div id="cvWrap"><canvas id="cv" width="960" height="600"></canvas>
        <div id="padWrap">
          <div id="dpad">
            <button class="u" data-dir="up" aria-label="上">▲</button>
            <button class="l" data-dir="left" aria-label="左">◀</button>
            <button class="r" data-dir="right" aria-label="右">▶</button>
            <button class="d" data-dir="down" aria-label="下">▼</button>
          </div>
          <div id="sideBtns">
            <button id="padHerb" class="mini" aria-label="薬草をつかう">🌿</button>
            <button id="padMed" class="mini" aria-label="薬をつかう">💊</button>
            <button id="atkBtn" aria-label="武器こうげき">⚔</button>
          </div>
        </div>
      </div>
      <div id="keyHint"><b>矢印 / WASD</b> 移動・ぶつかって攻撃/採取　<b>スペース / Z</b> 向いている方向に武器こうげき</div>
    </div>
    <aside>
      <div class="panel">
        <h3>STATUS</h3>
        <div id="hpBar"><div id="hpFill"></div></div>
        <div id="hpText"></div>
        <div id="statText"></div>
        <div id="equipText"></div>
        <div class="btns" id="dgBtns">
          <button onclick="G.useHerb()">薬草をつかう <span id="herbCt"></span></button>
          <button onclick="G.useMedicine()">薬をつかう <span id="medCt"></span></button>
          <button onclick="G.leaveDungeon()" id="leaveBtn">⛺ 拠点にもどる</button>
        </div>
      </div>
      <div class="panel">
        <h3>持っている素材</h3>
        <div id="matList"></div>
      </div>
      <div class="panel" style="flex:1">
        <h3>メッセージ</h3>
        <div id="log"></div>
      </div>
    </aside>
  </div>
</div>

<div id="overlay" class="hidden"><div id="obox"></div></div>

<!-- まなびの基板(ManabiBox)連携。オフラインや単体配布でも読み込み失敗するだけでゲームは動く -->
<script src="../../config.js"></script>
<script src="../../hub-progress.js"></script>
<script src="../../manabi-connect.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
