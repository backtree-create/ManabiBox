<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まなびの基板</title>
<meta name="theme-color" content="#0B0F1A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.who{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:.04em;}
.who b{color:var(--c-teal);font-weight:500;}

/* ── つづきから ─────────────────────────── */
.hero{display:flex;flex-direction:column;gap:18px;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;}
.hero-top span{font-family:"Outfit",sans-serif;font-size:11.5px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.hero-top b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:34px;
  line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
.hero-next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-top:1px solid var(--rule);padding-top:16px;}
.hero-next .lbl{font-size:13px;color:var(--muted);}
.hero-next .ttl{font-weight:700;font-size:16px;}
.hero-next .btn{margin-left:auto;}

/* ── ゲーム一覧 ─────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media (max-width:660px){.grid{grid-template-columns:1fr;}}

.card{
  display:flex;flex-direction:column;gap:12px;
  text-decoration:none;color:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.058),rgba(255,255,255,.018));
  border:1px solid var(--edge);border-radius:var(--r);
  padding:20px 20px 18px;position:relative;overflow:hidden;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:var(--accent);opacity:.75;
}
.card:hover{transform:translateY(-3px);border-color:rgba(190,205,235,.3);}
.card-top{display:flex;align-items:center;gap:12px;}
.chip{
  width:42px;height:42px;flex:none;border-radius:12px;
  display:grid;place-items:center;color:var(--accent);
  background:rgba(190,205,235,.08);
  background:color-mix(in srgb, var(--accent) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);
}
.ico{width:22px;height:22px;}
.subject{font-family:"Outfit",sans-serif;font-size:11px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent);}
.card h3{margin:2px 0 0;font-size:19px;font-weight:700;letter-spacing:.01em;color:#fff;}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.7;flex:1;}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-family:"Outfit",sans-serif;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;}
.cta{display:flex;align-items:center;gap:7px;font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:700;font-size:14px;color:var(--accent);}
.cta svg{width:15px;height:15px;}
.card:hover .cta svg{transform:translateX(3px);}
.cta svg{transition:transform .2s;}

/* ── ニックネーム ───────────────────────── */
.namecard{border-color:var(--c-teal);margin-bottom:26px;}
.namecard h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:19px;
  margin:0 0 4px;color:#fff;}
.namecard p{margin:0 0 14px;font-size:13.5px;color:var(--muted);}
.namerow{display:flex;gap:10px;flex-wrap:wrap;}
.namerow input{flex:1;min-width:160px;}

/* ── ランキング ─────────────────────────── */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.tab{border:1px solid var(--edge);background:none;color:var(--muted);cursor:pointer;
  border-radius:99px;padding:6px 15px;font-family:inherit;font-size:13px;transition:.15s;}
.tab:hover{color:var(--paper);}
.tab[aria-selected="true"]{background:var(--paper);border-color:var(--paper);color:#0A0E17;font-weight:700;}
.ranklist{list-style:none;margin:0;padding:0;}
.ranklist li{display:flex;align-items:center;gap:14px;padding:11px 12px;
  border-top:1px solid var(--rule);font-size:14.5px;border-radius:8px;}
.ranklist li.me{background:rgba(53,224,210,.1);}
.rk{font-family:"Outfit",sans-serif;font-weight:600;font-size:14px;color:var(--muted);
  min-width:30px;text-align:right;font-variant-numeric:tabular-nums;}
.ranklist li.top .rk{color:var(--c-teal);font-size:19px;}
.nm{flex:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc{font-family:"Outfit",sans-serif;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
.foot-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">
    <span>Manabi Box</span>
    <span class="who"><b id="whoName"></b>
      <button class="linkbtn" id="editName" type="button">名前をかえる</button></span>
  </div>

  <h1>今日は、<span class="hl">どれを進める</span></h1>
  <p class="lede">やったぶんだけマーカーが伸びます。とちゅうで閉じても、進み具合はちゃんと残ります。</p>

  <section class="sheet namecard hidden" id="nameCard">
    <h2>ニックネームを決めよう</h2>
    <p>ランキングにこの名前が出ます。本名は入れないでください。</p>
    <div class="namerow">
      <input id="nameInput" type="text" maxlength="10" placeholder="10文字まで" autocomplete="off">
      <button class="btn" id="saveName" type="button">きめる</button>
    </div>
  </section>

  <section class="sheet hero">
    <div class="hero-top">
      <span>ぜんぶの進み具合</span>
      <b class="num" id="pct">0%</b>
    </div>
    <div class="marker" style="--accent:var(--c-teal)"><i id="totalBar"></i></div>
    <div class="hero-next" id="heroNext"></div>
  </section>

  <div class="rule"><h2>Library</h2></div>
  <div class="grid" id="grid"></div>

  <div class="rule"><h2>Ranking</h2></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <ul class="ranklist" id="ranklist"></ul>
  <p class="msg" id="rankNote"></p>

  <div class="rule"><h2>Record</h2></div>
  <div id="logBody"></div>
  <div class="foot-row">
    <button class="btn ghost small" id="resetBtn" type="button">この端末の記録を消す</button>
    <a class="linkbtn" href="manage.html">ゲームを追加する</a>
  </div>

  <footer>Manabi Box</footer>
</div>

<script src="config.js"></script>
<script src="icons.js"></script>
<script src="hub-progress.js"></script>
<script>
/* apps.json も読めなかったときだけ使う控え */
const DEFAULT_APPS = [
  { key:'electricity', name:'電気分野 3D LAB', subject:'理科', file:'electronic.html',
    desc:'クルックス管からオームの法則まで、3Dでさわって確かめる実験室。',
    unit:'モード', total:6, color:'#35E0D2', icon:'bolt' },
  { key:'english-go', name:'英語でGO!', subject:'英語', file:'https://backtree-create.github.io/English_de_GO/',
    desc:'日本語の意味を見て、制限時間内にスペルを打ちこむ単語ゲーム。',
    unit:'ステージ', total:4, color:'#8B7CFF', icon:'letters' },
  { key:'idiom-dungeon', name:'熟語の迷宮', subject:'英語', file:'idiom-dungeon.html',
    desc:'パーツを合成して熟語をつくり、迷宮の地下を進むダンジョンRPG。',
    unit:'コース', total:3, color:'#FFA24C', icon:'maze' },
  { key:'japan-quest', name:'日本一周クエスト', subject:'5教科', file:'https://backtree-create.github.io/Resque_Japn/',
    desc:'北海道から九州まで、5教科の問題を解きながら日本を旅するドット絵RPG。',
    unit:'エリア', total:12, color:'#4ADE80', icon:'map' },
  { key:'science-quest', name:'サイエンスクエスト', subject:'理科', file:'science-quest.html',
    desc:'物理・化学・生物・地学の問題でモンスターと戦う、1コマ完結のRPG。',
    unit:'階層', total:5, color:'#FF6B9D', icon:'flask' },
  { key:'chrono-domino', name:'クロノ・ドミノ', subject:'社会', file:'chrono-domino.html',
    desc:'歴史上の出来事を原因から結果へ並べ、全60章の因果関係をつなぐ歴史ゲーム。',
    unit:'章', total:60, color:'#C23A20', icon:'clock' },
  { key:'equation-balance', name:'数式ラボ', subject:'数学', file:'equation-balance.html',
    desc:'一次方程式・連立方程式・因数分解を、操作とスコアアタックで攻略する数式ゲーム。',
    unit:'ステージ', total:64, color:'#F0B429', icon:'bolt' },
  { key:'resba-response', name:'レスバ・レスポンス', subject:'国語', file:'resba-response.html',
    desc:'証言の文法・敬語・論理の破綻を見抜き、異議を唱えて証人を攻略する国語ゲーム。',
    unit:'証人', total:6, color:'#BD8C3F', icon:'pen' },
  { key:'geometry-forge', name:'図形設計室', subject:'数学', file:'geometry-forge.html',
    desc:'平面変換、積み木の空間把握、立方体の展開図を3種類の操作で攻略する図形ゲーム。',
    unit:'問題', total:84, color:'#48D4D0', icon:'cube' },
  { key:'algorithm-factory', name:'ロジック鉄道', subject:'情報', file:'algorithm-factory.html',
    desc:'命令を運行表へ並べ、順次・反復・条件分岐で列車を全駅経由の終着駅へ導くプログラミングゲーム。',
    unit:'路線', total:18, color:'#CE3F2E', icon:'bolt' },
  { key:'ecosystem-keeper', name:'生態系管理局', subject:'理科', file:'ecosystem-keeper.html',
    desc:'個体数と環境変化を観測し、保全策を選んで食物網を安定させる生態系シミュレーション。',
    unit:'地域', total:12, color:'#69D477', icon:'globe' },
  { key:'zero-line', name:'ZERO LINE', subject:'数学', file:'zero-line.html',
    desc:'数直線上のコアを動かし、正負の数の加法・減法を攻略する60秒スコアアタック。',
    unit:'ライン', total:20, color:'#65E9FF', icon:'target' },
  { key:'appraiser', name:'贋作鑑定士', subject:'美術', file:'appraiser.html',
    desc:'本物の名画は1点だけ。贋作を見抜き、オークションで高額落札を狙うドット3D鑑定ゲーム。31作品からランダム出題。',
    unit:'pt', total:21000, color:'#C9A227', icon:'star' }
];

const $ = id => document.getElementById(id);
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/></svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let APPS = LearnHub.appsCached() || DEFAULT_APPS;
let currentTab = 'total';

/* ---- ニックネーム ---------------------------------------- */
function paintWho(){
  const me = LearnHub.player();
  $('whoName').textContent = me.nickname || '名前なし';
  $('nameCard').classList.toggle('hidden', !!me.nickname);
}
$('saveName').addEventListener('click', () => {
  const v = $('nameInput').value.trim();
  if (!v){ $('nameInput').focus(); return; }
  LearnHub.setNickname(v); paintWho();
});
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveName').click(); });
$('editName').addEventListener('click', () => {
  $('nameCard').classList.remove('hidden');
  $('nameInput').value = LearnHub.player().nickname || '';
  $('nameInput').focus();
});

/* ---- 一覧 ------------------------------------------------- */
const label = (done, total) => done <= 0 ? 'はじめる' : (done >= total ? 'もう一度' : 'つづける');

function render(){
  const saved = LearnHub.all();
  let doneSum = 0, totalSum = 0;

  $('grid').innerHTML = APPS.map(app => {
    const rec  = saved[app.key] || { done:0, best:0 };
    const done = Math.min(rec.done || 0, app.total);
    doneSum += done; totalSum += app.total;
    const w = app.total ? done / app.total * 100 : 0;

    return `<a class="card" style="--accent:${esc(app.color)}" href="${esc(app.file)}">
      <div class="card-top">
        <span class="chip">${manabiIcon(app.icon)}</span>
        <span>
          <span class="subject">${esc(app.subject)}</span>
          <h3>${esc(app.name)}</h3>
        </span>
      </div>
      <p>${esc(app.desc)}</p>
      <div class="marker"><i data-w="${w}"></i></div>
      <div class="meta">
        <span>${done} / ${app.total} ${esc(app.unit)}</span>
        <span>${rec.best ? '最高 ' + rec.best : 'まだ記録なし'}</span>
      </div>
      <span class="cta">${label(done, app.total)}${ARROW}</span>
    </a>`;
  }).join('');

  const pct = totalSum ? Math.round(doneSum / totalSum * 100) : 0;
  $('pct').textContent = pct + '%';

  requestAnimationFrame(() => {
    $('totalBar').style.width = pct + '%';
    document.querySelectorAll('.card .marker i').forEach(el => { el.style.width = el.dataset.w + '%'; });
  });

  renderNext(saved);
  renderLog(saved);
}

function renderNext(saved){
  const scored = APPS.map(a => {
    const r = saved[a.key] || { done:0 };
    const done = Math.min(r.done || 0, a.total);
    return { app:a, done, ratio: a.total ? done / a.total : 1 };
  });
  const inProgress = scored.filter(s => s.ratio > 0 && s.ratio < 1).sort((a,b) => b.ratio - a.ratio)[0];
  const fresh = scored.filter(s => s.ratio === 0)[0];
  const pick = inProgress || fresh || scored.sort((a,b) => a.ratio - b.ratio)[0];
  if (!pick){ $('heroNext').innerHTML = ''; return; }

  $('heroNext').innerHTML = `
    <span class="lbl">${inProgress ? 'とちゅうまで進んでいます' : 'まだ手をつけていません'}</span>
    <span class="ttl">${esc(pick.app.name)}</span>
    <a class="btn" style="--accent:${esc(pick.app.color)}" href="${esc(pick.app.file)}">
      ${label(pick.done, pick.app.total)}</a>`;
}

function renderLog(saved){
  const rows = APPS.filter(a => saved[a.key] && saved[a.key].plays > 0);
  if (!rows.length){
    $('logBody').innerHTML = '<p class="msg">まだ記録がありません。上から1つ選んで遊ぶと、ここに結果が並びます。</p>';
    return;
  }
  $('logBody').innerHTML = `<table>
    <thead><tr><th>ゲーム</th><th style="text-align:right">進み</th>
      <th style="text-align:right">最高</th><th style="text-align:right">回数</th>
      <th style="text-align:right">最終</th></tr></thead>
    <tbody>${rows.map(app => {
      const r = saved[app.key], d = new Date(r.updated || Date.now());
      return `<tr><td class="head">${esc(app.name)}${r.note
          ? '<br><small style="color:var(--muted)">' + esc(r.note) + '</small>' : ''}</td>
        <td class="num">${Math.min(r.done || 0, app.total)}/${app.total}</td>
        <td class="num">${r.best || '—'}</td>
        <td class="num">${r.plays}</td>
        <td class="num">${(d.getMonth()+1)}/${d.getDate()}</td></tr>`;
    }).join('')}</tbody></table>`;
}

/* ---- ランキング ------------------------------------------- */
function buildTabs(){
  const tabs = [{ key:'total', name:'総合' }].concat(APPS.map(a => ({ key:a.key, name:a.name })));
  $('tabs').innerHTML = '';
  tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.setAttribute('role','tab');
    b.textContent = t.name;
    b.setAttribute('aria-selected', String(t.key === currentTab));
    b.addEventListener('click', () => { currentTab = t.key; buildTabs(); loadRanking(); });
    $('tabs').appendChild(b);
  });
}

function loadRanking(){
  const box = $('ranklist'), note = $('rankNote');
  if (!LearnHub.online()){
    box.innerHTML = '';
    note.textContent = 'スプレッドシートにつなぐと、みんなの順位がここに出ます。';
    return;
  }
  box.innerHTML = ''; note.textContent = 'よみこみ中';
  const myId = LearnHub.player().id;

  LearnHub.ranking(currentTab).then(data => {
    if (!data.ok || !data.list || !data.list.length){
      box.innerHTML = '';
      note.textContent = data.ok
        ? 'まだ誰も記録を出していません。いちばん乗りをねらおう。'
        : 'いまつながりません。あとでもう一度ひらいてください。';
      return;
    }
    box.innerHTML = data.list.map(r =>
      `<li class="${r.id === myId ? 'me ' : ''}${r.rank <= 3 ? 'top' : ''}">
        <span class="rk">${r.rank}</span>
        <span class="nm">${esc(r.nickname)}</span>
        <span class="sc">${r.score}</span></li>`).join('');
    const mine = data.list.find(r => r.id === myId);
    note.textContent = mine ? 'あなたは ' + mine.rank + ' 位です。' : 'まだ上位に入っていません。';
  });
}

/* ---- 起動 ------------------------------------------------- */
$('resetBtn').addEventListener('click', () => {
  if (confirm('この端末に残っている記録を消します。送信ずみのぶんは消えません。')){
    LearnHub.reset(); render();
  }
});

paintWho(); render(); buildTabs(); loadRanking();

/* 最新のゲーム一覧が取れたら差し替える */
LearnHub.apps().then(list => {
  if (list && list.length){ APPS = list; render(); buildTabs(); }
});

window.addEventListener('storage', render);
window.addEventListener('pageshow', () => { render(); loadRanking(); });
</script>
</body>
</html>
