<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラスの記録 — まなびの基板</title>
<meta name="theme-color" content="#0B0F1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
:root{--wrap:1060px;}
.setup .row{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;}
@media (max-width:720px){.setup .row{grid-template-columns:1fr;}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:26px 0 0;}
.kpi{border:1px solid var(--edge);border-radius:var(--r);padding:16px 18px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--accent);opacity:.8;}
.kpi span{display:block;font-family:"Outfit",sans-serif;font-size:11px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.kpi b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:30px;color:#fff;
  font-variant-numeric:tabular-nums;line-height:1.3;}

.panel{border:1px solid var(--edge);border-radius:var(--r);padding:20px 22px 14px;margin-bottom:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));}
.panel h3{font-family:"Outfit",sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin:0 0 16px;}
canvas{width:100%;display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:800px){.grid2{grid-template-columns:1fr;}}
.scroll{overflow-x:auto;}
th{cursor:pointer;}
th:hover{color:var(--paper);}
td{white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow"><span>Manabi Board / Class</span><a class="linkbtn" href="index.html">ハブにもどる</a></div>

  <h1>クラスの<span class="hl">記録</span></h1>
  <p class="lede">スプレッドシートに集まった記録を読み出します。この画面は先生用です。</p>

  <section class="sheet setup">
    <div class="row">
      <div>
        <label class="fieldname" for="ep">Apps Script の URL</label>
        <input id="ep" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div>
        <label class="fieldname" for="tk">先生用の合言葉</label>
        <input id="tk" type="password" placeholder="ADMIN_TOKEN">
      </div>
      <div><button class="btn" id="load" type="button">よみこむ</button></div>
    </div>
    <p class="msg" id="msg">URLと合言葉はこの端末にだけ保存されます。</p>
  </section>

  <div id="view" class="hidden">
    <div class="kpis" id="kpis"></div>

    <div class="rule"><h2>ゲームごと</h2></div>
    <div class="grid2">
      <div class="panel"><h3>平均スコア</h3><canvas id="cAvg" height="300"></canvas></div>
      <div class="panel"><h3>クリアした人の割合（%）</h3><canvas id="cClear" height="300"></canvas></div>
    </div>

    <div class="rule"><h2>日ごとのプレイ回数</h2></div>
    <div class="panel"><canvas id="cDaily" height="260"></canvas></div>

    <div class="rule"><h2>生徒ごと</h2></div>
    <div class="panel">
      <div class="scroll" id="table"></div>
      <p style="margin:18px 0 6px;"><button class="btn ghost small" id="csv" type="button">CSVで書き出す</button></p>
    </div>
  </div>

  <footer>Manabi Board</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#35E0D2','#8B7CFF','#FFA24C','#4ADE80','#FF6B9D','#7FB4FF','#F5D76E','#FF8A6B'];
const SAVE = 'manabi-console:v1';
let DATA = null, sortKey = 'total', sortAsc = false;
const jp = k => (DATA && DATA.names && DATA.names[k]) || k;

try {
  const s = JSON.parse(localStorage.getItem(SAVE) || '{}');
  $('ep').value = s.ep || ''; $('tk').value = s.tk || '';
} catch (e) {}

$('load').addEventListener('click', load);
if ($('ep').value && $('tk').value) load();

function say(text, warn){
  $('msg').textContent = text;
  $('msg').className = 'msg' + (warn ? ' warn' : '');
}

function load(){
  const ep = $('ep').value.trim(), tk = $('tk').value.trim();
  if (!ep || !tk){ say('URLと合言葉の両方を入れてください。', true); return; }
  localStorage.setItem(SAVE, JSON.stringify({ ep, tk }));
  say('よみこんでいます。');

  fetch(ep + '?mode=dashboard&token=' + encodeURIComponent(tk), { redirect:'follow' })
    .then(r => r.json())
    .then(d => {
      if (!d.ok){
        say(d.error === 'bad-token' ? '合言葉がちがいます。' : 'よみこめませんでした（' + d.error + '）', true);
        return;
      }
      DATA = d;
      say('最終よみこみ ' + new Date(d.at).toLocaleString('ja-JP'));
      $('view').classList.remove('hidden');
      draw();
    })
    .catch(() => say('つながりませんでした。URLと、ウェブアプリの公開設定を確かめてください。', true));
}

function draw(){
  const apps = DATA.apps || [], students = DATA.students || [];
  const avgAll = students.length
    ? Math.round(students.reduce((a, s) => a + s.total, 0) / students.length) : 0;

  $('kpis').innerHTML = [
    ['生徒の数', students.length, COLORS[0]],
    ['プレイ回数', DATA.records, COLORS[1]],
    ['平均 総合ポイント', avgAll, COLORS[2]],
    ['うごいたゲーム', apps.length, COLORS[3]]
  ].map(([k, v, c]) =>
    `<div class="kpi" style="--accent:${c}"><span>${k}</span><b>${v}</b></div>`).join('');

  bars($('cAvg'),   apps.map(a => ({ label: jp(a.app), value: a.avg })), 100);
  bars($('cClear'), apps.map(a => ({ label: jp(a.app), value: a.clearRate })), 100);
  line($('cDaily'), DATA.daily || []);
  table();
}

function prep(cv){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = Number(cv.getAttribute('height'));
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.font = '11px Outfit, sans-serif';
  return { g, w, h };
}

function axis(g, w, h, padL, padT, ch, top, padR){
  g.strokeStyle = 'rgba(190,205,235,.09)';
  g.fillStyle = '#8B95AE'; g.textAlign = 'right';
  for (let i = 0; i <= 4; i++){
    const y = padT + ch - ch * i / 4;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke();
    g.fillText(Math.round(top * i / 4), padL - 8, y + 4);
  }
}

function bars(cv, rows, max){
  const { g, w, h } = prep(cv);
  if (!rows.length){ g.fillStyle = '#8B95AE'; g.fillText('まだ記録がありません', 12, 26); return; }
  const padL = 38, padR = 10, padT = 14, padB = 80;
  const cw = w - padL - padR, ch = h - padT - padB;
  const top = max || Math.max(...rows.map(r => r.value), 1);
  axis(g, w, h, padL, padT, ch, top, padR);

  const bw = cw / rows.length;
  rows.forEach((r, i) => {
    const bh = Math.max(2, ch * (r.value / top));
    const x = padL + bw * i + bw * .22, width = bw * .56;
    const c = COLORS[i % COLORS.length];
    const grad = g.createLinearGradient(0, padT + ch - bh, 0, padT + ch);
    grad.addColorStop(0, c); grad.addColorStop(1, c + '55');
    g.fillStyle = grad;
    g.beginPath();
    if (g.roundRect) g.roundRect(x, padT + ch - bh, width, bh, [5, 5, 0, 0]);
    else g.rect(x, padT + ch - bh, width, bh);
    g.fill();

    g.fillStyle = '#EDF1FB'; g.textAlign = 'center'; g.font = '600 12px Outfit, sans-serif';
    g.fillText(r.value, x + width / 2, padT + ch - bh - 7);

    g.save();
    g.translate(x + width / 2, padT + ch + 14);
    g.rotate(-Math.PI / 5.5);
    g.fillStyle = '#8B95AE'; g.textAlign = 'right';
    g.font = '12px "Zen Kaku Gothic New", sans-serif';
    g.fillText(r.label, 0, 0);
    g.restore();
    g.font = '11px Outfit, sans-serif';
  });
}

function line(cv, rows){
  const { g, w, h } = prep(cv);
  if (!rows.length){ g.fillStyle = '#8B95AE'; g.fillText('まだ記録がありません', 12, 26); return; }
  const padL = 38, padR = 14, padT = 16, padB = 38;
  const cw = w - padL - padR, ch = h - padT - padB;
  const top = Math.max(...rows.map(r => r.plays), 1);
  axis(g, w, h, padL, padT, ch, top, padR);

  const step = rows.length > 1 ? cw / (rows.length - 1) : 0;
  const pt = i => [padL + step * i, padT + ch - ch * (rows[i].plays / top)];

  g.beginPath();
  rows.forEach((r, i) => { const [x, y] = pt(i); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.lineTo(padL + step * (rows.length - 1), padT + ch); g.lineTo(padL, padT + ch); g.closePath();
  const fill = g.createLinearGradient(0, padT, 0, padT + ch);
  fill.addColorStop(0, 'rgba(53,224,210,.28)'); fill.addColorStop(1, 'rgba(53,224,210,0)');
  g.fillStyle = fill; g.fill();

  g.beginPath();
  rows.forEach((r, i) => { const [x, y] = pt(i); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#35E0D2'; g.lineWidth = 2.4; g.lineJoin = 'round'; g.stroke();

  g.fillStyle = '#35E0D2';
  rows.forEach((r, i) => { const [x, y] = pt(i); g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); });

  g.fillStyle = '#8B95AE'; g.textAlign = 'center';
  const every = Math.ceil(rows.length / 10);
  rows.forEach((r, i) => { if (i % every === 0) g.fillText(r.date, pt(i)[0], h - 12); });
}

function table(){
  const apps = (DATA.apps || []).map(a => a.app);
  const val = (s, k) => k === 'nickname' ? s.nickname
    : k === 'total' ? s.total : k === 'plays' ? s.plays : (s.perApp[k] || 0);

  const rows = (DATA.students || []).slice().sort((a, b) => {
    const va = val(a, sortKey), vb = val(b, sortKey);
    const d = typeof va === 'string' ? String(va).localeCompare(vb, 'ja') : va - vb;
    return sortAsc ? d : -d;
  });

  if (!rows.length){ $('table').innerHTML = '<p class="msg">まだ記録がありません。</p>'; return; }

  const head = ['<th data-k="nickname">ニックネーム</th>',
                '<th data-k="total" style="text-align:right">総合</th>']
    .concat(apps.map(a => `<th data-k="${a}" style="text-align:right">${jp(a)}</th>`))
    .concat(['<th data-k="plays" style="text-align:right">回数</th>',
             '<th style="text-align:right">最終</th>']).join('');

  const body = rows.map(s => `<tr>
      <td class="head">${s.nickname}</td>
      <td class="num" style="color:#35E0D2">${s.total}</td>
      ${apps.map(a => `<td class="num">${s.perApp[a] != null ? s.perApp[a] : '—'}</td>`).join('')}
      <td class="num">${s.plays}</td>
      <td class="num">${s.last ? new Date(s.last).toLocaleDateString('ja-JP') : '—'}</td>
    </tr>`).join('');

  $('table').innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  $('table').querySelectorAll('th[data-k]').forEach(th => {
    th.addEventListener('click', () => {
      sortAsc = (th.dataset.k === sortKey) ? !sortAsc : false;
      sortKey = th.dataset.k; table();
    });
  });
}

$('csv').addEventListener('click', () => {
  const apps = (DATA.apps || []).map(a => a.app);
  const head = ['ニックネーム', '総合'].concat(apps.map(jp)).concat(['回数', '最終プレイ']);
  const lines = [head.join(',')].concat((DATA.students || []).map(s =>
    ['"' + String(s.nickname).replace(/"/g, '""') + '"', s.total]
      .concat(apps.map(a => s.perApp[a] != null ? s.perApp[a] : ''))
      .concat([s.plays, s.last ? new Date(s.last).toLocaleDateString('ja-JP') : '']).join(',')));

  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'まなびの基板_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
});

let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => DATA && draw(), 200); });
</script>
</body>
</html>
