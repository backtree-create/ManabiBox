<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>消費者クエスト 調査ファイル | 家庭科</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EC; --paper2:#EFEADE;
  --ink:#1A1712; --ink2:#3A342A;
  --shu:#C73A2A; --warn:#F5C400;
  --marker:rgba(245,196,0,.45);
  --line:#D8D2C2; --band:#14110C; --ok:#2E7D46;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#2A2620;color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;line-height:1.8;
  -webkit-user-select:none;user-select:none}
body{min-height:100vh;min-height:100svh;overscroll-behavior:none}
#app{max-width:760px;margin:0 auto;height:100vh;height:100svh;height:100dvh;background:var(--paper);
  box-shadow:0 0 60px rgba(0,0,0,.5);position:relative;overflow:hidden;
  display:flex;flex-direction:column}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
   repeating-linear-gradient(0deg,transparent 0 3px,rgba(26,23,18,.012) 3px 4px),
   radial-gradient(120% 90% at 50% 0%,transparent 60%,rgba(26,23,18,.06) 100%);}
#app>*{position:relative;z-index:1}
header#hd{background:var(--band);color:var(--paper);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
#hd .t{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(14px,3.6vw,18px);letter-spacing:.06em}
#hd .t b{color:var(--warn)}
#hd .ep{font-size:clamp(10px,2.6vw,12px);color:#C9C2B0;font-weight:700}
#score{font-family:'Noto Serif JP',serif;font-weight:900;color:var(--warn);font-size:clamp(13px,3.4vw,17px);white-space:nowrap}
main#mn{flex:1;min-height:0;padding:18px 16px calc(130px + env(safe-area-inset-bottom));overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* ハブ側の「まなびの基板」ボタンと重ならないようにする */
body:has(#manabi-back) #homeBtn{display:none}
body:has(#manabi-back) header#hd{padding-left:calc(132px + env(safe-area-inset-left))}

.serif{font-family:'Noto Serif JP',serif}
h1.big{font-family:'Noto Serif JP',serif;font-weight:900;line-height:1.4;
  font-size:clamp(24px,7vw,40px);letter-spacing:.04em;margin:.4em 0}
h1.big .sub{display:block;font-size:.42em;color:var(--shu);letter-spacing:.3em;font-weight:700}
h2.sec{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(17px,4.6vw,23px);
  border-left:6px solid var(--shu);padding-left:.5em;margin:1.2em 0 .6em;letter-spacing:.04em}
p.lead{color:var(--ink2);font-size:clamp(13px,3.4vw,15px)}
.btn{display:inline-block;border:none;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;
  font-family:'Noto Serif JP',serif;font-weight:900;letter-spacing:.12em;
  font-size:clamp(14px,3.8vw,17px);padding:.75em 2em;margin:.4em .2em;
  background:var(--ink);color:var(--paper);border-radius:3px;
  box-shadow:3px 3px 0 rgba(26,23,18,.25)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(26,23,18,.25)}
.btn.accent{background:var(--shu)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn:disabled{opacity:.35;pointer-events:none}
.tag{display:inline-block;background:var(--warn);color:var(--ink);font-weight:900;
  font-size:clamp(10px,2.8vw,12px);padding:.15em .8em;letter-spacing:.15em}
.note{background:#FFF9E0;border:1px solid #E8D890;padding:.8em 1em;font-size:clamp(12px,3.2vw,14px);margin:.8em 0}
.note b{color:var(--shu)}
.note.gray{background:#EEECE4;border-color:var(--line)}

#telop{position:fixed;left:50%;touch-action:manipulation;transform:translateX(-50%);bottom:0;width:min(760px,100%);
  z-index:30;background:var(--band);border-top:4px solid var(--warn);
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:none}
#telop .who{display:inline-block;background:var(--warn);color:var(--ink);
  font-weight:900;font-size:clamp(10px,2.8vw,12px);padding:.1em .8em;letter-spacing:.12em;margin-bottom:4px}
#telop .say{color:var(--paper);font-weight:700;font-size:clamp(14px,3.8vw,17px);line-height:1.7;min-height:2.6em}
#telop .nx{position:absolute;right:14px;bottom:8px;color:var(--warn);font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}

.chat{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.msg{max-width:82%;padding:.6em .9em;border-radius:12px;font-size:clamp(13px,3.6vw,15px);
  line-height:1.7;animation:pop .25s;box-shadow:0 2px 0 rgba(26,23,18,.12)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.msg.l{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:2px}
.msg.r{align-self:flex-end;background:#E9F5DB;border:1px solid #C8DFB0;border-top-right-radius:2px}
.msg.sys{align-self:center;background:transparent;box-shadow:none;color:var(--ink2);
  font-size:clamp(11px,3vw,13px);font-weight:700}
.msg .nm{display:block;font-size:.75em;font-weight:900;color:var(--shu);margin-bottom:.2em}
.msg.r .nm{color:var(--ok)}

.doc{background:#FFFDF7;border:1px solid var(--line);box-shadow:0 4px 16px rgba(26,23,18,.12);
  padding:22px 18px;margin:12px 0;position:relative}
.doc .stampword{position:absolute;top:14px;right:16px;width:56px;height:56px;
  border:3px solid rgba(199,58,42,.55);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:rgba(199,58,42,.6);font-family:'Noto Serif JP',serif;font-weight:900;
  font-size:15px;transform:rotate(12deg);pointer-events:none}
.doc h3{font-family:'Noto Serif JP',serif;font-weight:900;text-align:center;
  font-size:clamp(16px,4.4vw,20px);letter-spacing:.2em;margin-bottom:.8em;
  border-bottom:2px solid var(--ink);padding-bottom:.4em}
.doc table{width:100%;border-collapse:collapse;font-size:clamp(12px,3.2vw,14px);margin:.6em 0}
.doc td{border:1px solid var(--line);padding:.45em .6em;vertical-align:top}
.doc td.h{background:var(--paper);font-weight:700;width:31%}
@media(max-width:420px){.doc{padding:16px 12px}.doc td{padding:.4em .45em}}
.doc .small{font-size:clamp(8px,2.2vw,9.5px);color:#6A6252;line-height:1.6;margin-top:.7em}
.doc .clause{font-size:clamp(11.5px,3.1vw,13.5px);margin:.5em 0;line-height:1.8}
.doc .sign{margin-top:1em;display:flex;justify-content:space-between;align-items:flex-end;
  font-size:clamp(12px,3.2vw,14px)}
.doc .sign .nm2{font-family:'Noto Serif JP',serif;font-weight:700;border-bottom:1px solid var(--ink);padding:0 1.2em .1em}
/* スマホ画面の再現（SMS・通販・フリマ） */
.phone{background:#111;border-radius:18px;padding:10px 10px 14px;margin:12px auto;max-width:420px;
  box-shadow:0 6px 20px rgba(0,0,0,.35)}
.phone .scr{background:#F4F2EE;border-radius:8px;overflow:hidden}
.phone .bar{background:#E4E0D8;padding:6px 12px;font-size:11px;font-weight:700;color:#555;
  display:flex;justify-content:space-between}
.phone .body{padding:12px}
.sms{background:#fff;border:1px solid #DDD6C8;border-radius:10px;border-top-left-radius:2px;
  padding:.6em .8em;font-size:clamp(12px,3.3vw,14px);line-height:1.75;max-width:95%}
.shop-hero{background:#FFE9EE;text-align:center;padding:14px 8px;border-bottom:2px solid #F0C0CC}
.shop-hero .p1{font-weight:900;color:#D6336C;font-size:clamp(22px,7vw,32px);line-height:1.3}
.shop-hero .p2{font-weight:900;font-size:clamp(12px,3.4vw,14px)}
.shop-btn{display:block;background:#D6336C;color:#fff;text-align:center;font-weight:900;
  border-radius:999px;padding:.7em;margin:10px 8px;font-size:clamp(14px,4vw,17px)}
.item-ph{background:#DDD6C8;height:120px;display:flex;align-items:center;justify-content:center;
  color:#8A8270;font-weight:900;letter-spacing:.2em;margin-bottom:8px}
.slide{background:#1B1B22;color:#fff;padding:18px 14px;margin:12px 0;text-align:center;
  box-shadow:0 4px 16px rgba(26,23,18,.2)}
.slide .s1{font-weight:900;font-size:clamp(20px,6vw,30px);color:#FFD84A;line-height:1.4}
.slide .s2{font-size:clamp(12px,3.3vw,14px);margin-top:.5em;color:#D8D8E0}

.spot{cursor:pointer;border-bottom:2px dashed transparent;transition:background .15s;padding:0 .1em}
.spot.found{background:var(--marker);border-bottom:2px solid var(--warn)}
.spot.dud{background:rgba(140,140,140,.28)}
#fusenBox{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.fusen{background:#FFF3B8;border-left:6px solid var(--warn);padding:.6em .9em;
  font-size:clamp(12px,3.2vw,14px);box-shadow:2px 3px 0 rgba(26,23,18,.12);animation:slidein .3s}
@keyframes slidein{from{transform:translateX(-14px);opacity:0}}
.fusen b{color:var(--shu)}
#spotCount{font-family:'Noto Serif JP',serif;font-weight:900;color:var(--shu);font-size:clamp(14px,4vw,18px)}

.cards{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media(min-width:560px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:.9em .9em;
  cursor:pointer;touch-action:manipulation;box-shadow:4px 4px 0 rgba(26,23,18,.2);transition:transform .1s}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(26,23,18,.2)}
.card .cn{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(14px,3.8vw,16px);
  border-bottom:2px solid var(--warn);padding-bottom:.25em;margin-bottom:.35em}
.card .cd{font-size:clamp(11px,3vw,12.5px);color:var(--ink2);line-height:1.65}
.card.correct{border-color:var(--ok);background:#EFF8EC}
.card.wrong{border-color:var(--shu);background:#FBEAE7;opacity:.7}
.gauges{display:flex;gap:14px;margin:8px 0 4px;font-size:clamp(11px,3vw,13px);font-weight:700}
.g{flex:1}
.g .lb{margin-bottom:2px}
.g .bar{height:12px;background:#E4DECC;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.g .fill{height:100%;transition:width .3s}
#gLie .fill{background:var(--ink)}
#gFua .fill{background:var(--shu)}

#cutin{position:fixed;left:0;right:0;top:38%;z-index:40;pointer-events:none;
  transform:translateX(-100%) skewX(-8deg);background:var(--shu);padding:.5em 0;text-align:center}
#cutin.go{animation:cut 1s ease forwards}
@keyframes cut{0%{transform:translateX(-100%) skewX(-8deg)}
  25%,75%{transform:translateX(0) skewX(-8deg)}
  100%{transform:translateX(100%) skewX(-8deg)}}
#cutin span{display:inline-block;color:#fff;font-family:'Noto Serif JP',serif;
  font-weight:900;font-size:clamp(22px,7vw,36px);letter-spacing:.2em;transform:skewX(8deg)}

.postcard{background:#FDFBF3;border:1px solid var(--line);box-shadow:0 4px 16px rgba(26,23,18,.12);
  padding:20px 16px;margin:12px 0;position:relative;font-size:clamp(12.5px,3.4vw,15px);line-height:2.1}
.postcard .to{font-family:'Noto Serif JP',serif;font-weight:700;font-size:1.1em;margin-bottom:.6em}
.blank{display:inline-block;min-width:6.5em;border-bottom:2px solid var(--shu);
  text-align:center;color:#B0A890;cursor:pointer;font-weight:700;padding:0 .3em}
.blank.filled{color:var(--ink);border-bottom-color:var(--ink)}
.blank.hot{animation:hotb 1s infinite}
@keyframes hotb{50%{background:rgba(245,196,0,.35)}}
.choicebar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);
  z-index:35;background:var(--band);border-top:4px solid var(--warn);
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:none;
  max-height:46svh;overflow-y:auto}
.choicebar .q{color:var(--warn);font-weight:900;font-size:clamp(12px,3.2vw,14px);margin-bottom:8px}
.choicebar .opts{display:flex;flex-wrap:wrap;gap:8px}
.copt{background:var(--paper);border:none;border-radius:3px;cursor:pointer;touch-action:manipulation;min-height:44px;
  font-weight:700;font-size:clamp(12px,3.4vw,14px);padding:.5em 1em}
.copt:active{background:var(--warn)}
.stamp{position:absolute;right:18px;bottom:14px;width:86px;height:86px;border:5px solid var(--shu);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--shu);font-family:'Noto Serif JP',serif;font-weight:900;font-size:20px;
  letter-spacing:.1em;transform:rotate(-14deg) scale(0);opacity:.9}
.stamp.on{animation:stmp .45s cubic-bezier(.2,2.2,.4,1) forwards}
@keyframes stmp{to{transform:rotate(-14deg) scale(1)}}

.cal{background:#fff;border:1px solid var(--line);margin:10px 0;padding:12px}
.cal h4{text-align:center;font-family:'Noto Serif JP',serif;font-weight:900;letter-spacing:.2em;margin-bottom:6px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:clamp(12px,3.4vw,15px)}
.cal .dow{font-weight:900;color:var(--ink2);font-size:.8em;padding:.2em 0}
.cal .d{padding:.45em 0;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:3px;cursor:pointer;font-weight:700;touch-action:manipulation}
.cal .d:active{background:var(--marker)}
.cal .d.base{background:var(--warn);color:var(--ink);cursor:default}
.cal .d.pick{background:var(--ok);color:#fff}
.cal .d.mute{color:#C0B8A0;cursor:default}
.legend{font-size:clamp(11px,3vw,12.5px);color:var(--ink2)}

/* 仕分け（やる・やらない） */
.sortItem{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:.7em .9em;margin:.5em 0;
  font-weight:700;font-size:clamp(13px,3.5vw,15px);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sortItem .sbs{display:flex;gap:6px;flex-shrink:0}
.sbtn{border:2px solid var(--ink);background:var(--paper);border-radius:3px;cursor:pointer;touch-action:manipulation;min-height:44px;
  font-weight:900;font-size:clamp(11px,3vw,13px);padding:.35em .7em}
.sbtn.do{border-color:var(--ok);color:var(--ok)}
.sbtn.dont{border-color:var(--shu);color:var(--shu)}
.sortItem.ok{background:#EFF8EC;border-color:var(--ok)}
.sortItem.ng{background:#FBEAE7;border-color:var(--shu)}
.sortItem .why{display:none;font-weight:500;font-size:.85em;color:var(--ink2);margin-top:.3em}
.sortItem.done .why{display:block}
.sortItem.done .sbs{display:none}
.sortItem.done{display:block}

.rank{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(64px,20vw,120px);
  color:var(--shu);text-align:center;line-height:1.1}
table.res{width:100%;border-collapse:collapse;margin:.8em 0;font-size:clamp(12.5px,3.4vw,15px)}
table.res td{border-bottom:1px solid var(--line);padding:.55em .3em;font-weight:700}
table.res td:last-child{text-align:right;font-family:'Noto Serif JP',serif;font-weight:900}
.pointbox{border:2px solid var(--ink);margin:.9em 0;padding:1em 1.1em;background:#fff}
.pointbox h4{font-family:'Noto Serif JP',serif;font-weight:900;color:var(--shu);margin-bottom:.4em;
  font-size:clamp(14px,3.8vw,16px)}
.pointbox li{margin-left:1.3em;font-size:clamp(12.5px,3.3vw,14.5px);margin-bottom:.35em}
.p188{background:var(--band);color:var(--paper);text-align:center;padding:1em;margin:1em 0}
.p188 .n{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(28px,9vw,44px);color:var(--warn);letter-spacing:.1em}

/* エピソード選択 */
.epGrid{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
@media(min-width:560px){.epGrid{grid-template-columns:1fr 1fr}}
.epCard{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:.9em 1em;cursor:pointer;touch-action:manipulation;
  box-shadow:4px 4px 0 rgba(26,23,18,.2);text-align:left;position:relative}
.epCard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(26,23,18,.2)}
.epCard.locked{opacity:.45;pointer-events:none;background:#EEECE4;box-shadow:none}
.epCard.locked .lk{position:absolute;right:10px;top:10px;font-size:clamp(10px,2.8vw,12px);font-weight:900;
  color:var(--ink2);border:1px solid var(--ink2);border-radius:3px;padding:.1em .6em;letter-spacing:.1em}
.epCard .no{font-family:'Noto Serif JP',serif;font-weight:900;color:var(--shu);font-size:clamp(11px,3vw,13px);letter-spacing:.2em}
.epCard .tt{font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(15px,4.2vw,18px);margin:.15em 0}
.epCard .md{font-size:clamp(11px,3vw,12.5px);color:var(--ink2)}
.epCard .rk{position:absolute;right:10px;top:8px;font-family:'Noto Serif JP',serif;font-weight:900;
  color:var(--shu);font-size:clamp(18px,5vw,24px)}
#homeBtn{flex:none;align-self:center;
  font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(15px,4vw,18px);
  line-height:1;background:transparent;color:var(--warn);border:2px solid var(--warn);
  border-radius:3px;padding:.3em .5em;cursor:pointer}
#homeBtn:active{background:rgba(245,196,0,.25)}
.fade{animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.hidden{display:none!important}

/* ===== フェーズ4：音ボタン・称号・証拠ファイル・FILE EX ===== */
#sndBtn{flex:none;align-self:center;min-height:44px;min-width:44px;cursor:pointer;touch-action:manipulation;
  font-family:'Noto Sans JP',sans-serif;font-weight:900;font-size:12px;letter-spacing:.08em;line-height:1.2;
  background:transparent;color:#C9C2B0;border:2px solid #5A5244;border-radius:3px;padding:.2em .6em;
  transition:color .2s cubic-bezier(.4,0,.2,1),border-color .2s cubic-bezier(.4,0,.2,1),transform .1s}
#sndBtn[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
#sndBtn:active{transform:scale(.97)}
.btn,.card,.epCard,.copt,.sbtn{transition:transform .1s cubic-bezier(.4,0,.2,1),box-shadow .1s,background .2s,border-color .2s}
.copt:active,.sbtn:active{transform:scale(.97)}
main#mn.tight{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.epCard .bst{font-size:clamp(11px,2.8vw,12px);font-weight:900;color:var(--ok);letter-spacing:.05em;margin-left:.6em;font-family:'Noto Sans JP',sans-serif}
/* タイトルの称号行 */
.rankRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0 0}
.rankRow .rr{display:flex;align-items:baseline;gap:.6em;background:var(--band);color:var(--paper);
  padding:.35em 1em;border-left:6px solid var(--warn);font-weight:700;font-size:clamp(12px,3.2vw,14px)}
.rankRow .rr b{font-family:'Noto Serif JP',serif;font-weight:900;color:var(--warn);font-size:1.18em;letter-spacing:.06em}
.rankRow .rr span{color:#C9C2B0;font-size:.9em}
.exBtn{min-height:44px;cursor:pointer;touch-action:manipulation;border:2px solid var(--shu);background:#fff;color:var(--shu);
  font-family:'Noto Serif JP',serif;font-weight:900;font-size:clamp(13px,3.4vw,15px);letter-spacing:.08em;
  padding:.35em 1em;border-radius:3px;box-shadow:3px 3px 0 rgba(26,23,18,.18)}
.exBtn:active{transform:scale(.97)}
.exBtn small{font-family:'Noto Sans JP',sans-serif;font-size:.8em;font-weight:700;margin-left:.5em;color:var(--ink2)}
.exBtn.locked{border-color:#B8B09C;color:#8A8270;background:#EEECE4;box-shadow:none;pointer-events:none}
.stg>*{animation:stgIn .42s cubic-bezier(.22,1,.36,1) both}
.stg>*:nth-child(2){animation-delay:.1s}.stg>*:nth-child(3){animation-delay:.2s}
.stg>*:nth-child(4){animation-delay:.3s}.stg>*:nth-child(5){animation-delay:.4s}.stg>*:nth-child(6){animation-delay:.5s}
.stg>*:nth-child(7){animation-delay:.6s}

<body>
<div id="app">
  <header id="hd">
    <button id="homeBtn" type="button" hidden title="まなびの基板へもどる">&#8962;</button>
    <div style="flex:1;min-width:0">
      <div class="t">消費者クエスト<b>█</b>調査ファイル</div>
      <div class="ep"><span id="hdEp">FILE SELECT</span></div>
    </div>

  </header>
  <main id="mn"></main>
  <div id="telop"><span class="who" id="tWho"></span><div class="say" id="tSay"></div><div class="nx">▼ タップ</div></div>
  <div class="choicebar" id="cbar"><div class="q" id="cbQ"></div><div class="opts" id="cbO"></div><div class="cbHint" id="cbH"></div></div>
  <div id="cutin"><span id="cutTxt">反論成立</span></div>
</div>

<script>
"use strict";
/* =========================================================
   消費者クエスト — 調査ファイル（全6話・データ駆動）
   相談 → 証拠しらべ → 手口特定 → 対決 → 手続き → まとめ
   ========================================================= */
const $=s=>document.querySelector(s);
const mn=$('#mn');
const G={score:0,ep:null,epIdx:0,found:0,duds:0,battleMiss:0,calMiss:0,fua:0,turn:0,clear:{}};
function addScore(n){G.score=Math.max(0,G.score+n);$('#score').textContent='SCORE '+G.score;}

/* ---------------- まなびの基板 連携 ---------------- */
const HUB={key:'consumer-quest', total:6, store:'manabi-consumer-quest'};
function hubLoad(){ try{ return JSON.parse(localStorage.getItem(HUB.store)||'{}'); }catch(e){ return {}; } }
function hubSaveLocal(o){ try{ localStorage.setItem(HUB.store, JSON.stringify(o)); }catch(e){} }
function hubBoot(){
  const rec=hubLoad();
  if(rec.ranks) G.clear=Object.assign({},rec.ranks);
  try{ localStorage.removeItem('manabi-grade:consumer-quest'); }catch(e){} /* 旧・段階上書きの掃除 */
}
/* ---------------- FILE の順次解放 ----------------
   消費生活の内容に学年配当はないため学年・段階ピルは置かない。
   FILE01 は最初から、FILE N+1 は FILE N をクリア（ランク記録あり）すると解放される。
   クリア記録は G.clear（localStorage 'manabi-consumer-quest' の ranks）を使う。 */
const hubGrade=()=>(window.LearnHub&&LearnHub.grade)?LearnHub.grade():3;
function epOpen(i){ i=Number(i); return i===0 || !!G.clear[i-1]; }
/* 配点換算: ratio = Σ(話ごとの最高得点率)/6 をハブの満点に換算（学年係数なし）。raw = 直近の得点 */
function hubScale(r, o){ return (window.LearnHub && LearnHub.scale) ? LearnHub.scale(r, o) : Math.round(Math.max(0,Math.min(1,r))*10000); }
function hubReport(epIdx, ratio, rank, epNo, rawScore){
  const rec=hubLoad();
  const ratios=rec.ratios||{};
  ratios[epIdx]=Math.max(ratios[epIdx]||0, Math.max(0,Math.min(1,ratio)));
  const ranks=Object.assign({},rec.ranks||{},G.clear);
  const done=Object.keys(ratios).length;
  let sum=0; for(const k in ratios) sum+=ratios[k];
  const best=hubScale(sum/HUB.total,{grade:0});
  hubSaveLocal({done,best,ratios,ranks});
  if(window.LearnHub && typeof LearnHub.report==='function'){
    try{ LearnHub.report({app:HUB.key, done, total:HUB.total, best, grade:hubGrade(), raw:Math.round(rawScore||0),
      note:`素点 ${Math.round(rawScore||0)} / FILE ${epNo} ランク${rank}`.slice(0,40)}); }catch(e){}
  }
}
(function(){
  const btn=document.getElementById('homeBtn');
  const cfg=window.MANABI_CONFIG||{};
  const url=cfg.hubUrl||'index.html';
  if(cfg.backLink===false) return;
  if(!window.LearnHub && !cfg.hubUrl) return;
  btn.hidden=false;
  btn.onclick=()=>{ location.href=url; };
})();
function scrollBottom(){mn.scrollTop=mn.scrollHeight;}

/* ---------------- 演出（manabi-juice.js。読めないときは何もしない） ---------------- */
const MJX=(function(){
  const nop=()=>{};
  const stub={sfx:nop,setMuted:nop,muted:()=>false,burst:nop,pop:nop,shake:nop,flash:nop,
    cutin:()=>Promise.resolve(),countUp:(el,to,o)=>{ if(el) el.textContent=(o&&o.format)?o.format(to):String(to); },
    toast:nop,banner:nop,best:()=>undefined,record:()=>({isNew:false,first:false}),title:()=>'',
    achieve:()=>false,reduced:()=>false};
  return window.MJ||stub;
})();
const APP='consumer-quest';
function reducedMotion(){
  try{ return MJX.reduced?MJX.reduced():matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
G.combo=0;
/* 正解：パーティクル＋得点ポップ（コンボで大きく） */
function good(el,pts){
  G.combo++;
  MJX.sfx(G.combo>=3?'combo':'ok');
  MJX.burst(el,{color:'#F5C400',color2:'#2E7D46',count:G.combo>=3?34:20});
  if(pts) MJX.pop(el,'+'+pts,{color:'#F5C400',size:G.combo>=3?34:26});
}
/* 誤答：揺れ＋赤フラッシュ */
function bad(el,pts){
  G.combo=0;
  MJX.sfx('ng');MJX.shake(el);MJX.flash('#C73A2A');
  if(pts) MJX.pop(el,'-'+pts,{color:'#E8604F',size:22});
}
/* まちがえた問いの記録（結果画面用） */
function noteMiss(stage,q,a,ok,why){ (G.miss=G.miss||[]).push({stage,q,a,ok,why:why||''}); }

/* ---------------- 効果音 ON/OFF ---------------- */
(function(){
  const b=document.getElementById('sndBtn');
  const paint=()=>{ const on=!MJX.muted(); b.textContent=on?'音 ON':'音 OFF'; b.setAttribute('aria-pressed',on?'true':'false'); };
  b.addEventListener('click',()=>{ MJX.setMuted(!MJX.muted()); paint(); MJX.sfx('tap'); });
  paint();
})();

/* ---------------- タイプライター（HTMLのタグを保ったまま1文字ずつ） ---------------- */
function typeHTML(el,html,done){
  el.innerHTML=html;
  const ctl={busy:()=>false,finish(){}};
  if(reducedMotion()){ if(done)done(); return ctl; }
  const nodes=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){ nodes.push([n,n.nodeValue]); n.nodeValue=''; }
  let ni=0,ci=0,cnt=0,fin=false;
  const tick=()=>{
    while(ni<nodes.length && !nodes[ni][1].length) ni++;
    if(ni>=nodes.length){ end(); return; }
    const [nd,tx]=nodes[ni]; ci++; nd.nodeValue=tx.slice(0,ci);
    if(ci>=tx.length){ ni++; ci=0; }
    if(++cnt%4===0) MJX.sfx('type');
  };
  const tm=setInterval(tick,28);
  function end(){ if(fin)return; fin=true; clearInterval(tm); nodes.forEach(([nd,tx])=>nd.nodeValue=tx); if(done)done(); }
  ctl.busy=()=>!fin; ctl.finish=end;
  return ctl;
}

let telopQueue=[],telopDone=null,telopTW=null;
function telop(lines,done){
  telopQueue=[...lines];telopDone=done||null;
  $('#telop').style.display='block';nextTelop();
}
function nextTelop(){
  if(telopTW&&telopTW.busy()){ telopTW.finish(); return; } /* 1回目のタップは全文表示 */
  if(!telopQueue.length){
    $('#telop').style.display='none';telopTW=null;
    const d=telopDone;telopDone=null;if(d)d();return;
  }
  const [who,say]=telopQueue.shift();
  $('#tWho').textContent=who;
  telopTW=typeHTML($('#tSay'),say);
}
$('#telop').addEventListener('pointerdown',e=>{e.preventDefault();nextTelop();});

/* ---------------- ページ送りオーバーレイ（証拠ファイル・まちがえた問い） ---------------- */
const OVL=(function(){
  const o=document.createElement('div');o.id='ovl';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.innerHTML=`<div class="pan"><div class="ovh"><div class="ttl" id="ovT"></div><div class="pg" id="ovP"></div>
    <button class="ovx" id="ovX" type="button" aria-label="とじる">×</button></div>
    <div class="ovb" id="ovB"></div>
    <div class="ovf"><button class="btn ghost" id="ovPrev" type="button">◀ 前</button><div class="dots" id="ovD"></div>
    <button class="btn" id="ovNext" type="button">次 ▶</button></div></div>`;
  document.body.appendChild(o);
  let pages=[],idx=0;
  const q=s=>o.querySelector(s);
  function show(i,back){
    idx=Math.max(0,Math.min(pages.length-1,i));
    q('#ovB').innerHTML=`<div class="in${back?' back':''}">${pages[idx]}</div>`;
    q('#ovP').textContent=`${idx+1} / ${pages.length}`;
    q('#ovD').innerHTML=pages.map((_,k)=>`<i class="${k===idx?'on':''}"></i>`).join('');
    q('#ovPrev').disabled=idx===0;
    q('#ovNext').textContent=idx===pages.length-1?'とじる':'次 ▶';
  }
  function close(){ o.classList.remove('on'); }
  q('#ovX').onclick=close;
  q('#ovPrev').onclick=()=>{ if(idx>0){ MJX.sfx('page'); show(idx-1,true); } };
  q('#ovNext').onclick=()=>{ if(idx<pages.length-1){ MJX.sfx('page'); show(idx+1); } else close(); };
  o.addEventListener('pointerdown',e=>{ if(e.target===o) close(); });
  document.addEventListener('keydown',e=>{
    if(!o.classList.contains('on'))return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowRight')q('#ovNext').click();
    else if(e.key==='ArrowLeft')q('#ovPrev').click();
  });
  return {open(title,pg,start){
    if(!pg.length)return;
    pages=pg;q('#ovT').textContent=title;show(start||0);
    MJX.sfx('page');o.classList.add('on');
  }};
})();
function missPages(list){
  return list.map(m=>`<span class="evk">${m.stage}</span>
    <div class="evq">${m.q}</div>
    <div class="eva">選んだ答え：${m.a}</div>
    <div class="evo">正解：${m.ok}</div>
    ${m.why?`<div class="eve">${m.why}</div>`:''}`);
}
function cutin(txt,color){
  const c=$('#cutin');
  c.style.background=color||'var(--shu)';
  $('#cutTxt').textContent=txt;
  c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
}
</script>

"use strict";
/* ================= エンジン ================= */
function epMax(ep){
  const spotsN=Object.keys(ep.spots).length;
  let f=0;
  if(ep.final.type==='sortlist')f=ep.final.items.length*40;
  else f=Object.keys(ep.final.blanks).length*50+(ep.final.cal?150:0);
  return spotsN*100+100+ep.battle.length*200+f;
}
function rankOf(sc,ep){
  const r=sc/epMax(ep);
  if(r>=0.92)return['S','完璧な相談員ぶり。センター長も舌を巻いている。'];
  if(r>=0.75)return['A','見事な解決！ 知識カードの使い方が正確だった。'];
  if(r>=0.55)return['B','無事解決。証拠しらべの精度を上げるとさらに上へ。'];
  return['C','解決はできた。まとめを読み直してリベンジしよう。'];
}

/* ---------- 称号・自己ベスト ---------- */
const TITLES=[{min:0,name:'見習い相談員'},{min:4,name:'相談員'},{min:12,name:'主任相談員'},{min:22,name:'消費生活アドバイザー'}];
const RK_PT={S:4,A:3,B:2,C:1}; /* 解決した FILE のランクを点数化（最大 24） */
function clearedN(){ return EPIS.filter((_,i)=>!!G.clear[i]).length; }
function rankPts(){ let s=0; EPIS.forEach((_,i)=>{ s+=RK_PT[G.clear[i]]||0; }); return s; }
function curTitle(){ return MJX.title(APP,TITLES,rankPts())||TITLES[0].name; }
function seedBest(){ /* 既存の記録（得点率）を自己ベストに引き継ぐ */
  const r=(hubLoad().ratios)||{};
  for(const k in r){ if(MJX.best(APP,'file'+k)===undefined) MJX.record(APP,'file'+k,Math.round(r[k]*100)); }
}
function stripTags(s){ const d=document.createElement('div'); d.innerHTML=s; return d.textContent; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function missBoxHTML(list,limit){
  if(!list.length) return `<div class="nomiss">今回まちがえた問い：なし（ノーミス）</div>`;
  const li=list.slice(0,limit).map(m=>`<li><span class="st">${m.stage}</span>${stripTags(m.a)} → <span class="ok">${stripTags(m.ok)}</span></li>`).join('');
  return `<div class="missBox"><h4>今回まちがえた問い（${list.length}）</h4><ul>${li}${list.length>limit?`<li>ほか ${list.length-limit} 件</li>`:''}</ul>
    <button class="btn" id="missBtn" type="button">解説つきで見返す</button></div>`;
}

function scSort(){
  const ep=G.ep,f=ep.final;
  mn.innerHTML=`
   <div class="fade">

     <p class="lead">${f.lead}</p>

   </div>`;
  const box=$('#sortBox');
  let done=0;
  [...f.items].sort(()=>Math.random()-.5).forEach(it=>{
    const d=document.createElement('div');
    d.className='sortItem';
    d.innerHTML=`<span>${it.t}</span>
      <span class="sbs">
        <button class="sbtn do">やる</button>
        <button class="sbtn dont">やらない</button>
      </span>
      <div class="why"></div>`;
    const judge=ansDo=>{
      if(d.classList.contains('done'))return;
      d.classList.add('done');
      const correct=(ansDo===it.ok);
      d.classList.add(correct?'ok':'ng');
      addScore(correct?40:-30);
      if(correct) good(d,40);
      else { bad(d,30); noteMiss('仕分け',it.t,ansDo?'やる':'やらない',it.ok?'やる':'やらない',it.why); }
      d.querySelector('.why').innerHTML=(correct?'<b>正解。</b>':'<b>おっと、逆だ。</b>')+it.why;
      done++;
      if(done>=f.items.length){
        $('#goRes').classList.remove('hidden');
        scrollBottom();
      }
    };
    d.querySelector('.do').onclick=()=>judge(true);
    d.querySelector('.dont').onclick=()=>judge(false);
    box.appendChild(d);
  });
  $('#goRes').onclick=scResult;
}

  mn.innerHTML=`
   <div class="fade">
     <div style="text-align:center;margin-top:1em"><span class="tag">FILE ${ep.no} CLOSED</span></div>
     <h2 class="sec">解決報告</h2>
     <p class="lead">${ep.resultLead}</p>
     <table class="res">
       <tr><td>SCORE</td><td><span id="resSc">0</span> / ${epMax(ep)}</td></tr>
       <tr><td>証拠の誤マーカー</td><td>${G.duds} 回</td></tr>
       <tr><td>反論ミス</td><td>${G.battleMiss} 回</td></tr>
     </table>
     <div class="rank">${rk}</div>
     <p class="lead" style="text-align:center;font-weight:700">${msg}</p>
     ${missBoxHTML(miss,5)}
     <div class="pointbox">
       <h4>テストに出る！ FILE ${ep.no} のまとめ</h4>
       <ul>${sm}</ul>
     </div>
     <div class="p188">こまったら、消費者ホットライン<div class="n">１８８</div>（いやや！）　最寄りの消費生活センターにつながる</div>
     <div style="text-align:center;margin:1em 0">
       ${nextBtn}
       <button class="btn" id="goRetry">もう一度</button>
       <button class="btn ghost" id="goTitle">ファイル選択へ</button>
     </div>
   </div>`;
  mn.scrollTop=0;
  if(miss.length) $('#missBtn').onclick=()=>OVL.open('今回まちがえた問い',missPages(miss));
  if(nextIdx<EPIS.length&&epOpen(nextIdx))$('#goNext').onclick=()=>startEp(nextIdx);
  $('#goRetry').onclick=()=>startEp(G.epIdx);
  $('#goTitle').onclick=scTitle;
  MJX.cutin({title:'事件解決',sub:`FILE ${ep.no} CLOSED`,rank:rk,color:'#C73A2A'}).then(()=>{
    MJX.countUp($('#resSc'),G.score,{ms:900});
    if(rec.isNew) MJX.banner(`新記録 ${pct}%`,{color:'#C73A2A'});
    if(!miss.length) MJX.achieve(APP,'nomiss','ノーミス解決');
    if(clearedN()>=EPIS.length) MJX.achieve(APP,'allclear','全FILE解決');
    curTitle();
  });
}

/* ================= FILE EX まとめの復習テスト =================
   全6話の解決で解放。各話の要点を4択で確認する。
   ハブ送信の分母（6話）には含めない（hubReport は呼ばない）。
   opts[0] が正解（表示時にシャッフル）。                      */
const EXQ=[
 {f:'01',q:'訪問販売（キャッチセールスもふくむ）で、クーリングオフの説明が書かれた書面を<b>4月10日</b>に受け取った。クーリングオフができる<b>最終日</b>は？',
  opts:['4月17日','4月18日','4月24日','4月30日'],
  exp:'訪問販売は<b>書面を受け取った日から8日間</b>。受け取った日（10日）を1日目と数えるので、8日目は<b>4月17日</b>。'},
 {f:'04',q:'マルチ商法（連鎖販売取引）のクーリングオフ期間は？',
  opts:['書面を受け取った日から20日間','書面を受け取った日から8日間','書面を受け取った日から14日間','契約した日から30日間'],
  exp:'連鎖販売取引は<b>20日間</b>。訪問販売・キャッチセールスの<b>8日間</b>とセットで覚えよう。'},
 {f:'03',q:'ネット通販（通信販売）で買った商品について、正しいものは？',
  opts:['クーリングオフの制度はなく、返品できるかは販売サイトの返品ルール（返品特約）による','8日以内ならクーリングオフで無条件に解約できる','20日以内ならクーリングオフで解約できる','開封していなければ、いつでも返品できる'],
  exp:'通信販売は自分で比べて申し込む取引なので<b>クーリングオフは無い</b>。返品のルールは広告や最終確認画面の表示で、注文前に確認する。'},
 {f:'03',q:'ネット通販の定期購入。2022年6月からのルールで、注文を確定する直前の画面（最終確認画面）にはっきり表示しなければならないのは？',
  opts:['回数・総額・解約方法などの契約内容','ほかの購入者の口コミ','商品をつくった工場の住所','販売会社の社長の名前'],
  exp:'最終確認画面には<b>分量（回数）・価格（総額）・支払時期・解約方法</b>などの表示が義務。誤解させる表示で申し込んだときは、<b>申込みを取り消せる</b>。'},
 {f:'02',q:'契約が成立するのは、どんなとき？',
  opts:['申込みと承諾の意思が合ったとき（口約束でも成立する）','契約書にサインしたときだけ','代金を支払ったとき','商品を受け取ったとき'],
  exp:'契約は<b>申込みと承諾の合意</b>で成立し、<b>口約束でも成立</b>する。金額や条件を知らされずにリンクを押しただけでは合意がなく、契約は成立していない。'},
 {f:'02',q:'スマホに身に覚えのない請求（架空請求）が届いた。正しい対応は？',
  opts:['連絡も支払いもせず、画面を保存して家族や188に相談する','書かれた番号に電話して、まちがいだと伝える','少しだけ払って様子を見る','退会フォームに名前と住所を入力する'],
  exp:'連絡すると個人情報を知られ、さらにねらわれる。<b>払わない・連絡しない・個人情報を渡さない</b>。ただし<b>裁判所からの特別送達</b>（支払督促など）だけは放置せず、すぐ相談する。'},
 {f:'01',q:'2022年4月からの成年年齢と、成年になると変わることの組み合わせで正しいのは？',
  opts:['18歳。親の同意なく契約でき、未成年者取消しは使えなくなる','20歳。それまでは親の同意がない契約を取り消せる','18歳。ただし20歳までは未成年者取消しが使える','16歳。高校生から一人で契約できる'],
  exp:'成年年齢は<b>18歳</b>。18歳から一人で契約できる一方、<b>未成年者取消しは使えない</b>。だからこそ契約は慎重に。'},
 {f:'05',q:'フリマアプリで届いた商品が、説明とちがう偽物だった。まずすべきことは？',
  opts:['受取評価をせず、写真を撮って運営事務局に連絡する','先に受取評価をしてから、出品者と話し合う','アプリの外で出品者と直接やりとりして返金してもらう','出品者にクーリングオフの通知を送る'],
  exp:'受取評価をすると<b>代金が出品者に渡り</b>、補償を受けにくくなる。個人間取引は<b>クーリングオフの対象外</b>。やりとりは<b>アプリの中で</b>。'},
 {f:'06',q:'注文していない商品が一方的に届き、代金の請求書が入っていた（送り付け商法）。正しいものは？',
  opts:['代金を払う必要はなく、すぐに処分してもよい','14日間保管してから返送しなければならない','開封したら代金を払わなければならない','受け取った以上、代金を払う義務がある'],
  exp:'2021年7月の法改正で、注文していない商品は<b>直ちに処分してよい</b>ことになった。<b>支払いも返送も不要</b>。「14日間保管」は改正前の古いルール。'},
 {f:'06',q:'「今夜にも天井が落ちる」など、事実とちがう説明を信じて結んだ契約は？',
  opts:['不実告知として、消費者契約法で取り消せる','自分でサインしたので、取り消せない','工事が終わったあとでなければ取り消せない','業者が認めたときだけ取り消せる'],
  exp:'大事なことについて<b>事実とちがう説明（不実告知）</b>を信じて結んだ契約は、<b>消費者契約法</b>で取り消せる。訪問販売なら8日間のクーリングオフも使える。'},
 {f:'共通',q:'消費生活のトラブルで困ったときに相談できる「消費者ホットライン」の電話番号は？',
  opts:['188','110','119','118'],
  exp:'<b>188（いやや！）</b>は、近くの消費生活センターなどの相談窓口につながる。110は警察、119は消防・救急、118は海上保安庁への緊急通報。'},
];
let EX=null;
function exRank(c,n){ return c>=n?'S':c>=n-2?'A':c>=Math.ceil(n*0.6)?'B':'C'; }
function scEx(){
  EX={i:0,order:shuffle(EXQ),ok:0,miss:[]};
  G.ep=null;G.combo=0;G.score=0;addScore(0);
  mn.classList.add('tight');
  $('#hdEp').textContent='FILE EX｜まとめの復習テスト';
  exQ();
}
function exQ(){
  const q=EX.order[EX.i],n=EX.order.length;
  MJX.sfx('page');
  const opts=shuffle(q.opts.map((t,k)=>({t,ok:k===0})));
  mn.innerHTML=`
   <div class="fade">
     <div class="exTop"><h2 class="sec">FILE EX｜まとめテスト</h2><span class="exNo">Q${EX.i+1} / ${n}</span></div>
     <div class="exBar"><i style="width:${EX.i/n*100}%"></i></div>
     <p class="exQ"><span class="exFrom">${q.f==='共通'?'共通':'FILE '+q.f}</span>${q.q}</p>
     <div class="exOpts stg" id="exO"></div>
     <div id="exFb"></div>
   </div>`;
  mn.scrollTop=0;
  const box=$('#exO');
  opts.forEach((o,k)=>{
    const b=document.createElement('button');
    b.type='button';b.className='exOpt';
    b.innerHTML=`<span class="k">${'ABCD'[k]}</span><span>${o.t}</span>`;
    b.onclick=()=>{
      box.querySelectorAll('.exOpt').forEach((x,j)=>{
        x.disabled=true;
        if(opts[j].ok) x.classList.add('correct');
        else if(x!==b) x.classList.add('dim');
      });
      const okText=q.opts[0];
      if(o.ok){
        EX.ok++;addScore(100);good(b,100);
        $('#exFb').innerHTML=`<div class="note"><b>正解！</b>${q.exp}</div>`;
      } else {
        b.classList.add('wrong');bad(b,0);
        EX.miss.push({stage:q.f==='共通'?'共通':'FILE '+q.f,q:q.q,a:o.t,ok:okText,why:q.exp});
        $('#exFb').innerHTML=`<div class="note"><b>ちがう。</b>正解は「${okText}」。<br>${q.exp}</div>`;
      }
      const last=EX.i>=n-1;
      $('#exFb').insertAdjacentHTML('beforeend',`<div style="text-align:right"><button class="btn accent" id="exNx" type="button">${last?'結果を見る':'次の問題 ▶'}</button></div>`);
      $('#exNx').onclick=()=>{ if(last) exResult(); else { EX.i++; exQ(); } };
    };
    box.appendChild(b);
  });
}
function exResult(){
  const n=EX.order.length,c=EX.ok,rk=exRank(c,n);
  const rec=MJX.record(APP,'ex',c);
  MJX.sfx('page');
  mn.innerHTML=`
   <div class="fade">
     <div style="text-align:center"><span class="tag">FILE EX CLOSED</span></div>
     <h2 class="sec">まとめテスト｜結果</h2>
     <div class="exScore"><span id="exSc">0</span><small> / ${n} 問正解</small></div>
     <div class="rank" style="font-size:clamp(56px,14vw,92px)">${rk}</div>
     ${missBoxHTML(EX.miss,3)}
     <div style="text-align:center;margin-top:.6em">
       <button class="btn accent" id="exRetry" type="button">もう一度</button>
       <button class="btn ghost" id="exTitle" type="button">ファイル選択へ</button>
     </div>
   </div>`;
  if(EX.miss.length) $('#missBtn').onclick=()=>OVL.open('まちがえた問い｜FILE EX',missPages(EX.miss));
  $('#exRetry').onclick=scEx;
  $('#exTitle').onclick=scTitle;
  MJX.cutin({title:'まとめテスト完了',sub:`${c} / ${n} 問正解`,rank:rk,color:'#C73A2A'}).then(()=>{
    MJX.countUp($('#exSc'),c,{ms:700});
    if(rec.isNew) MJX.banner(`新記録 ${c} / ${n}`,{color:'#C73A2A'});
    if(c>=n) MJX.achieve(APP,'exfull','FILE EX 満点');
  });
}

hubBoot();
seedBest();
scTitle();

</script>
